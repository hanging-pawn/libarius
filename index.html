<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>libarius — Rezeptverwaltung</title>
<style>
:root{
  --bg:#faf8f5; --panel:#fff; --line:#e4ded6; --ink:#2a2724; --muted:#7a716a;
  --accent:#8c4a2f; --accent-soft:#f3e7e1;
  --gruen:#3f7d4e; --gelb:#b8860b; --rot:#a63a2b;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1a1816;--panel:#232019;--line:#3a342c;--ink:#ece6df;--muted:#a2988e;
        --accent:#d98b62;--accent-soft:#332721;--shadow:0 1px 2px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
header.app{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding:.7rem 1rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
header.app h1{font-size:1.05rem;margin:0;font-weight:650;letter-spacing:-.01em}
header.app .badge{font-size:.72rem;color:var(--muted);border:1px solid var(--line);
  border-radius:99px;padding:.15rem .55rem}
.spacer{flex:1}
.railtoggle{display:none;background:transparent;color:var(--ink);border:1px solid var(--line);
  border-radius:8px;min-width:44px;min-height:44px;align-items:center;justify-content:center;
  font-size:1.05rem}
#btnVollbildEnde{display:none;position:fixed;top:.6rem;right:.6rem;z-index:11;min-height:44px}
body.vollbild #btnVollbildEnde{display:inline-flex;align-items:center}

/* ---------- AP-0301: Grundgerüst dreispaltig (nach AP-0201 §2, §4) --------
   #hauptraster ist main selbst (grid, drei Spalten: Schiene links, Inhalt,
   Schiene rechts). Bereiche mit "zu"-Zustand verschwinden bei M/K per
   display:none aus dem Grid (Spalte fällt automatisch auf 0 zusammen);
   bei W bleibt eine schmale, klickbare Spindel stehen (§2.3 Wireframe). */
main#hauptraster{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  align-items:start;gap:1.1rem;max-width:1600px;margin:0 auto;padding:1rem}
.inhalt{grid-column:2;min-width:0;max-width:760px;margin:0 auto;width:100%}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;position:sticky;top:4.6rem;
  max-height:calc(100vh - 5.2rem);display:flex;flex-direction:column}
.rail--links{grid-column:1;width:280px}
.rail--rechts{grid-column:3;width:340px}
.railkopf{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  padding:.5rem .6rem;border-bottom:1px solid var(--line);flex:none}
.railkopf .lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:650;padding:0 .3rem}
.railtabs{display:flex;gap:.35rem}
.railtab{background:transparent;color:var(--muted);border:1px solid var(--line);
  padding:.4rem .7rem;min-height:44px;min-width:44px;border-radius:8px;font-size:.85rem;
  font-weight:600;cursor:pointer}
.railtab.aktiv{background:var(--accent);color:#fff;border-color:var(--accent)}
.railspindel{background:transparent;color:var(--ink);border:0;min-width:44px;min-height:44px;
  cursor:pointer;font-size:1rem}
.railclose{background:transparent;color:var(--muted);border:0;min-width:44px;min-height:44px;
  font-size:1.1rem;cursor:pointer}
.railinhalt{overflow-y:auto;flex:1}
.rail .empty{padding:1.2rem .9rem;color:var(--muted);font-size:.88rem}
.scrim{position:fixed;inset:0;background:rgba(20,16,12,.4);z-index:9}
.scrim[hidden]{display:none}

@media (max-width:1279px){
  .railtoggle{display:inline-flex}
  body[data-links="zu"] .rail--links,
  body[data-rechts="zu"] .rail--rechts{display:none}
}
@media (min-width:860px) and (max-width:1279px){
  .rail--links,.rail--rechts{width:300px}
}
@media (max-width:859px){
  .rail{position:fixed;top:0;bottom:0;width:88vw;max-width:420px;max-height:none;
    border-radius:0;z-index:10}
  .rail--links{left:0} .rail--rechts{right:0}
}
@media (min-width:1280px){
  body[data-links="zu"] .rail--links{width:2.6rem}
  body[data-links="zu"] .rail--links .railinhalt,
  body[data-links="zu"] .rail--links .railclose{display:none}
  body[data-links="zu"] .rail--links .lbl{writing-mode:vertical-rl;text-orientation:mixed;padding:.4rem 0}
  body[data-rechts="zu"] .rail--rechts{width:2.6rem}
  body[data-rechts="zu"] .rail--rechts .railinhalt,
  body[data-rechts="zu"] .rail--rechts .railtabs,
  body[data-rechts="zu"] .rail--rechts .railclose{display:none}
}
/* Regel Entwicklungsmodus/K (AP-0201 §2.2, Vorentscheid für AP-0204): auf schmalen
   Bildschirmen ist B6 nicht erreichbar — der Reiter bleibt sichtbar, zeigt aber den
   Drehhinweis statt Inhalt. Nichts wird verworfen (kein Löschen, nur CSS-Ausblendung). */
@media (max-width:859px){
  #panelEntwicklung .entw-inhalt{display:none}
  #panelEntwicklung::after{content:"Entwicklungsmodus im Querformat verfügbar — Gerät drehen.";
    display:block;padding:1.2rem .9rem;color:var(--muted);font-size:.88rem}
}
body.vollbild header.app,body.vollbild .rail,body.vollbild .scrim{display:none}
body.vollbild{font-size:22px;line-height:1.7}
body.vollbild table.zutaten td.menge{font-size:26px}
body.vollbild main#hauptraster{grid-template-columns:minmax(0,1fr);padding:1.2rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:1rem;overflow:hidden}
.card > h2{margin:0;padding:.7rem 1rem;font-size:.82rem;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);font-weight:650}
.card .body{padding:1rem}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:.55rem .7rem;min-height:44px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
button,label.ghost{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:.6rem 1rem;
  min-height:44px;cursor:pointer;font-weight:550;box-sizing:border-box}
button.ghost,label.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button:hover{filter:brightness(1.06)}
.filters{display:flex;gap:.6rem;flex-wrap:wrap}
.filters input{flex:1;min-width:180px}
ul.recipes{list-style:none;margin:0;padding:0}
ul.recipes li{border-bottom:1px solid var(--line)}
ul.recipes li:last-child{border-bottom:0}
ul.recipes button{width:100%;background:transparent;color:inherit;text-align:left;
  padding:.85rem 1rem;display:flex;gap:.75rem;align-items:baseline;border-radius:0}
ul.recipes button:hover{background:var(--accent-soft)}
ul.recipes .nm{font-weight:600}
ul.recipes .meta{color:var(--muted);font-size:.85rem;margin-left:auto;white-space:nowrap}
/* ---------- AP-0302: Navigation gruppiert nach Kategorie, Einkaufsliste --------
   .navgruppe folgt demselben Aufklapp-Muster wie details.phase (§4.1 bleibt bestehen) —
   eigene Klasse statt Wiederverwendung, weil Grösse/Farbe fuer eine Rubrik in der
   Schiene anders wirken als fuer eine Rezeptphase in der Mitte. */
.navgruppe{border-bottom:1px solid var(--line)}
.navgruppe:last-child{border-bottom:0}
.navgruppe > summary{cursor:pointer;padding:.6rem .9rem;font-weight:650;list-style:none;
  display:flex;align-items:center;gap:.4rem;min-height:44px;font-size:.78rem;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.navgruppe > summary::-webkit-details-marker{display:none}
.navgruppe > summary::before{content:"▸";color:var(--accent);transition:transform .15s;font-size:1rem}
.navgruppe[open] > summary::before{transform:rotate(90deg)}
.navgruppe .anzahl{margin-left:auto;font-weight:600}
.navgruppe-fehler{border-top:1px solid var(--line)}
ul.einkaufsliste{list-style:none;margin:0;padding:0}
ul.einkaufsliste li{border-bottom:1px solid var(--line)}
ul.einkaufsliste li:last-child{border-bottom:0}
ul.einkaufsliste label{display:flex;align-items:baseline;gap:.6rem;padding:.6rem .9rem;
  cursor:pointer;min-height:44px}
ul.einkaufsliste input[type=checkbox]{min-height:auto;min-width:auto;width:1.15rem;height:1.15rem;
  accent-color:var(--accent);flex:none}
ul.einkaufsliste .nm{flex:1}
ul.einkaufsliste .menge{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.9rem}
ul.einkaufsliste li.abgehakt .nm,ul.einkaufsliste li.abgehakt .menge{color:var(--muted);text-decoration:line-through}
/* ---------- AP-0303: Notizsection (B4) — Mengenkorrekturen, durchgestrichene Sollmenge --- */
.korrekturphase h4{margin:.9rem 0 .3rem;font-size:.75rem;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted);font-weight:650}
.korrekturphase:first-child h4{margin-top:0}
.korrekturzeile{display:flex;align-items:center;gap:.5rem;padding:.4rem 0;
  border-bottom:1px dashed var(--line);flex-wrap:wrap}
.korrekturzeile:last-child{border-bottom:0}
.korrekturzeile .nm{flex:1;min-width:8rem}
.korrekturzeile input[type=number]{width:6rem;flex:none}
.korrekturzeile .einheit{color:var(--muted);font-size:.85rem;width:1.6rem}
/* korrigierte Menge steht an der Stelle der Sollmenge (fett wie bisher, unveraendert durch
   table.zutaten td.menge), die alte Sollmenge daneben durchgestrichen und kleiner (AP-0201 §3.2). */
.korrektur-soll{color:var(--muted);font-size:.8rem;font-weight:400;margin-left:.3rem;white-space:nowrap}
.korrektur-soll s{text-decoration:line-through}
.navgruppe .punkt{color:var(--accent);margin-left:.3rem}
.empty{padding:1.5rem 1rem;color:var(--muted);text-align:center}
.rezeptkopf h2{margin:0 0 .2rem;font-size:1.5rem;letter-spacing:-.02em}
.rezeptkopf .sub{color:var(--muted);font-size:.9rem}
.scaler{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.9rem;
  padding-top:.9rem;border-top:1px solid var(--line)}
.scaler label{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:.25rem}
.scaler input{width:8rem}
details.phase{border-bottom:1px solid var(--line)}
details.phase:last-child{border-bottom:0}
details.phase > summary{cursor:pointer;padding:.8rem 1rem;font-weight:600;list-style:none;
  display:flex;align-items:center;gap:.5rem;min-height:44px}
details.phase > summary::-webkit-details-marker{display:none}
details.phase > summary::before{content:"▸";color:var(--accent);transition:transform .15s}
details.phase[open] > summary::before{transform:rotate(90deg)}
.phasebody{padding:0 1rem 1rem}
table.zutaten{width:100%;border-collapse:collapse;margin-bottom:.8rem}
table.zutaten td{padding:.35rem 0;border-bottom:1px dashed var(--line);vertical-align:baseline}
table.zutaten td.menge{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;
  font-weight:600;width:9rem}
table.zutaten td.pct{text-align:right;color:var(--muted);font-size:.82rem;width:4.5rem;
  font-variant-numeric:tabular-nums}
.warn-inline{color:var(--rot);font-size:.78rem;margin-left:.4rem}
.fodmap-ampel{margin-left:.35rem;font-size:.8rem;cursor:default}
ol.schritte{margin:0;padding-left:1.3rem}
ol.schritte li{margin:.3rem 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.75rem}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem}
.kpi .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-size:1.15rem;font-weight:650;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:.82rem;margin-top:.6rem}
/* ---------- AP-0304: Metadaten-Ausklapper (B5, AP-0201 §1) ---------------------
   Naehrwerte, Kosten, Verfahren & Protokoll, Herkunft und Hinweise stehen nicht mehr
   als eigene Karten im Fluss, sondern als <details>-Stapel UNTER der Rezeptur — damit
   die Rezeptur selbst moeglichst vollstaendig sichtbar bleibt (O-13). Alle Bloecke
   sind standardmaessig zu, der Zustand je Block wird geraetelokal gemerkt.
   Optik: EINE Karte, deren Zeilen die Zusammenfassungen sind — nicht fuenf Kartenraender
   untereinander, das waere optisch schwerer als die Rezeptur darueber. */
.metastapel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:1rem;overflow:hidden}
details.metablock{border-bottom:1px solid var(--line)}
details.metablock:last-child{border-bottom:0}
details.metablock > summary{cursor:pointer;padding:.7rem 1rem;list-style:none;
  display:flex;align-items:center;gap:.5rem;min-height:44px;font-size:.82rem;
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}
details.metablock > summary::-webkit-details-marker{display:none}
details.metablock > summary::before{content:"\25b8";color:var(--accent);transition:transform .15s;font-size:1rem}
details.metablock[open] > summary::before{transform:rotate(90deg)}
details.metablock > summary:hover{background:var(--accent-soft)}
/* Kurzwert rechts in der Zusammenfassung: der wichtigste Wert des Blocks bleibt auch im
   zugeklappten Zustand lesbar — sonst muesste man fuer "was kostet das" wieder aufklappen. */
.metablock .metakurz{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:550;
  color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.metabody{padding:0 1rem 1rem}
.metabody > .hint:first-child{margin-top:0}
dl.herkunft{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.35rem .9rem;font-size:.9rem}
dl.herkunft dt{color:var(--muted)}
dl.herkunft dd{margin:0;overflow-wrap:anywhere}
table.log{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.log th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);font-weight:600;padding:.3rem 0;border-bottom:1px solid var(--line)}
table.log td{padding:.45rem 0;border-bottom:1px solid var(--line)}
table.log td.num{text-align:right}
/* AP-0313: Vergleichstabelle. Mehrere Referenzspalten passen auf dem iPad nicht nebeneinander —
   die Tabelle scrollt darum in ihrem eigenen Container statt die Seite breit zu machen.
   Die Markierung «> 20 % Abweichung» trägt zusätzlich zur Farbe eine Glyphe und Fettschrift,
   damit sie den Schwarz-Weiss-Druck aus AP-0306 überlebt. */
.tabellescroll{overflow-x:auto}
table.vergleich td,table.vergleich th{padding-right:.9rem;white-space:nowrap}
table.vergleich td.abw{color:var(--rot);font-weight:600}
table.vergleich td.abw::after{content:" ▲";font-size:.75rem}
table.vergleich tr.gruppe td{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);font-weight:600;padding-top:.8rem}
.refchip{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);
  border-radius:999px;padding:.15rem .3rem .15rem .6rem;margin:0 .4rem .4rem 0;font-size:.85rem}
.refliste{max-height:11rem;overflow-y:auto;border:1px solid var(--line);border-radius:8px;
  margin-top:.5rem}
.refliste button{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);padding:.45rem .6rem;font:inherit;color:inherit;cursor:pointer}
.refliste button:hover{background:var(--accent-soft)}
.refliste button:last-child{border-bottom:0}
.actions{display:flex;gap:.6rem;flex-wrap:wrap}
#meldungen:empty{display:none}
#meldungen{margin-bottom:1rem}
.msg{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;
  padding:.7rem .9rem;margin-bottom:.5rem;background:var(--panel);font-size:.9rem}
.msg.err{border-left-color:var(--rot)} .msg.warn{border-left-color:var(--gelb)}
.msg.ok{border-left-color:var(--gruen)}
.msg b{display:block;margin-bottom:.15rem}
li.fehlerzeile{padding:.85rem 1rem;display:flex;gap:.75rem;align-items:baseline;color:var(--muted)}
li.fehlerzeile .nm{font-weight:600;color:var(--ink)}
textarea.importtext{width:100%;min-height:10rem;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;resize:vertical}
.importfehler{list-style:none;margin:0;padding:0}
.importfehler li{padding:.4rem 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.importfehler li code{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:.05rem .35rem;font-size:.82rem}
.zuordnungzeile{display:flex;gap:.6rem;align-items:center;padding:.4rem 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.zuordnungzeile .nm{font-weight:600;min-width:10rem}
.zuordnungzeile select{flex:1;min-width:180px}
.importvorschau{border:1px solid var(--line);border-radius:8px;padding:.8rem .9rem;margin-top:.6rem}
.importvorschau h3{margin:0 0 .3rem;font-size:1rem}
/* ---------- AP-0305: Zutaten-Editor (zeilenweise, je Phase) ------------------------
   Reihen wie .korrekturzeile/.zuordnungzeile (gleiches Muster, eigene Klasse weil hier
   vier statt zwei Felder je Zeile stehen). Editierbare Phase ersetzt table.zutaten/
   ol.schritte 1:1 an derselben Stelle im Markup (View.rezept()). */
.editorphase{border-bottom:1px solid var(--line);padding:.8rem 0}
.editorphase:last-child{border-bottom:0}
.editorphase h4{margin:0 0 .5rem;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.editorzeile{display:flex;gap:.5rem;align-items:center;padding:.35rem 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.editorzeile:last-child{border-bottom:0}
.editorzeile input[type=text]{flex:1;min-width:9rem}
.editorzeile input[type=number]{width:6rem;flex:none}
.editorzeile select{flex:none;width:5.5rem}
.editorzeile button.entfernen{background:transparent;color:var(--rot);border:1px solid var(--line);
  min-width:2.4rem;min-height:2.4rem;padding:0;flex:none}
.editorschritt{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem 0}
.editorschritt input[type=text]{flex:1}
.editorschritt button.entfernen{background:transparent;color:var(--rot);border:1px solid var(--line);
  min-width:2.4rem;min-height:2.4rem;padding:0;flex:none}
.editorhinzu{margin-top:.4rem}
.editorfehler{list-style:none;margin:.6rem 0 0;padding:0;font-size:.85rem}
.editorfehler li{padding:.2rem 0;color:var(--rot)}
.editorwarnung{list-style:none;margin:.6rem 0 0;padding:0;font-size:.85rem}
.editorwarnung li{padding:.2rem 0;color:var(--gelb)}
.editorwarnung .ghost{margin-left:.5rem;padding:.15rem .5rem;min-height:auto;font-size:.78rem}
.editorvorschau{border:1px solid var(--line);border-radius:8px;padding:.8rem .9rem;margin-top:.7rem;background:var(--bg)}
.editorvorschau ul{margin:.4rem 0 0;padding-left:1.2rem}
footer.app{max-width:960px;margin:0 auto;padding:0 1rem 3rem;color:var(--muted);font-size:.78rem}
@media print{
  /* AP-0306: #importbereich/#rechercheBereich sind eigene Top-Level-Container (nicht Teil von
     #rezeptbereich) — ohne diese beiden bliebe ein offener Import- oder Recherche-Dialog mit
     allen Eingabefeldern/Buttons im PDF sichtbar (Abnahmekriterium 1). */
  header.app,.filters,.scaler,.actions,#meldungen,#importbereich,#rechercheBereich,footer.app,.noprint,
  .rail,.railtoggle,.railtab,.scrim,#btnVollbildEnde{display:none !important}
  body{background:#fff;color:#000;font-size:11pt}
  main#hauptraster{max-width:none;padding:0;grid-template-columns:1fr;display:block}
  .inhalt{max-width:none;margin:0}
  .card{border:0;box-shadow:none;margin:0 0 .6rem}
  .card > h2{border:0;padding:.2rem 0;color:#000}
  .card .body{padding:0}
  /* AP-0306 Nachbesserung: Nährwerte- und Kosten-Karte wurden beim Seitenumbruch
     mittendurch geschnitten. Schutz gezielt über .zusammenhalten, nicht über .card —
     die Zubereitungs-Karte kann länger als eine Seite werden und würde sonst einen
     erzwungenen Umbruch mit grossem Leerraum davor auslösen. */
  .card.zusammenhalten{break-inside:avoid}
  details.phase{break-inside:avoid;border-bottom:1px solid #ccc}
  details.phase .phasebody{display:block !important;padding:0 0 .5rem}
  details.phase > summary::before{content:""}
  /* AP-0304: die Metadatenbloecke ersetzen im Druck die frueheren Karten "Naehrwerte",
     "Kosten" und "Backprotokoll". Sie werden vor dem Druck aufgeklappt (View.DRUCK_AUFKLAPPEN);
     die display-Regel deckt zusaetzlich den Fall ab, dass ein Browser den Inhalt eines
     geschlossenen <details> ueber content-visibility weglaesst. */
  .metastapel{border:0;box-shadow:none;margin:0 0 .6rem;overflow:visible}
  details.metablock{break-inside:avoid;border-bottom:1px solid #ccc}
