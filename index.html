      return ["AP0318-2 mit gesetzter, nicht-leerer serviceUrl ist der Dienst verfuegbar", okAn && okLeer];
    })(),
    // AP-0317 schreibt das Stand-Datum als "TT.MM.JJJJ" oder den Text "unbekannt" — beides muss
    // die Preisalter-Berechnung sauber behandeln, "unbekannt" ergibt bewusst null (kein Alter
    // vortaeuschen), nicht 0 Tage.
    ["AP0318-3 Preisalter aus Schweizer Datumsformat (400 Tage vor 05.01.2027 → 01.12.2025)",
                            Calc.preisAlterTage("01.12.2025", new Date(2027,0,5)) === 400],
    ["AP0318-4 Preisalter bei „unbekannt“ ist null, nicht 0",
                            Calc.preisAlterTage("unbekannt", new Date()) === null
                              && Calc.preisAlterTage(null, new Date()) === null],
    // ---- AP-0311 Entwicklungsmodus — Versionen + Versuchsprotokoll — Testblock (6 Fälle) ----
    // Spalte "Entwicklung (JSON)" wird gelesen; fehlt sie in der Datei (aeltere Rezepte.xlsx-
    // Stände), bleibt entwicklung null statt einen Ladefehler zu werfen (Abnahmekriterium 3).
    (() => {
      const header = ["Rezept-ID","Name","Kategorie","Unterkategorie","Basis-Rohstoff","Basis-Menge (g)",
        "Sollgewicht (g)","Portionen","Einheit","Quelle","Phasen (JSON)","Backprotokoll (JSON)","Entwicklung (JSON)"];
      const entwicklung = { status:"entwicklung", zielwerte:{}, aktivV:1,
        versionen:[{v:1,datum:"2026-08-16",notiz:"Start",phasen:[{name:"P",zutaten:[],schritte:[]}]}], versuche:[] };
      const row = ["RZP-T","Test","Backen",null,"Mehl",1000,1000,1,"Stk",null,"[]","[]", JSON.stringify(entwicklung)];
      const mitSpalte = Model.parseRezepte([header, row]).rezepte[0];
      const ohneSpalte = Model.parseRezepte([header.slice(0,-1), row.slice(0,-1)]).rezepte[0];
      return ["AP0311-1 Entwicklung (JSON)-Spalte wird gelesen, fehlende Spalte bleibt null",
        mitSpalte.entwicklung.aktivV === 1 && mitSpalte.entwicklung.versionen.length === 1
          && ohneSpalte.entwicklung === null];
    })(),
    // aktive Version = entwicklung.aktivV; ein Wert ohne Treffer (z.B. von Hand in Excel
    // veraendert) faellt auf die zuletzt angelegte Version zurueck statt null zu liefern.
    ["AP0311-2 aktive Version: aktivV-Treffer, sonst letzte Version als Rückfall",
                            (() => {
                              const e1 = { aktivV:2, versionen:[{v:1},{v:2},{v:3}] };
                              const e2 = { aktivV:99, versionen:[{v:1},{v:2}] };
                              return Calc.entwAktiveVersion(e1).v === 2 && Calc.entwAktiveVersion(e2).v === 2;
                            })()],
    // Versions-Diff (§3): Delta je gemeinsamer Zutat, entfernte/neue Zutat als fehlender Wert
    // (nicht 0), geänderte Schritte einer Phase erkannt.
    (() => {
      const vA = { v:1, phasen:[{name:"Teig", zutaten:[{name:"Mehl",prozent:0.30},{name:"Wasser",prozent:0.10}], schritte:[{nr:1,text:"Mischen"}]}] };
      const vB = { v:2, phasen:[{name:"Teig", zutaten:[{name:"Mehl",prozent:0.32},{name:"Salz",prozent:0.02}], schritte:[{nr:1,text:"Mischen, dann ruhen"}]}] };
      const diff = Calc.entwDiff(vA, vB);
      const mehl = diff.zutaten.find(z => z.name === "Mehl");
      const wasser = diff.zutaten.find(z => z.name === "Wasser");
      const salz = diff.zutaten.find(z => z.name === "Salz");
      return ["AP0311-3 Versions-Diff: Delta korrekt, entfernte/neue Zutat als Lücke, geänderte Schritte erkannt",
        nah(mehl.delta, 0.02, 0.0001) && wasser.bPct === null && salz.aPct === null
          && diff.schritte.find(s => s.phase === "Teig").geaendert === true];
    })(),
    // Versions-Bearbeitung im Entwicklungsmodus prüft eine einzelne phasen-Liste mit derselben
    // Regel wie der volle rezept/1-Import (Import.phasenFehler, aus Import.pruefen ausgelagert).
    ["AP0311-4 Versions-Phasen-Prüfung: gültige Phasen bestehen, fehlender Prozent wird gemeldet",
                            Import.phasenFehler([{name:"P",zutaten:[{name:"Mehl",prozent:1,einheit:"g"}],schritte:[]}], "phasen").length === 0
                              && Import.phasenFehler([{name:"P",zutaten:[{name:"Mehl",einheit:"g"}],schritte:[]}], "phasen")
                                .some(f => f.pfad === "phasen[0].zutaten[0].prozent")],
    // Befördern (§3): kopiert die Phasen der gewählten Version nach "Phasen (JSON)" (hier
    // rz.phasen) und setzt status="produktiv" — die Versionsliste bleibt vollständig erhalten,
    // nichts wird gelöscht (Abnahmekriterium 2).
    (() => {
      const rz = { phasen:[{name:"Alt",zutaten:[{name:"X",prozent:0.5,einheit:"g"}],schritte:[]}],
        entwicklung:{ status:"entwicklung", zielwerte:{}, aktivV:2, versionen:[
          {v:1,datum:"2026-08-16",notiz:"Start",phasen:[{name:"Alt",zutaten:[{name:"X",prozent:0.5,einheit:"g"}],schritte:[]}]},
          {v:2,datum:"2026-08-20",notiz:"Salz runter",phasen:[{name:"Neu",zutaten:[{name:"Y",prozent:0.3,einheit:"g"}],schritte:[]}]}
        ], versuche:[] } };
      const version = rz.entwicklung.versionen.find(v => v.v === 2);
      const versionenVorher = rz.entwicklung.versionen.length;
      rz.phasen = Import.phasenExport(version.phasen);
      rz.entwicklung = { ...rz.entwicklung, status:"produktiv", aktivV: version.v };
      return ["AP0311-5 Befördern kopiert Phasen der Version, Versionsliste bleibt vollständig erhalten",
        rz.phasen[0].name === "Neu" && rz.phasen[0].zutaten[0].name === "Y"
          && rz.entwicklung.status === "produktiv" && rz.entwicklung.versionen.length === versionenVorher];
    })(),
    // Excel-Roundtrip (Umsetzungsschritt 5): entwicklung inkl. Versionen und Versuchen übersteht
    // Export -> Prüfung -> Import unverändert (FORMAT.md: Struktur wird v1 nicht geprüft, muss
    // aber unangetastet durchgereicht werden).
    (() => {
      const original = { id:"RZP-X", name:"Testbrot", kategorie:"Backen", unterkategorie:null, quelle:null,
        basisName:"Mehl", basisMengeG:1000, sollgewichtG:1000, portionen:1, einheit:"Stk",
        phasen:[{name:"P",zutaten:[{name:"Mehl",prozent:1,einheit:"g"}],schritte:[{nr:1,text:"Mischen"}]}],
        backprotokoll:[], entwicklung:{ status:"entwicklung", zielwerte:{}, aktivV:1,
          versionen:[{v:1,datum:"2026-08-16",notiz:"Start",phasen:[{name:"P",zutaten:[{name:"Mehl",prozent:1,einheit:"g"}],schritte:[]}]}],
          versuche:[{datum:"2026-08-21",version:1,soll_g:1000,ist_g:950,bewertung:4,erkenntnis:"gut"}] } };
      const exportiert = Import.alsExport(original);
      const pruefung = Import.pruefen({ format:"rezept/1", rezepte:[exportiert] });
      const zurueck = Import.zuIntern(exportiert);
      return ["AP0311-6 Excel-Roundtrip: entwicklung übersteht Export → Prüfung → Import unverändert",
        pruefung.ok === true && JSON.stringify(zurueck.entwicklung) === JSON.stringify(original.entwicklung)];
    })()
  ];
  const fehler = t.filter(x => !x[1]).map(x => x[0]);
  return { anzahl:t.length, fehler };
}

/* ---------- App --------------------------------------------------------- */
const App = {
  start(){
    Store.rohstoffe = BEISPIEL_ROHSTOFFE;
    Store.rezepte   = Model.aufloesen(BEISPIEL_REZEPTE, BEISPIEL_ROHSTOFFE);

    View.kategorienFuellen();
    View.liste();

    el("#suche").addEventListener("input", e => { Store.suchtext = e.target.value; View.liste(); });
    el("#kategorie").addEventListener("change", e => { Store.kategorie = e.target.value; View.liste(); });
    el("#btnLogin").addEventListener("click", App.loginKlick);
    el("#btnAltDB").addEventListener("click", App.altDBKlick);
    el("#btnImport").addEventListener("click", App.importOeffnen);
    el("#btnExportAlle").addEventListener("click", App.exportAlle);

    // AP-0306: nach dem Druckdialog die Phasen wieder in den Zustand vor dem Drucken bringen.
    // Einmalig am window registriert (nicht in View.rezept(), das bei jedem Rendern neu
    // aufgerufen wird) — sonst haeuften sich bei jedem Rezeptwechsel weitere Listener an.
    window.addEventListener("afterprint", () => { if(Store.aktuellesRezept) View.rezept(); });

    const st = selfTest();
    el("#selftest").textContent = st.fehler.length
      ? ` · Selbsttest: ${st.fehler.length} von ${st.anzahl} fehlgeschlagen (${st.fehler.join(", ")})`
      : ` · Selbsttest: ${st.anzahl}/${st.anzahl} ok`;
    if(st.fehler.length) View.meldung("Fehlgeschlagen: " + st.fehler.join(", "), "err", "Selbsttest des Rechenkerns");

    App.initDaten();
  },

  // US-A1 / Feinkonzept §5.2: file:// bricht vor jeder MSAL-Initialisierung ab.
  // Sonst: Konfiguration laden, MSAL aufbauen, bei bereits bekanntem Konto
  // still anmelden und laden (nie ungefragt, siehe §5.4).
  async initDaten(){
    // redirectUri = diese Seite selbst (ADR AP-0201/§8). Microsoft lädt darum
    // beim Popup-Login dieselbe App-Seite kurz INNERHALB des Popups, um die
    // Antwort zu übergeben. Läuft hier ein zweiter App-Start und der versucht
    // (z.B. über Data.token()) selbst einen Popup zu öffnen, meldet MSAL
    // block_nested_popups. Das öffnende Fenster wertet die Antwort per Polling
    // aus — im Popup selbst ist nichts zu tun, darum hier abbrechen.
    if(window.opener && window.opener !== window) return;
    if(location.protocol === "file:"){
      View.meldung("Diese App braucht eine Web-Adresse (https), weil der Microsoft-Login sonst nicht funktioniert. "
        + "Mit Beispieldaten läuft sie hier trotzdem — für echte Daten über die GitHub-Pages-URL öffnen.",
        "warn", "Als Datei geöffnet");
      return;
    }
    await ladeConfig();
    if(!CONFIG.clientId) return;   // keine Anmeldung möglich, Beispieldaten bleiben nutzbar
    try{
      const konto = await Data.init();
      if(konto) await App.datenLaden(konto);
    }catch(e){
      View.meldung("Anmeldung konnte nicht initialisiert werden: " + e.message, "err", "Fehler beim Start");
    }
  },

  async loginKlick(){
    if(!Data.verfuegbar()){ View.meldung("Konfiguration fehlt — clientId nicht gesetzt.", "err", "Anmeldung nicht möglich"); return; }
    try{
      const konto = await Data.login();
      if(konto) await App.datenLaden(konto);   // Popup-Pfad (Desktop); iPad navigiert per Redirect weg
    }catch(e){
      View.meldung("Anmeldung fehlgeschlagen: " + e.message, "err", "Login");
    }
  },

  async datenLaden(konto){
    el("#btnLogin").textContent = "Abmelden (" + (konto.username || konto.name || "Konto") + ")";
    el("#btnLogin").onclick = () => Data.logout();
    try{
      const { rohstoffe, rezepte, fehlerhaft, geladeneAliase, rezWb, rezSheetName, rohWb, rohSheetName } = await loadWorkbooks();
      // Aliase aus dem Blatt «Aliase» (AP-0315) ueberschreiben etwaige veraltete
      // localStorage-Eintraege — sie sind geraeteuebergreifend die aktuellere Quelle.
      CONFIG.aliase = Object.assign({}, CONFIG.aliase, geladeneAliase);
      Store.rohstoffe = rohstoffe;
      Store.rezepte = Model.aufloesen(rezepte, rohstoffe);
      Store.rezepteFehlerhaft = fehlerhaft;
      Store.rezepteWorkbook = rezWb; Store.rezepteSheetName = rezSheetName;
      Store.rohstoffeWorkbook = rohWb; Store.rohstoffeSheetName = rohSheetName;
      // AP-0305: Basis-eTag fuer die Konflikterkennung vor dem naechsten Schreiben.
      // Schlaegt der Metadaten-Abruf fehl, bleibt die Pruefung beim Speichern einfach aus
      // (kein falscher Konflikt-Alarm) statt den Ladevorgang selbst scheitern zu lassen.
      try{ Store.rezepteETag = (await Data.getItemMeta(CONFIG.rezeptePfad)).eTag; }
      catch(e){ Store.rezepteETag = null; }
      try{ Store.rohstoffeETag = (await Data.getItemMeta(CONFIG.rohstoffePfad)).eTag; }
      catch(e){ Store.rohstoffeETag = null; }
      el("#modus").textContent = "OneDrive — " + Store.rezepte.length + " Rezepte";
      View.kategorienFuellen();
      View.liste();
      if(fehlerhaft.length){
        View.meldung(fehlerhaft.length + " Rezept(e) mit ungültigem JSON übersprungen — in der Liste markiert, restliche Rezepte geladen.",
          "warn", "Teilweise geladen");
      }else{
        View.meldung("Rezepte und Rohstoffe aus OneDrive geladen.", "ok");
      }
    }catch(e){
      View.meldung("Laden fehlgeschlagen: " + e.message, "err", "Fehler beim Laden");
    }
  },

  // AP-0302 Schritt 3 / Lastenheft F1: alternativer OneDrive-Pfad statt der
  // Standard-Datenbank. Pfade werden pro Nutzer in localStorage gemerkt (§5.4).
  async altDBKlick(){
    const rez = prompt("Pfad zur Rezepte.xlsx (ab OneDrive-Wurzel, z. B. /Küche/Rezepte.xlsx):", CONFIG.rezeptePfad || "");
    if(rez == null || !rez.trim()) return;
    const roh = prompt("Pfad zur Rohstoffe.xlsx:", CONFIG.rohstoffePfad || "");
    if(roh == null || !roh.trim()) return;
    CONFIG.rezeptePfad = rez.trim();
    CONFIG.rohstoffePfad = roh.trim();
    Settings.set("rezeptePfad", CONFIG.rezeptePfad);
    Settings.set("rohstoffePfad", CONFIG.rohstoffePfad);
    if(!Data.verfuegbar()){ View.meldung("Pfade gespeichert. Zum Laden zuerst anmelden.", "ok", "Andere Datenbank"); return; }
    const konto = msalApp.getActiveAccount();
    if(!konto){ await App.loginKlick(); return; }
    await App.datenLaden(konto);
  },

  rezeptOeffnen(id){
    Store.aktuellesRezept = Store.rezepte.find(r => r.id === id) || null;
    Store.faktor = 1;
    Store.offenePhasen = new Set([0]);
    View.rezept();
    window.scrollTo({top:0, behavior:"smooth"});
  },

  skalieren(f){
    const aktiv = document.activeElement;
    const id = aktiv && aktiv.id, pos = aktiv && aktiv.selectionStart;
    Store.faktor = f;
    View.rezept();
    if(id){
      const neu = document.getElementById(id);
      if(neu){ neu.focus(); try{ neu.setSelectionRange(pos,pos); }catch(e){} }
    }
  },

  schliessen(){ Store.aktuellesRezept = null; View.rezept(); },

  /* ---------- Backprotokoll (AP-0305) --------------------------------------
     Ablauf: Formular oeffnen -> pruefen -> (Beispieldaten: nur im Speicher | OneDrive:
     Konflikt pruefen -> Backup -> gezielte Zell-Updates via Data.updateCell). Nie blind
     ueberschreiben (Entscheid O-9): eTag-Abgleich vor jedem Schreiben, siehe Data.getItemMeta. */
  backEintragOeffnen(){
    const rz = Store.aktuellesRezept;
    if(!rz) return;
    Store.backEintrag = {
      datum: new Date().toISOString().slice(0, 10),
      soll: Math.round(rz.sollgewichtG * Store.faktor),
      ist: "",
      notizen: ""
    };
    View.rezept();
    el("#beIst") && el("#beIst").focus();
  },

  async backEintragSpeichern(){
    const rz = Store.aktuellesRezept, eingabe = Store.backEintrag;
    if(!rz || !eingabe) return;
    const datum = (eingabe.datum || "").trim();
    const soll = Number(eingabe.soll), ist = Number(eingabe.ist);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(datum)){ View.meldung("Datum fehlt oder ungültig.", "err", "Eintrag unvollständig"); return; }
    if(!(soll > 0)){ View.meldung("Soll (g) muss grösser als 0 sein.", "err", "Eintrag unvollständig"); return; }
    if(!(ist > 0)){ View.meldung("Ist (g) muss grösser als 0 sein.", "err", "Eintrag unvollständig"); return; }
    const neuerEintrag = { datum, sollG: soll, istG: ist, notizen: (eingabe.notizen || "").trim() || null };
    await App.backprotokollSpeichern(rz, neuerEintrag);
  },

  // Schreibt den Eintrag in Store (sofort sichtbar) und, falls eine OneDrive-Verbindung
  // besteht, zurueck nach Rezepte.xlsx. Bei jedem Fehlschlag (Konflikt, Netzfehler) wird
  // der Store-Eintrag zurueckgenommen — nie ein Erfolg vortaeuschen, den OneDrive nicht hat.
  async backprotokollSpeichern(rz, eintrag){
    rz.backprotokoll = [...rz.backprotokoll, eintrag];
    const verbunden = Store.rezepteWorkbook && Data.verfuegbar() && msalApp.getActiveAccount();
    if(!verbunden){
      Store.backEintrag = null;
      View.meldung("Eintrag erfasst — nur in dieser Sitzung, keine OneDrive-Verbindung.", "warn", "Nicht dauerhaft gespeichert");
      View.rezept();
      return;
    }
    if(!rz._raw){
      rz.backprotokoll = rz.backprotokoll.slice(0, -1);
      View.meldung("Zeilenposition dieses Rezepts ist unbekannt (frisch importiert, noch nicht neu geladen). "
        + "Seite neu laden und erneut versuchen.", "err", "Speichern nicht möglich");
      return;
    }
    try{
      if(Store.rezepteETag){
        const meta = await Data.getItemMeta(CONFIG.rezeptePfad);
        if(meta.eTag !== Store.rezepteETag){
          rz.backprotokoll = rz.backprotokoll.slice(0, -1);
          Store.backEintrag = null;
          View.meldung("Rezepte.xlsx wurde zwischenzeitlich extern geändert — Bestand wird neu geladen. "
            + "Eintrag bitte erneut erfassen.", "warn", "Konflikt erkannt");
          const konto = msalApp.getActiveAccount();
          await App.datenLaden(konto);
          App.rezeptOeffnen(rz.id);
          return;
        }
      }
      await Data.backup(CONFIG.rezeptePfad);
      const header = rz._raw.spalten, zeileExcel = rz._raw.zeile + 1;
      const iBack = header.indexOf("Backprotokoll (JSON)");
      if(iBack === -1) throw new Error('Spalte "Backprotokoll (JSON)" fehlt in Rezepte.xlsx');
      await Data.updateCell(CONFIG.rezeptePfad, Store.rezepteSheetName,
        Model.zelladresse(header, "Backprotokoll (JSON)", zeileExcel), JSON.stringify(rz.backprotokoll));
      // Schwund (%) und Geändert sind reine Komfortspalten fuer die direkte Excel-Ansicht —
      // die App selbst berechnet Schwund immer live aus dem Backprotokoll (Calc.schwundAktuell).
      // Ein Fehlschlag hier ist darum nicht fatal, nur meldepflichtig (Abnahmekriterium 1).
      const heute = new Date().toISOString().slice(0, 10);
      const schwund = Calc.schwundAktuell(rz.backprotokoll);
      const nebenfelder = [["Schwund (%)", schwund == null ? 0 : Math.round(schwund * 100)], ["Geändert", heute]];
      const nebenfehler = [];
      for(const [spalte, wert] of nebenfelder){
        const addr = Model.zelladresse(header, spalte, zeileExcel);
        if(!addr) continue;
        try{ await Data.updateCell(CONFIG.rezeptePfad, Store.rezepteSheetName, addr, wert); }
        catch(e){ nebenfehler.push(spalte); }
      }
      try{ Store.rezepteETag = (await Data.getItemMeta(CONFIG.rezeptePfad)).eTag; }
      catch(e){ Store.rezepteETag = null; }
      Store.backEintrag = null;
      View.meldung("Backprotokoll-Eintrag gespeichert, Backup in " + (CONFIG.backupOrdner || "/Backups") + " angelegt."
        + (nebenfehler.length ? " Hinweis: Spalte(n) " + nebenfehler.join(", ") + " konnten nicht mitaktualisiert werden — Backprotokoll selbst ist gespeichert." : ""),
        nebenfehler.length ? "warn" : "ok", "Gespeichert");
      View.rezept();
    }catch(e){
      rz.backprotokoll = rz.backprotokoll.slice(0, -1);
      View.meldung("Speichern fehlgeschlagen: " + e.message + " — Backprotokoll in OneDrive nicht verändert.", "err", "Fehler beim Speichern");
      View.rezept();
    }
  },

  /* ---------- Entwicklungsmodus (AP-0311) ----------------------------------
     §1.1+§3 der Spezifikation AP-0203: eigene Excel-Spalte "Entwicklung (JSON)", Versionen
     (Kopie -> frei editierbar), Versuchsprotokoll je Version, Befördern (kopiert die Phasen
     der gewählten Version nach "Phasen (JSON)", Versionsliste bleibt vollständig erhalten —
     nichts wird gelöscht). Schreibpfad identisch zu backprotokollSpeichern oben: Konflikt
     prüfen (eTag), Backup, gezielte Zell-Updates statt Ganzdatei-PUT (Entscheid O-9). */
  entwStarten(){
    const rz = Store.aktuellesRezept;
    if(!rz || rz.entwicklung) return;
    const heute = new Date().toISOString().slice(0, 10);
    const neu = {
      status: "entwicklung", zielwerte: {}, aktivV: 1,
      versionen: [{ v:1, datum: heute, notiz: "Startpunkt, Kopie der produktiven Rezeptur",
                    phasen: Import.phasenExport(rz.phasen) }],
      versuche: []
    };
    App.entwSpeichern(rz, neu, "Entwicklungsmodus gestartet — v1 ist eine Kopie der aktuellen Rezeptur.");
  },

  entwVersionNeuOeffnen(){
    const rz = Store.aktuellesRezept, e = rz && rz.entwicklung;
    if(!e) return;
    const aktiv = Calc.entwAktiveVersion(e);
    const naechsteV = e.versionen.reduce((m,v) => Math.max(m, v.v || 0), 0) + 1;
    Store.devForm = { art:"version", modus:"neu", v: naechsteV, notiz:"",
      phasenText: JSON.stringify(aktiv ? aktiv.phasen : [], null, 2) };
    View.rezept();
  },

  entwVersionBearbeitenOeffnen(v){
    const rz = Store.aktuellesRezept, e = rz && rz.entwicklung;
    if(!e) return;
    const version = e.versionen.find(x => x.v === v);
    if(!version) return;
    Store.devForm = { art:"version", modus:"bearbeiten", v,
      notiz: version.notiz || "", phasenText: JSON.stringify(version.phasen, null, 2) };
    View.rezept();
  },

  entwFormAbbrechen(){ Store.devForm = null; View.rezept(); },

  async entwVersionSpeichern(){
    const rz = Store.aktuellesRezept, df = Store.devForm;
    if(!rz || !rz.entwicklung || !df || df.art !== "version") return;
    let phasen;
    try{ phasen = JSON.parse(df.phasenText); }
    catch(err){ View.meldung("Phasen (JSON) ist kein gültiges JSON — " + err.message, "err", "Version nicht gespeichert"); return; }
    const fehler = Import.phasenFehler(phasen, "phasen");
    if(fehler.length){
      View.meldung(fehler.map(f => f.pfad + ": " + f.meldung).join(" · "), "err", "Version nicht gespeichert");
      return;
    }
    const notiz = (df.notiz || "").trim();
    const heute = new Date().toISOString().slice(0, 10);
    const neueEntwicklung = JSON.parse(JSON.stringify(rz.entwicklung));
    const phasenExportiert = Import.phasenExport(phasen);
    if(df.modus === "neu"){
      neueEntwicklung.versionen = [...neueEntwicklung.versionen, { v: df.v, datum: heute, notiz, phasen: phasenExportiert }];
    }else{
      const idx = neueEntwicklung.versionen.findIndex(x => x.v === df.v);
      if(idx === -1) return;
      neueEntwicklung.versionen[idx] = { ...neueEntwicklung.versionen[idx], notiz, phasen: phasenExportiert };
    }
    neueEntwicklung.aktivV = df.v;
    await App.entwSpeichern(rz, neueEntwicklung,
      df.modus === "neu" ? "Neue Version v" + df.v + " angelegt." : "Version v" + df.v + " gespeichert.");
  },

  entwAktivSetzen(v){
    const rz = Store.aktuellesRezept;
    if(!rz || !rz.entwicklung) return;
    App.entwSpeichern(rz, { ...rz.entwicklung, aktivV: v }, "Version v" + v + " ist jetzt aktiv.");
  },

  entwDiffOeffnen(){
    const rz = Store.aktuellesRezept, e = rz && rz.entwicklung;
    if(!e || !e.versionen.length) return;
    const sortiert = e.versionen.slice().sort((a,b) => a.v - b.v);
    const aktiv = Calc.entwAktiveVersion(e);
    const vorherige = sortiert.filter(v => !aktiv || v.v !== aktiv.v).pop();
    Store.devForm = { art:"diff", a: (vorherige || sortiert[0]).v, b: (aktiv || sortiert[sortiert.length-1]).v };
    View.rezept();
  },

  entwDiffAendern(feld, wert){
    if(!Store.devForm || Store.devForm.art !== "diff") return;
    Store.devForm[feld] = Number(wert);
    View.rezept();
  },

  entwBefoerdernOeffnen(){
    const rz = Store.aktuellesRezept;
    const aktiv = rz && rz.entwicklung && Calc.entwAktiveVersion(rz.entwicklung);
    if(!aktiv) return;
    Store.devForm = { art:"befoerdern", v: aktiv.v };
    View.rezept();
  },

  // Kopiert die Phasen der gewählten Version nach "Phasen (JSON)" und setzt status="produktiv"
  // (§1.1) — die Versionsliste selbst bleibt unverändert, nichts wird gelöscht. Anders als
  // entwSpeichern() unten schreibt das zwei Zellen (Phasen + Entwicklung); bei jedem Fehler
  // rollt die gesamte Operation zurück, damit rz.phasen und rz.entwicklung nie auseinanderlaufen.
  async entwBefoerdernBestaetigt(){
    const rz = Store.aktuellesRezept, df = Store.devForm;
    if(!rz || !rz.entwicklung || !df || df.art !== "befoerdern") return;
    const version = rz.entwicklung.versionen.find(x => x.v === df.v);
    if(!version) return;
    const altePhasen = rz.phasen, alteEntwicklung = rz.entwicklung;
    rz.phasen = Import.phasenExport(version.phasen);
    Model.aufloesen([rz], Store.rohstoffe);
    rz.entwicklung = { ...rz.entwicklung, status:"produktiv", aktivV: version.v };

    const verbunden = Store.rezepteWorkbook && Data.verfuegbar() && msalApp.getActiveAccount();
    if(!verbunden){
      Store.devForm = null;
      View.meldung("Version v" + version.v + " ist jetzt die produktive Rezeptur — nur in dieser Sitzung, keine "
        + "OneDrive-Verbindung. Bisherige Rezeptur bleibt als Version erhalten.", "warn", "Nicht dauerhaft gespeichert");
      View.rezept();
      return;
    }
    if(!rz._raw){
      rz.phasen = altePhasen; rz.entwicklung = alteEntwicklung; Model.aufloesen([rz], Store.rohstoffe);
      View.meldung("Zeilenposition dieses Rezepts ist unbekannt (frisch importiert, noch nicht neu geladen). "
        + "Seite neu laden und erneut versuchen.", "err", "Befördern nicht möglich");
      return;
    }
    try{
      if(Store.rezepteETag){
        const meta = await Data.getItemMeta(CONFIG.rezeptePfad);
        if(meta.eTag !== Store.rezepteETag){
          rz.phasen = altePhasen; rz.entwicklung = alteEntwicklung; Model.aufloesen([rz], Store.rohstoffe);
          Store.devForm = null;
          View.meldung("Rezepte.xlsx wurde zwischenzeitlich extern geändert — Bestand wird neu geladen. "
            + "Bitte erneut befördern.", "warn", "Konflikt erkannt");
          const konto = msalApp.getActiveAccount();
          await App.datenLaden(konto);
          App.rezeptOeffnen(rz.id);
          return;
        }
      }
      await Data.backup(CONFIG.rezeptePfad);
      const header = rz._raw.spalten, zeileExcel = rz._raw.zeile + 1;
      const iPhasen = header.indexOf("Phasen (JSON)"), iEntw = header.indexOf("Entwicklung (JSON)");
      if(iPhasen === -1) throw new Error('Spalte "Phasen (JSON)" fehlt in Rezepte.xlsx');
      if(iEntw === -1) throw new Error('Spalte "Entwicklung (JSON)" fehlt in Rezepte.xlsx');
      await Data.updateCell(CONFIG.rezeptePfad, Store.rezepteSheetName,
        Model.zelladresse(header, "Phasen (JSON)", zeileExcel), JSON.stringify(rz.phasen));
      await Data.updateCell(CONFIG.rezeptePfad, Store.rezepteSheetName,
        Model.zelladresse(header, "Entwicklung (JSON)", zeileExcel), JSON.stringify(rz.entwicklung));
      try{ Store.rezepteETag = (await Data.getItemMeta(CONFIG.rezeptePfad)).eTag; }
      catch(e){ Store.rezepteETag = null; }
      Store.devForm = null;
      View.meldung("Version v" + version.v + " ist jetzt die produktive Rezeptur, Backup angelegt. "
        + "Bisherige Rezeptur bleibt als Version erhalten.", "ok", "Befördert");
      View.rezept();
    }catch(e){
      rz.phasen = altePhasen; rz.entwicklung = alteEntwicklung; Model.aufloesen([rz], Store.rohstoffe);
      View.meldung("Befördern fehlgeschlagen: " + e.message + " — Rezept in OneDrive nicht verändert.", "err", "Fehler beim Speichern");
      View.rezept();
    }
  },

  entwVersuchOeffnen(){
    const rz = Store.aktuellesRezept, e = rz && rz.entwicklung;
    if(!e || !e.versionen.length) return;
    const aktiv = Calc.entwAktiveVersion(e);
    Store.devForm = { art:"versuch", datum: new Date().toISOString().slice(0, 10),
      version: aktiv.v, soll:"", ist:"", bewertung:3, erkenntnis:"" };
    View.rezept();
  },

  async entwVersuchSpeichern(){
    const rz = Store.aktuellesRezept, df = Store.devForm;
    if(!rz || !rz.entwicklung || !df || df.art !== "versuch") return;
    const datum = (df.datum || "").trim();
    const soll = Number(df.soll), ist = Number(df.ist), bewertung = Number(df.bewertung), version = Number(df.version);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(datum)){ View.meldung("Datum fehlt oder ungültig.", "err", "Versuch unvollständig"); return; }
    if(!(soll > 0)){ View.meldung("Soll (g) muss grösser als 0 sein.", "err", "Versuch unvollständig"); return; }
    if(!(ist > 0)){ View.meldung("Ist (g) muss grösser als 0 sein.", "err", "Versuch unvollständig"); return; }
    if(!(bewertung >= 1 && bewertung <= 5)){ View.meldung("Bewertung muss zwischen 1 und 5 liegen.", "err", "Versuch unvollständig"); return; }
    if(!rz.entwicklung.versionen.some(v => v.v === version)){ View.meldung("Version existiert nicht.", "err", "Versuch unvollständig"); return; }
    // Feldnamen soll_g/ist_g bewusst wie Spezifikation AP-0203/§1.1 (abweichend von der
    // camelCase-Konvention des produktiven Backprotokolls — Versuchsdaten speisen dessen
    // Schwund-Logik ausdrücklich NICHT, siehe §3, sind also kein Alias desselben Felds).
    const eintrag = { datum, version, soll_g: soll, ist_g: ist, bewertung, erkenntnis: (df.erkenntnis || "").trim() || null };
    const neueEntwicklung = JSON.parse(JSON.stringify(rz.entwicklung));
    neueEntwicklung.versuche = [...(neueEntwicklung.versuche || []), eintrag];
    await App.entwSpeichern(rz, neueEntwicklung, "Versuch erfasst.");
  },

  // Gemeinsamer Schreibpfad fuer jede reine Entwicklung-Aenderung (Start, neue/bearbeitete
  // Version, aktive Version wechseln, neuer Versuch) — nur die Spalte "Entwicklung (JSON)"
  // aendert sich. Befoerdern hat einen eigenen Pfad oben, weil dort zusaetzlich "Phasen (JSON)"
  // mitgeschrieben wird. Muster identisch zu backprotokollSpeichern: optimistisch anwenden,
  // bei jedem Fehlschlag zurueckrollen statt einen Erfolg vorzutaeuschen, den OneDrive nicht hat.
  async entwSpeichern(rz, neueEntwicklung, erfolgstext){
    const vorher = rz.entwicklung;
    rz.entwicklung = neueEntwicklung;
    const verbunden = Store.rezepteWorkbook && Data.verfuegbar() && msalApp.getActiveAccount();
    if(!verbunden){
      Store.devForm = null;
      View.meldung(erfolgstext + " — nur in dieser Sitzung, keine OneDrive-Verbindung.", "warn", "Nicht dauerhaft gespeichert");
      View.rezept();
      return;
    }
    if(!rz._raw){
      rz.entwicklung = vorher;
      View.meldung("Zeilenposition dieses Rezepts ist unbekannt (frisch importiert, noch nicht neu geladen). "
        + "Seite neu laden und erneut versuchen.", "err", "Speichern nicht möglich");
      return;
    }
    try{
      if(Store.rezepteETag){
        const meta = await Data.getItemMeta(CONFIG.rezeptePfad);
        if(meta.eTag !== Store.rezepteETag){
          rz.entwicklung = vorher;
          Store.devForm = null;
          View.meldung("Rezepte.xlsx wurde zwischenzeitlich extern geändert — Bestand wird neu geladen. "
            + "Bitte erneut versuchen.", "warn", "Konflikt erkannt");
          const konto = msalApp.getActiveAccount();
          await App.datenLaden(konto);
          App.rezeptOeffnen(rz.id);
          return;
        }
      }
      await Data.backup(CONFIG.rezeptePfad);
      const header = rz._raw.spalten, zeileExcel = rz._raw.zeile + 1;
      const iEntw = header.indexOf("Entwicklung (JSON)");
      if(iEntw === -1) throw new Error('Spalte "Entwicklung (JSON)" fehlt in Rezepte.xlsx');
      const wert = JSON.stringify(rz.entwicklung);
      if(wert.length > CONFIG.zellenWarnung)
        View.meldung("Entwicklung (JSON) ist " + wert.length + " Zeichen lang (Warnschwelle " + CONFIG.zellenWarnung
          + ") — Excel-Zellenlimit liegt bei 32'767.", "warn", "Nahe am Zellenlimit");
      await Data.updateCell(CONFIG.rezeptePfad, Store.rezepteSheetName,
        Model.zelladresse(header, "Entwicklung (JSON)", zeileExcel), wert);
      try{ Store.rezepteETag = (await Data.getItemMeta(CONFIG.rezeptePfad)).eTag; }
      catch(e){ Store.rezepteETag = null; }
      Store.devForm = null;
      View.meldung(erfolgstext + " Backup in " + (CONFIG.backupOrdner || "/Backups") + " angelegt.", "ok", "Gespeichert");
      View.rezept();
    }catch(e){
      rz.entwicklung = vorher;
      View.meldung("Speichern fehlgeschlagen: " + e.message + " — Entwicklung in OneDrive nicht verändert.", "err", "Fehler beim Speichern");
      View.rezept();
    }
  },

  /* ---------- Import (AP-0315) --------------------------------------------
     Ablauf: parsen -> pruefen -> aufloesen -> Vorschau -> uebernehmen (Feinkonzept §6b.2).
     Store.import haelt den gesamten Zustand eines Durchlaufs. */
  importOeffnen(){
    Store.import = { text:"", geprueft:false, fehler:[], rezepte:[], unbekannt:[], zuordnung:{}, konflikte:[], entscheidung:{} };
    View.import();
    el("#importKarte") && el("#importKarte").scrollIntoView({ behavior:"smooth" });
  },

  importSchliessen(){ Store.import = null; View.import(); },

  // Liest das Textfeld ins Store.import.text (Quelle: Klick auf «Prüfen»). Der Datei-Upload
  // ruft stattdessen direkt importAuswerten() — dort ist st.text schon aus der Datei gesetzt,
  // und das Textfeld im DOM wurde bis zum naechsten Rendern noch nicht nachgezogen. Ein Aufruf
  // von importPruefen() an dieser Stelle wuerde den geladenen Dateiinhalt sofort wieder mit dem
  // (noch leeren) Feldwert ueberschreiben — genau der Bug, den Gianlucas Live-Test aufdeckte.
  importPruefen(){
    const textEl = el("#importText");
    if(textEl) Store.import.text = textEl.value;
    App.importAuswerten();
  },

  // AP-0316: Excel-Altdatei einlesen, erkennen, als rezept/1-Text ins selbe Feld stellen —
  // ab hier laeuft exakt derselbe Weg wie ein .json-Dateiupload (kein zweiter Uebernahmeweg).
  async importExcelAltdatei(datei){
    const buf = await datei.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    const ergebnis = Import.excelDateiErkennen(wb, datei.name, null);
    const st = Store.import;
    st.text = JSON.stringify({ format: ergebnis.format, rezepte: ergebnis.rezepte }, null, 2);

    const offene = ergebnis.protokolle.flatMap(p => p.nicht_zugeordnet.map(n => `${p.blatt} Zeile ${n.zeile}: ${n.grund}`));
    const nichtErkannt = ergebnis.protokolle.filter(p => p.status !== "erkannt").map(p => p.blatt);
    let text = ergebnis.rezepte.length
      ? ergebnis.rezepte.length + " von " + ergebnis.protokolle.length + " Blatt/Blätter erkannt und ins Feld unten übertragen."
      : "Kein Blatt der Datei entspricht dem erkannten Muster — nichts übertragen.";
    if(nichtErkannt.length) text += " Nicht erkannt: " + nichtErkannt.join(", ") + ".";
    if(offene.length) text += " " + offene.length + " Stelle(n) offen (siehe Konsole) — vor «Prüfen» ergänzen.";
    if(offene.length) console.log("Import-Protokoll " + datei.name + ":\n" + offene.join("\n"));
    View.meldung(text, ergebnis.rezepte.length ? "warn" : "err", "Excel-Altdatei erkannt");
    View.import();
  },

  // AP-0318: LLM-Import. Genau wie beim Excel-Erkenner landet die Antwort NUR im Textfeld —
  // erst der bestehende «Prüfen»-Klick validiert sie gegen rezept/1 und zeigt die Vorschau
  // (FR-1210: eine Modellantwort ist eine Quelle wie jede andere, keine Autorität). Ein Fehler
  // des Dienstes (Netz, falsches Format) darf den Bestand nie veraendern — es passiert schlicht
  // nichts ausser einer Fehlermeldung.
  async importAusKiText(text){
    if(!Service.verfuegbar()) return;
    try{
      const antwort = await Service.rezeptAusText(text);
      Store.import.text = JSON.stringify(antwort, null, 2);
      View.meldung("Vorschlag erzeugt — vor «Prüfen» kontrollieren, insbesondere Baeckerprozente.", "warn", "KI-Import");
    }catch(e){
      View.meldung("KI-Import fehlgeschlagen: " + e.message, "err", "Kein Vorschlag übernommen");
    }
    View.import();
  },
  async importAusKiBild(dataUrl){
    if(!Service.verfuegbar()) return;
    try{
      const antwort = await Service.rezeptAusBild(dataUrl);
      Store.import.text = JSON.stringify(antwort, null, 2);
      View.meldung("Vorschlag aus Bild erzeugt — vor «Prüfen» kontrollieren, insbesondere Baeckerprozente.", "warn", "KI-Import");
    }catch(e){
      View.meldung("KI-Import fehlgeschlagen: " + e.message, "err", "Kein Vorschlag übernommen");
    }
    View.import();
  },

  importAuswerten(){
    const st = Store.import;
    const geparst = Import.parseJSON(st.text);
    if(!geparst.ok){
      Object.assign(st, { geprueft:true, fehler:geparst.fehler, rezepte:[], unbekannt:[], konflikte:[] });
      View.import();
      return;
    }
    const pruefung = Import.pruefen(geparst.daten);
    if(!pruefung.ok){
      Object.assign(st, { geprueft:true, fehler:pruefung.fehler, rezepte:[], unbekannt:[], konflikte:[] });
      View.import();
      return;
    }

    const rezepteIntern = geparst.daten.rezepte.map(Import.zuIntern);
    const unbekannt = Import.unbekannteNamen(rezepteIntern, Store.rohstoffe);
    const konflikte = Import.konflikte(rezepteIntern, Store.rezepte);
    Object.assign(st, {
      geprueft: true, fehler: [], rezepte: rezepteIntern,
      unbekannt, zuordnung: Object.fromEntries(unbekannt.map(n => [n, ""])),
      konflikte, entscheidung: Object.fromEntries(konflikte.map(k => [k.index, "neu"]))
    });
    App.importVorschauAktualisieren();
    View.import();
  },

  // Wendet die im Dialog gewaehlten Zuordnungen auf die Vorschau an, OHNE Store.rohstoffe oder
  // CONFIG.aliase zu veraendern — erst App.importUebernehmen() macht eine Wahl dauerhaft.
  importVorschauAktualisieren(){
    const st = Store.import;
    const idx = Model.rohstoffIndex(Store.rohstoffe);
    st.unbekannt.forEach(name => {
      const zielId = st.zuordnung[name];
      if(!zielId) return;
      const ziel = Store.rohstoffe.find(r => r.id === zielId);
      if(ziel) idx.set(Model.nameKey(name), ziel);
    });
    Model.aufloesen(st.rezepte, Store.rohstoffe, idx);
  },

  importZuordnen(name, rohstoffId){
    Store.import.zuordnung[name] = rohstoffId;
    App.importVorschauAktualisieren();
    View.import();
  },

  importEntscheiden(index, wahl){
    Store.import.entscheidung[index] = wahl;
    View.import();
  },

  async importUebernehmen(){
    const st = Store.import;
    const heute = new Date().toISOString().slice(0,10);

    // Zuordnungen sofort als Alias lernen (wirkt ab jetzt in dieser Sitzung fuers Matching).
    const neueAliase = [];
    st.unbekannt.forEach(name => {
      const zielId = st.zuordnung[name];
      if(!zielId) return;
      const ziel = Store.rohstoffe.find(r => r.id === zielId);
      if(!ziel) return;
      CONFIG.aliase[Model.normKey(name)] = Model.nameKey(ziel.name);
      neueAliase.push({ variante: name, ziel: ziel.name });
    });

    const uebernommen = [];
    st.rezepte.forEach((rz, i) => {
      const konflikt = st.konflikte.find(k => k.index === i);
      if(konflikt && st.entscheidung[i] === "version"){
        konflikt.bestehend.entwicklung = Import.alsVersionAnhaengen(konflikt.bestehend, rz, heute);
        uebernommen.push({ rz: konflikt.bestehend, modus:"version" });
      }else{
        rz.id = Import.naechsteId(Store.rezepte);
        Model.aufloesen([rz], Store.rohstoffe);
        Store.rezepte = [...Store.rezepte, rz];
        uebernommen.push({ rz, modus:"neu" });
      }
    });

    if(Store.rezepteWorkbook && Store.rohstoffeWorkbook){
      try{
        uebernommen.filter(u => u.modus === "neu")
          .forEach(u => Import.anhaengen(Store.rezepteWorkbook, Store.rezepteSheetName, u.rz));
        neueAliase.forEach(a => Import.aliasAnhaengen(Store.rohstoffeWorkbook, a.variante, a.ziel, heute));
        await Data.writeWorkbook(CONFIG.rezeptePfad, Import.alsArrayBuffer(Store.rezepteWorkbook));
        if(neueAliase.length) await Data.writeWorkbook(CONFIG.rohstoffePfad, Import.alsArrayBuffer(Store.rohstoffeWorkbook));
        // Als Version angehaengte Rezepte (AP-0311) aendern nur rz.entwicklung einer bestehenden
        // Zeile, keine neue Zeile — gezieltes Zell-Update statt eines weiteren Ganzdatei-PUT
        // (Entscheid O-9), analog zu App.entwSpeichern().
        const versionFehler = [];
        for(const u of uebernommen.filter(x => x.modus === "version")){
          if(!u.rz._raw){ versionFehler.push(u.rz.name + " (Zeilenposition unbekannt)"); continue; }
          const header = u.rz._raw.spalten, zeileExcel = u.rz._raw.zeile + 1;
          const addr = Model.zelladresse(header, "Entwicklung (JSON)", zeileExcel);
          if(!addr){ versionFehler.push(u.rz.name + " (Spalte „Entwicklung (JSON)“ fehlt)"); continue; }
          try{ await Data.updateCell(CONFIG.rezeptePfad, Store.rezepteSheetName, addr, JSON.stringify(u.rz.entwicklung)); }
          catch(e){ versionFehler.push(u.rz.name + ": " + e.message); }
        }
        try{ Store.rezepteETag = (await Data.getItemMeta(CONFIG.rezeptePfad)).eTag; }
        catch(e){ Store.rezepteETag = null; }
        View.meldung(uebernommen.length + " Rezept(e) importiert und nach OneDrive geschrieben."
          + (versionFehler.length ? " Als Version angehängt, aber Entwicklung nicht gespeichert bei: " + versionFehler.join("; ") + "." : ""),
          versionFehler.length ? "warn" : "ok", "Import übernommen");
      }catch(e){
        View.meldung("In OneDrive schreiben fehlgeschlagen: " + e.message + " — im Bestand dieser Sitzung bleibt der Import trotzdem sichtbar.",
          "err", "Import teilweise übernommen");
      }
    }else{
      View.meldung(uebernommen.length + " Rezept(e) importiert (nur im Speicher dieser Sitzung — keine OneDrive-Verbindung).",
        "warn", "Import übernommen");
    }

    App.importSchliessen();
    View.kategorienFuellen();
    View.liste();
  },

  /* ---------- Export (AP-0315) --------------------------------------------
     Gegenzug zum Import: erzeugt exakt das Austauschformat rezept/1 (FORMAT.md). */
  exportEinzeln(){
    if(!Store.aktuellesRezept) return;
    App.downloadJSON(Import.alsExportAlle([Store.aktuellesRezept]),
      (Store.aktuellesRezept.name || "rezept").replace(/[^\w\-]+/g,"_") + ".rezept1.json");
  },

  exportAlle(){
    if(!Store.rezepte.length){ View.meldung("Keine Rezepte zum Exportieren geladen.", "warn", "Export"); return; }
    App.downloadJSON(Import.alsExportAlle(Store.rezepte), "rezepte_alle.rezept1.json");
  },

  downloadJSON(daten, dateiname){
    const blob = new Blob([JSON.stringify(daten, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = dateiname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },

  /* ---------- Rohstoff-Recherche (AP-0318, «Preise aktualisieren») ---------------------
     Gleiches Prinzip wie AP-0317 (Cowork-Recherche): der Dienst liefert nur einen Vorschlag
     mit Quelle/Stand, geschrieben wird ausschliesslich, was hier einzeln akzeptiert wurde —
     nie automatisch. Schreibpfad wie AP-0305: eTag-Konflikterkennung, Backup, gezielte
     Zell-Updates (Data.updateCell), keine Ganzdatei-PUT. */
  async rechercheOeffnen(){
    if(!Service.verfuegbar() || !Store.aktuellesRezept) return;
    const namen = [...new Map(Calc.zutatenFlach(Store.aktuellesRezept)
      .filter(z => z.rohstoff).map(z => [z.rohstoff.id, z.rohstoff])).values()].map(r => r.name);
    if(!namen.length) return;
    Store.recherche = { namen, laedt: true, vorschlaege: [], entscheidung: {}, fehler: null };
    View.recherche();
    try{
      const vorschlaege = await Service.rohstoffRecherche(namen);
      Store.recherche.vorschlaege = Array.isArray(vorschlaege) ? vorschlaege : [];
      Store.recherche.entscheidung = Object.fromEntries(Store.recherche.vorschlaege.map(v => [v.name, false]));
    }catch(e){
      Store.recherche.fehler = e.message;
    }
    Store.recherche.laedt = false;
    View.recherche();
  },

  rechercheSchliessen(){ Store.recherche = null; View.recherche(); },

  rechercheEntscheiden(name, wert){
    Store.recherche.entscheidung[name] = wert;
    View.recherche();
  },

  async rechercheUebernehmen(){
    const st = Store.recherche;
    const akzeptiert = st.vorschlaege.filter(v => st.entscheidung[v.name] && v.gefunden !== false);
    if(!akzeptiert.length){ App.rechercheSchliessen(); return; }
    if(!Store.rohstoffeWorkbook){
      View.meldung("Keine OneDrive-Verbindung — Vorschläge nicht geschrieben.", "warn", "Recherche nicht übernommen");
      App.rechercheSchliessen();
      return;
    }
    try{
      if(Store.rohstoffeETag){
        const meta = await Data.getItemMeta(CONFIG.rohstoffePfad);
        if(meta.eTag !== Store.rohstoffeETag){
          View.meldung("Rohstoffe.xlsx wurde zwischenzeitlich extern geändert — bitte Seite neu laden und erneut versuchen.",
            "warn", "Konflikt erkannt");
          return;
        }
      }
      await Data.backup(CONFIG.rohstoffePfad);
      const heute = new Date().toISOString().slice(0, 10).split("-").reverse().join(".");
      let geschrieben = 0; const fehlerListe = [];
      for(const v of akzeptiert){
        const rohstoff = Store.rohstoffe.find(r => Model.normKey(r.name) === Model.normKey(v.name));
        if(!rohstoff || !rohstoff._raw){ fehlerListe.push(v.name + " (Zeile unbekannt)"); continue; }
        const header = rohstoff._raw.spalten, zeileExcel = rohstoff._raw.zeile + 1;
        const felder = [];
        if(v.kostenProKg != null)
          felder.push(["Kosten/kg (CHF)", v.kostenProKg], ["Preis Quelle", v.quelle || "KI-Recherche"], ["Preis Stand", v.stand || heute]);
        if(v.naehrwerte){
          const n = v.naehrwerte, vorher = felder.length;
          if(n.kcal != null) felder.push(["kcal/100g", n.kcal]);
          if(n.eiweiss != null) felder.push(["Eiweiss g/100g", n.eiweiss]);
          if(n.fett != null) felder.push(["Fett g/100g", n.fett]);
          if(n.kh != null) felder.push(["KH g/100g", n.kh]);
          if(felder.length > vorher) felder.push(["Nährwert Quelle", v.quelle || "KI-Recherche"], ["Nährwert Stand", v.stand || heute]);
        }
        for(const [spalte, wert] of felder){
          const addr = Model.zelladresse(header, spalte, zeileExcel);
          if(!addr) continue;
          try{ await Data.updateCell(CONFIG.rohstoffePfad, Store.rohstoffeSheetName, addr, wert); }
          catch(e){ fehlerListe.push(v.name + "/" + spalte + ": " + e.message); }
        }
        geschrieben++;
      }
      try{ Store.rohstoffeETag = (await Data.getItemMeta(CONFIG.rohstoffePfad)).eTag; }
      catch(e){ Store.rohstoffeETag = null; }
      const konto = msalApp && msalApp.getActiveAccount();
      if(konto) await App.datenLaden(konto);
      View.meldung(geschrieben + " Rohstoff(e) aktualisiert." + (fehlerListe.length ? " Fehler bei: " + fehlerListe.join("; ") : ""),
        fehlerListe.length ? "warn" : "ok", "Recherche übernommen");
    }catch(e){
      View.meldung("Schreiben fehlgeschlagen: " + e.message, "err", "Recherche nicht übernommen");
    }
    App.rechercheSchliessen();
    if(Store.aktuellesRezept) View.rezept();
  }
};

// MSAL 5.x holt die Antwort aus dem Popup NICHT per URL-Polling ab. Die Seite auf der
// redirectUri muss die mitgelieferte Redirect-Bridge ausfuehren: sie schickt die Antwort per
// BroadcastChannel ans oeffnende Fenster und schliesst das Popup danach
// (msal-browser 5.20.0, lib/redirect-bridge/ -> broadcastResponseToMainFrame). Beim
// Redirect-Flow legt dieselbe Funktion die Antwort in den sessionStorage und navigiert
// zurueck zur Ausgangsseite, wo handleRedirectPromise() sie aufnimmt.
// Weil redirectUri = diese Seite selbst ist (ADR AP-0201), IST diese Seite die Bridge.
// Ohne das wartet loginPopup() im Hauptfenster bis zum Bridge-Timeout: der Klick auf
// «Anmelden» bleibt wirkungslos, ohne jede Fehlermeldung.
// Muss vor App.start() laufen — die App darf in diesem Fenster gar nicht erst starten.
document.addEventListener("DOMContentLoaded", () => {
  const bridge = window.msalRedirectBridge;
  if(Data.istAuthAntwortInUrl() && bridge && bridge.broadcastResponseToMainFrame){
    // Im Popup raeumt die Bridge die URL auf und schliesst das Fenster selbst. Bleibt es
    // offen — normaler Tab mit liegengebliebener Antwort, oder Bridge wirft bei fremdem
    // Zustand —, startet die App danach ganz normal weiter, damit kein totes Fenster
    // stehen bleibt. Data.bereinigeAuthAntwort() faengt einen Rest in der URL ab.
    bridge.broadcastResponseToMainFrame().catch(() => {}).then(() => App.start());
    return;
  }
  App.start();
});
</script>
