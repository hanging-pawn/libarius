    kats.forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = k; sel.appendChild(o); });
  },

  gefilterte(){
    const q = Store.suchtext.trim().toLowerCase();
    return Store.rezepte.filter(r =>
      (!Store.kategorie || r.kategorie === Store.kategorie) &&
      (!q || (r.name + " " + r.kategorie + " " + (r.unterkategorie||"")).toLowerCase().includes(q))
    );
  },

  // AP-0302: Navigation nach Kategorie gruppiert und aufklappbar (AP-0201 §1, Behebung von
  // O-13 "Rezeptsuche unübersichtlich" bei 80 Rezepten). Waehrend die Suche aktiv ist, stehen
  // alle Treffergruppen offen — unabhaengig vom gemerkten Zustand — sonst braeuchte ein Treffer
  // in einer zugeklappten Gruppe einen dritten Bedienschritt (Abnahmekriterium: max. zwei).
  liste(){
    const box = el("#liste"); const rs = View.gefilterte();
    const fehlerhaft = Store.rezepteFehlerhaft || [];
    if(!rs.length && !fehlerhaft.length){ box.innerHTML = '<div class="empty">Kein Rezept gefunden</div>'; return; }
    const suchtAktiv = !!Store.suchtext.trim();

    const gruppen = new Map();
    rs.forEach(r => {
      const kat = r.kategorie || "Ohne Kategorie";
      if(!gruppen.has(kat)) gruppen.set(kat, []);
      gruppen.get(kat).push(r);
    });
    const kats = [...gruppen.keys()].sort((a,b) => a.localeCompare(b, "de"));

    const gruppenHtml = kats.map(kat => {
      const items = gruppen.get(kat);
      const offen = suchtAktiv || NavGruppen.offen(kat);
      const zeilen = items.map(r => `
        <li><button data-id="${esc(r.id)}">
          <span class="nm">${esc(r.name)}${Korrekturen.hatOffene(r.id) ? '<span class="punkt" title="Offene Korrekturen">●</span>' : ""}</span>
          <span class="meta">${r.unterkategorie ? esc(r.unterkategorie) + " · " : ""}${r.portionen} ${esc(r.einheit)}</span>
        </button></li>`).join("");
      return `<details class="navgruppe" data-kat="${esc(kat)}"${offen ? " open" : ""}>
        <summary>${esc(kat)} <span class="anzahl">${items.length}</span></summary>
        <ul class="recipes">${zeilen}</ul>
      </details>`;
    }).join("");

    // FR-abgeleitet (Feinkonzept §7): ungültiges JSON blockiert nicht die Liste,
    // die betroffene Zeile wird sichtbar als fehlerhaft markiert statt geöffnet.
    const fehlerHtml = fehlerhaft.length ? `<div class="navgruppe-fehler"><ul class="recipes">
      ${fehlerhaft.map(f => `
        <li class="fehlerzeile">
          <span class="nm">${esc(f.name)}</span>
          <span class="warn-inline">fehlerhaft (Zeile ${f.zeile}) — ${esc(f.fehler)}</span>
        </li>`).join("")}
      </ul></div>` : "";

    box.innerHTML = gruppenHtml + fehlerHtml;
    box.querySelectorAll("button[data-id]").forEach(b =>
      b.addEventListener("click", () => App.rezeptOeffnen(b.dataset.id)));
    box.querySelectorAll("details.navgruppe").forEach(d =>
      d.addEventListener("toggle", () => {
        // Waehrend der Suche ist "offen" erzwungen (oben) — ein Toggle hier ist dann kein
        // bewusster Nutzerentscheid und darf den gemerkten Zustand nicht ueberschreiben.
        if(suchtAktiv) return;
        NavGruppen.toggle(d.dataset.kat, d.open);
      }));
  },

  // AP-0302/B2: Zustände leer/gefüllt aus AP-0201 §1. Wird nach jedem View.rezept() erneut
  // aufgerufen, damit Skalierung und Rezeptwechsel die Liste sofort nachziehen.
  einkaufsliste(){
    const box = el("#einkaufslisteInhalt");
    const rz = Store.aktuellesRezept;
    if(!rz){ box.innerHTML = '<div class="empty">Kein Rezept gewählt.</div>'; return; }
    // AP-0303 Abnahmekriterium 1: die Korrektur wirkt hier genauso wie in der Zutatenzeile.
    const kx = Korrekturen.get(rz.id);
    const posten = Calc.einkaufsliste(rz, Store.faktor, kx.zutaten);
    if(!posten.length){ box.innerHTML = '<div class="empty">Keine Zutaten.</div>'; return; }
    const abgehakt = Store.einkaufslisteAbgehakt[rz.id] || (Store.einkaufslisteAbgehakt[rz.id] = new Set());
    box.innerHTML = `<ul class="einkaufsliste">${posten.map(p => {
      const hak = abgehakt.has(p.key);
      const menge = p.korrigiert
        ? `${View.mengeText(p.g, p.einheit, p.rohstoff)} <span class="korrektur-soll">↕ <s>${View.mengeText(p.gSoll, p.einheit, p.rohstoff)}</s></span>`
        : View.mengeText(p.g, p.einheit, p.rohstoff);
      return `<li${hak ? ' class="abgehakt"' : ""}>
        <label>
          <input type="checkbox" data-key="${esc(p.key)}"${hak ? " checked" : ""}>
          <span class="nm">${esc(p.name)}</span>
          <span class="menge">${menge}</span>
        </label>
      </li>`;
    }).join("")}</ul>`;
    box.querySelectorAll("input[type=checkbox]").forEach(cb =>
      cb.addEventListener("change", e => {
        const key = e.target.dataset.key;
        if(e.target.checked) abgehakt.add(key); else abgehakt.delete(key);
        View.einkaufsliste();
      }));
  },

  // AP-0303/B4: Notizsection — freie Notiz plus Mengenkorrektur je Zutat (AP-0201 §1/§3).
  // Zustände leer/gefüllt wie B1/B2. Jede Änderung wirkt sofort (AP-0203 §6.2: "Bestätigung
  // nötig: nein") — es gibt kein "Speichern" ausser fuer den ausdruecklichen Uebernahmeweg.
  notizsection(){
    const box = el("#panelKochen");
    const rz = Store.aktuellesRezept;
    if(!rz){ box.innerHTML = '<div class="empty">Kein Rezept gewählt.</div>'; return; }
    const kx = Korrekturen.get(rz.id);
    const anzahl = Object.keys(kx.zutaten).length;

    const phasenHtml = rz.phasen.map((p, i) => {
      if(!p.zutaten.length) return "";
      const zeilen = p.zutaten.map((z, j) => {
        const key = i + "/" + j;
        const k = kx.zutaten[key];
        // Reine Zahl ohne Einheitensuffix — die Einheit steht bereits im eigenen <span>
        // daneben, und ein type="number"-Feld braucht einen parsbaren Wert.
        const platzhalter = Math.round(Calc.mengeG(z, rz.basisMengeG, Store.faktor) * 10) / 10;
        const wert = k ? Math.round(Calc.korrekturAktuell(k, Store.faktor) * 10) / 10 : "";
        return `<div class="korrekturzeile">
          <span class="nm">${esc(z.name)}</span>
          <input type="number" min="0" step="any" inputmode="decimal" data-korrektur="${esc(key)}"
            placeholder="${platzhalter}" value="${wert}">
          <span class="einheit">${esc(z.einheit)}</span>
          ${k ? `<button class="ghost" data-korrektur-loeschen="${esc(key)}">Zurücksetzen</button>` : ""}
        </div>`;
      }).join("");
      return `<div class="korrekturphase"><h4>${esc(p.name)}</h4>${zeilen}</div>`;
    }).join("");

    const uebernahme = anzahl ? `
      <div class="actions noprint" style="margin-top:.8rem">
        <button id="btnKorrekturUebernehmen">Ins Rezept übernehmen (${anzahl})</button>
        <button class="ghost" id="btnKorrekturenVerwerfen">Korrekturen verwerfen</button>
      </div>
      ${Store.korrekturUebernehmenOffen ? View.korrekturUebernehmenVorschau(rz, kx) : ""}` : "";

    box.innerHTML = `
      <section class="card">
        <h2>Notiz</h2>
        <div class="body">
          <textarea id="korrekturNotiz" style="width:100%;min-height:5rem"
            placeholder="Freie Notiz — was beim Kochen dazukommt…">${esc(kx.notiz)}</textarea>
        </div>
      </section>
      <section class="card">
        <h2>Mengenkorrekturen</h2>
        <div class="body">
          ${phasenHtml || '<div class="empty">Keine Zutaten.</div>'}
          ${uebernahme}
        </div>
      </section>`;

    el("#korrekturNotiz").addEventListener("input", e => {
      kx.notiz = e.target.value;
      Korrekturen.speichern();
    });
    box.querySelectorAll("[data-korrektur]").forEach(inp =>
      inp.addEventListener("change", e => {
        const wert = e.target.value.trim();
        if(!wert){ App.korrekturLoeschen(rz.id, e.target.dataset.korrektur); return; }
        App.korrekturSetzen(rz.id, e.target.dataset.korrektur, Number(wert));
      }));
    box.querySelectorAll("[data-korrektur-loeschen]").forEach(btn =>
      btn.addEventListener("click", () => App.korrekturLoeschen(rz.id, btn.dataset.korrekturLoeschen)));
    el("#btnKorrekturUebernehmen") && el("#btnKorrekturUebernehmen").addEventListener("click", () => {
      Store.korrekturUebernehmenOffen = true; View.notizsection();
    });
    el("#btnKorrekturenVerwerfen") && el("#btnKorrekturenVerwerfen").addEventListener("click", () => App.korrekturenVerwerfen(rz.id));
    el("#btnKorrekturUebernehmenBestaetigen") && el("#btnKorrekturUebernehmenBestaetigen").addEventListener("click", (e) => {
      const btn = e.currentTarget; btn.disabled = true;
      App.korrekturenUebernehmenBestaetigt().finally(() => { if(btn) btn.disabled = false; });
    });
    el("#btnKorrekturUebernehmenAbbrechen") && el("#btnKorrekturUebernehmenAbbrechen").addEventListener("click", () => {
      Store.korrekturUebernehmenOffen = false; View.notizsection();
    });
  },

  // AP-0203 §3 Schritt 2 (Vorschau), hier auf den schmalen Fall "nur Phasen (JSON), nur
  // die korrigierten Zutaten" zugeschnitten — der volle Editor mit allen Kopffeldern ist
  // AP-0305. Zwischen Klick auf "Ins Rezept übernehmen" und der geschriebenen Datei liegt
  // immer diese Bestätigung (AP-0203 §6.3: "nie automatisch").
  korrekturUebernehmenVorschau(rz, kx){
    const zeilen = Object.keys(kx.zutaten).map(key => {
      const [i, j] = key.split("/").map(Number);
      const p = rz.phasen[i], z = p && p.zutaten[j];
      if(!z) return "";
      const k = kx.zutaten[key];
      return `<tr><td>${esc(z.name)}</td><td>${esc(p.name)}</td>
        <td class="num">${View.mengeText(k.sollBeiEingabe, k.einheit, z.rohstoff)}</td>
        <td class="num">${View.mengeText(Calc.korrekturAktuell(k, Store.faktor), k.einheit, z.rohstoff)}</td></tr>`;
    }).join("");
    return `<div class="msg warn" style="margin-top:.7rem">
      <b>${Object.keys(kx.zutaten).length} Korrektur(en) ins Rezept übernehmen?</b>
      Die neue Menge wird die Sollmenge in Rezepte.xlsx — ein Backup wird vorher angelegt.
      Ohne Bestätigung wird nichts geschrieben.
      <table class="log" style="margin-top:.5rem"><tr><th>Zutat</th><th>Phase</th><th class="num">Bisher</th><th class="num">Neu</th></tr>${zeilen}</table>
      <div class="actions" style="margin-top:.6rem">
        <button id="btnKorrekturUebernehmenBestaetigen">Übernehmen</button>
        <button class="ghost" id="btnKorrekturUebernehmenAbbrechen">Abbrechen</button>
      </div>
    </div>`;
  },

  // AP-0302 Abnahmekriterium 2: die Einkaufsliste muss fuer eine unaufgeteilte Zutat
  // dieselbe Menge zeichengleich zeigen wie die Zutatenzeile — darum eine gemeinsame
  // Formatierfunktion statt einer zweiten Kopie der Rundungslogik.
  mengeText(g, einheit, rohstoff){
    const stk = Calc.alsStueck(g, rohstoff);
    return stk
      ? `${Calc.rundenStueck(stk.stueck)} Stk <span style="color:var(--muted);font-weight:400">(${Calc.runden(g, einheit)})</span>`
      : Calc.runden(g, einheit);
  },

  // AP-0303/§3.2: korrektur (optional) ist der Eintrag aus korrekturen[rezeptId].zutaten
  // fuer GENAU diese Zutat (Aufrufer loest ihn ueber "<phasenIdx>/<zutatIdx>" auf) — die
  // korrigierte Menge ersetzt die Sollmenge an ihrer Stelle, die alte Sollmenge steht
  // durchgestrichen daneben, und das Bäckerprozent rechnet mit der korrigierten Menge.
  zutatenzeile(z, rz, faktor, korrektur){
    const g = Calc.mengeG(z, rz.basisMengeG, faktor);
    const unbekannt = z.rohstoff ? "" : '<span class="warn-inline">unbekannter Rohstoff</span>';
    // AP-0314/§6: FODMAP-Ampel je Zutat, in Normal- UND Entwicklungsmodus sichtbar (beide
    // nutzen diese Funktion). Sichere Portion (g) nur als Tooltip — fliesst nirgends in eine
    // Rechnung ein (Spec-Vorgabe "nicht verrechnet").
    const fodmap = z.rohstoff && z.rohstoff.fodmap;
    const portion = z.rohstoff && z.rohstoff.fodmapPortionG;
    const fodmapHtml = fodmap
      ? `<span class="fodmap-ampel" style="color:var(--${fodmap})" title="FODMAP: ${esc(fodmap)}${portion ? " · sichere Portion " + portion + " g" : ""}">●</span>`
      : "";
    let menge, pct;
    if(korrektur){
      const istAktuell = Calc.korrekturAktuell(korrektur, faktor);
      menge = `${View.mengeText(istAktuell, korrektur.einheit, z.rohstoff)} `
        + `<span class="korrektur-soll" title="bei Faktor ${nf(korrektur.faktorBeiEingabe,2)} als `
        + `${Calc.runden(korrektur.ist, korrektur.einheit)} eingegeben">↕ <s>${View.mengeText(g, z.einheit, z.rohstoff)}</s></span>`;
      pct = istAktuell / (rz.basisMengeG * faktor) * 100;
    }else{
      menge = View.mengeText(g, z.einheit, z.rohstoff);
      pct = z.prozent * 100;
    }
    return `<tr><td>${esc(z.name)}${unbekannt}${fodmapHtml}</td>
      <td class="pct">${pct.toFixed(1)} %</td>
      <td class="menge">${menge}</td></tr>`;
  },

  // AP-0312/AP-0314: Versionen (entwicklung.versionen[].phasen) tragen keine aufgeloesten
  // Rohstoffverweise — anders als rz.phasen, das Model.aufloesen() nach jeder Aenderung
  // durchlaeuft. Fuer Ist-Kennzahlen, FODMAP-Ampeln und den Substitutions-Dialog braucht es
  // dieselbe Aufloesung, hier auf einer Kopie (mutiert weder rz noch die Version).
  entwVersionAufgeloest(rz, version){
    if(!version) return null;
    const idx = Model.rohstoffIndex(Store.rohstoffe);
    const phasen = (version.phasen || []).map(ph => ({
      name: ph.name,
      zutaten: (ph.zutaten || []).map(z => {
        const nameKey = Model.nameKey(z.name);
        return { ...z, nameKey, rohstoff: idx.get(nameKey) || null };
      })
    }));
    return { basisMengeG: rz.basisMengeG, portionen: rz.portionen, backprotokoll: rz.backprotokoll, phasen };
  },

  /* ---------- Entwicklungsmodus (AP-0311/§3, AP-0312/§4, AP-0314/§6) -------
     rz.entwicklung == null -> nur der Anstoss-Button (Abnahmekriterium 3: unveraendertes
     Verhalten ohne das Feld). Store.devForm haelt das jeweils eine offene Formular
     (Versions-Bearbeitung/-Neuanlage, Diff, Befoerdern-Bestaetigung, Versuchseintrag,
     Zielwerte, Substitution) — gleiches Prinzip wie Store.backEintrag. */
  entwKarte(rz){
    const e = rz.entwicklung;
    if(!e){
      return `<section class="card">
        <h2>Entwicklung</h2>
        <div class="body">
          <div class="hint">Kein Entwicklungsverlauf — dieses Rezept läuft als produktive Rezeptur.</div>
          <div class="actions noprint" style="margin-top:.6rem">
            <button class="ghost" id="btnEntwStarten">Entwicklungsmodus starten</button>
          </div>
        </div>
      </section>`;
    }

    const df = Store.devForm;
    const sortiert = (e.versionen || []).slice().sort((a,b) => a.v - b.v);
    const aktiv = Calc.entwAktiveVersion(e);
    // AP-0312/§2+§4: Ist-Kennzahlen der aktiven Version (nicht der produktiven rz.phasen) —
    // dieselben reinen Calc-Funktionen wie im Normalmodus, nur auf der aufgeloesten Version.
    const aktivResolved = View.entwVersionAufgeloest(rz, aktiv);
    const ist = aktivResolved ? (() => {
      const k = Calc.kennzahlen(aktivResolved, 1);
      const kosten = Calc.kosten(aktivResolved, 1, Calc.schwundAktuell(rz.backprotokoll));
      return { hydration:k.hydration, suesse:k.suesse, fett:k.fett, salz:k.salz, kosten_portion_chf:kosten.proPortion };
    })() : null;
    const fdAktiv = aktivResolved ? Calc.fodmapGesamt(Calc.zutatenFlach(aktivResolved)) : null;

    const versionenHtml = sortiert.map(v => `
      <div class="zuordnungzeile">
        <span class="nm">v${v.v}${aktiv && v.v === aktiv.v ? " ●" : ""} · ${esc(v.datum)}</span>
        <span class="hint" style="display:inline;flex:1;margin:0">${esc(v.notiz || "")}</span>
        <div class="actions noprint" style="flex:none">
          ${!(aktiv && v.v === aktiv.v) ? `<button class="ghost" data-entw-aktiv="${v.v}">Aktiv setzen</button>` : ""}
          <button class="ghost" data-entw-bearbeiten="${v.v}">Bearbeiten</button>
        </div>
      </div>`).join("") || '<div class="hint">Noch keine Version.</div>';

    let versionForm = "";
    if(df && df.art === "version"){
      versionForm = `
        <div class="noprint" style="border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem">
          <div class="hint">${df.modus === "neu"
            ? "Neue Version v" + df.v + " — Kopie der aktiven Version, danach frei editierbar."
            : "v" + df.v + " bearbeiten."}</div>
          <label style="display:block;margin-top:.5rem;font-size:.85rem;color:var(--muted)">Notiz
            <input id="devNotiz" type="text" style="width:100%;margin-top:.25rem" value="${esc(df.notiz)}"
              placeholder="Was hat sich geändert?"></label>
          <label style="display:block;margin-top:.6rem;font-size:.85rem;color:var(--muted)">Phasen (JSON) dieser Version
            <textarea id="devPhasenText" class="importtext" style="margin-top:.25rem">${esc(df.phasenText)}</textarea></label>
          <div class="actions noprint" style="margin-top:.7rem">
            <button id="btnEntwVersionSpeichern">Version speichern</button>
            <button class="ghost" id="btnEntwFormAbbrechen">Abbrechen</button>
          </div>
        </div>`;
    }

    let diffForm = "";
    if(df && df.art === "diff"){
      const vA = e.versionen.find(v => v.v === df.a), vB = e.versionen.find(v => v.v === df.b);
      const diff = Calc.entwDiff(vA, vB);
      const opt = (sel) => sortiert.map(v => `<option value="${v.v}"${v.v===sel?" selected":""}>v${v.v} (${esc(v.datum)})</option>`).join("");
      diffForm = `
        <div class="noprint" style="border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem">
          <div class="scaler" style="padding-top:0;border-top:0;margin-top:0">
            <label>Version A<select id="diffA">${opt(df.a)}</select></label>
            <label>Version B<select id="diffB">${opt(df.b)}</select></label>
          </div>
          <table class="log" style="margin-top:.7rem">
            <tr><th>Zutat</th><th class="num">v${df.a}</th><th class="num">v${df.b}</th><th class="num">Δ</th></tr>
            ${diff.zutaten.map(z => `<tr${z.delta != null && Math.abs(z.delta) > 0.0001 ? ' style="font-weight:600"' : ""}>
              <td>${esc(z.name)}</td><td class="num">${z.aPct==null?"—":pct(z.aPct,1)}</td>
              <td class="num">${z.bPct==null?"—":pct(z.bPct,1)}</td>
              <td class="num">${z.delta==null?"—":(z.delta>=0?"+":"")+pct(z.delta,1)}</td></tr>`).join("")}
          </table>
          <div class="hint">Schritte geändert: ${diff.schritte.filter(s=>s.geaendert).length
            ? esc(diff.schritte.filter(s=>s.geaendert).map(s=>s.phase).join(", "))
            : "keine"}</div>
          <div class="actions noprint" style="margin-top:.7rem">
            <button class="ghost" id="btnEntwFormAbbrechen">Schliessen</button>
          </div>
        </div>`;
    }

    let befoerdernForm = "";
    if(df && df.art === "befoerdern"){
      befoerdernForm = `
        <div class="noprint" style="border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem">
          <div class="msg warn"><b>v${df.v} wird produktive Rezeptur.</b> Bisherige Rezeptur bleibt als Version erhalten.</div>
          <div class="actions noprint" style="margin-top:.6rem">
            <button id="btnEntwBefoerdernBestaetigt">Bestätigen</button>
            <button class="ghost" id="btnEntwFormAbbrechen">Abbrechen</button>
          </div>
        </div>`;
    }

    // AP-0312/§4: Zielwerte-Panel — Ziel/Ist/Ampel je Kennzahl, plus Bearbeiten-Formular
    // (devForm art "zielwerte") mit "Rahmen herleiten" als zweiter Speicherpfad (erzeugt eine
    // neue Version statt nur die Zielwerte zu schreiben).
    const zw = e.zielwerte || {};
    const kzZeile = (label, istWert, zielWert, fmt) => {
      const amp = Calc.ampel(istWert, zielWert);
      return `<tr><td>${esc(label)}</td><td class="num">${zielWert==null?"—":fmt(zielWert)}</td>
        <td class="num">${istWert==null?"—":fmt(istWert)}</td>
        <td>${amp ? `<span style="color:var(--${amp})">●</span> ${esc(amp)}` : "—"}</td></tr>`;
    };
    let zielwerteForm = "";
    if(df && df.art === "zielwerte"){
      const zuckerarten = Store.rohstoffe.filter(r => r.suesskraft);
      zielwerteForm = `
        <div class="noprint" style="border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem">
          <div class="scaler" style="padding-top:0;border-top:0;margin-top:0">
            <label>Hydration (%)<input id="zwHydration" type="number" step="0.1" value="${esc(df.hydration)}"></label>
            <label>Süsse (%)<input id="zwSuesse" type="number" step="0.1" value="${esc(df.suesse)}"></label>
            <label>Fett (%)<input id="zwFett" type="number" step="0.1" value="${esc(df.fett)}"></label>
            <label>Salz (%)<input id="zwSalz" type="number" step="0.1" value="${esc(df.salz)}"></label>
            <label>Kosten/Portion (CHF)<input id="zwKosten" type="number" step="0.01" value="${esc(df.kosten)}"></label>
          </div>
          <label style="display:block;margin-top:.6rem;font-size:.85rem;color:var(--muted)">
            Zuckerart für «Rahmen herleiten» (nur nötig, wenn Süsse-Ziel gesetzt ist)
            <select id="zwZuckerart" style="width:100%;margin-top:.25rem">
              <option value="">— keine —</option>
              ${zuckerarten.map(r => `<option value="${esc(r.id)}"${r.id===df.zuckerartId?" selected":""}>
                ${esc(r.name)} (Süsskraft ${r.suesskraft})</option>`).join("")}
            </select></label>
          <div class="actions noprint" style="margin-top:.7rem">
            <button id="btnEntwZielwerteSpeichern">Zielwerte speichern</button>
            <button class="ghost" id="btnEntwRahmenHerleiten">Rahmen herleiten — neue Version</button>
            <button class="ghost" id="btnEntwFormAbbrechen">Abbrechen</button>
          </div>
        </div>`;
    }
    const zielwerteHtml = `
      <h3 style="margin:1.1rem 0 .4rem;font-size:.95rem">Zielwerte</h3>
      <table class="log">
        <tr><th>Kennzahl</th><th class="num">Ziel</th><th class="num">Ist</th><th>Ampel</th></tr>
        ${kzZeile("Hydration", ist && ist.hydration, zw.hydration_pct, v=>pct(v,1))}
        ${kzZeile("Süsse", ist && ist.suesse, zw.suesse_pct, v=>pct(v,1))}
        ${kzZeile("Fett", ist && ist.fett, zw.fett_pct, v=>pct(v,1))}
        ${kzZeile("Salz", ist && ist.salz, zw.salz_pct, v=>pct(v,1))}
        ${kzZeile("Kosten/Portion", ist && ist.kosten_portion_chf, zw.kosten_portion_chf, v=>chf(v))}
      </table>
      ${!ist ? '<div class="hint">Noch keine Version — Ist-Kennzahlen erst nach der ersten Version verfügbar.</div>' : ""}
      <div class="actions noprint" style="margin-top:.7rem">
        <button class="ghost" id="btnEntwZielwerte">Zielwerte bearbeiten</button>
      </div>
      ${zielwerteForm}`;

    // AP-0314/§6: Austausch-Formular (devForm art "substitution") — vor der Zutatenliste
    // berechnet, weil diese den fertigen substForm-String direkt unter der betroffenen Zeile
    // einhaengt (kein zweiter Rendering-Durchlauf noetig).
    let substForm = "";
    if(df && df.art === "substitution"){
      const kandidaten = Store.rohstoffe.filter(r => r.kategorie === df.altKategorie && r.id !== df.altRohstoffId);
      const kandidat = kandidaten.find(r => r.id === df.kandidatId);
      let rechnungHtml = "";
      if(kandidat){
        const umrechnung = Calc.substitutionsMenge(df.altMengeG, df.altSuesskraft, kandidat.suesskraft || 0);
        rechnungHtml = umrechnung.hinweis
          ? `<div class="hint"><span class="warn-inline" style="margin-left:0">${esc(umrechnung.hinweis)}</span> — neue Menge: ${Calc.runden(umrechnung.menge, df.altEinheit)}.</div>`
          : `<div class="hint">Rechnung: ${Calc.runden(df.altMengeG,"g")} × (${df.altSuesskraft} ÷ ${kandidat.suesskraft}) = ${Calc.runden(umrechnung.menge,"g")}</div>`;
      }
      substForm = `
        <div class="noprint" style="border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem">
          <div class="hint">Ersatz für <b>${esc(df.altName)}</b> (${Calc.runden(df.altMengeG, df.altEinheit)})</div>
          <label style="display:block;margin-top:.5rem;font-size:.85rem;color:var(--muted)">Ersatzprodukt
            <select id="substKandidat" style="width:100%;margin-top:.25rem">
              <option value="">— wählen —</option>
              ${kandidaten.map(r => `<option value="${esc(r.id)}"${r.id===df.kandidatId?" selected":""}>
                ${esc(r.name)} — Süsskraft ${r.suesskraft ?? "—"} · FODMAP ${r.fodmap ?? "—"} · CHF ${r.kostenProKg ?? "—"}/kg</option>`).join("")}
            </select></label>
          ${rechnungHtml}
          <div class="actions noprint" style="margin-top:.7rem">
            <button id="btnEntwSubstUebernehmen"${kandidat?"":" disabled"}>Übernehmen — neue Version</button>
            <button class="ghost" id="btnEntwFormAbbrechen">Abbrechen</button>
          </div>
        </div>`;
    }

    // AP-0314/§6: Zutaten der aktiven Version mit FODMAP-Ampel + Austausch-Anstoss je Zutat.
    // Ersetzt niemals rz.phasen direkt — jede Substitution läuft über App.entwSpeichern und
    // legt immer eine neue Version an.
    let aktivZutatenHtml = "";
    if(aktivResolved){
      const zeilen = [];
      aktivResolved.phasen.forEach((ph, pi) => (ph.zutaten || []).forEach((z, zi) => {
        const g = Calc.mengeG(z, rz.basisMengeG, 1);
        const fodmap = z.rohstoff && z.rohstoff.fodmap;
        const fodmapHtml = fodmap
          ? `<span class="fodmap-ampel" style="color:var(--${fodmap})" title="FODMAP: ${esc(fodmap)}${
              z.rohstoff.fodmapPortionG ? " · sichere Portion " + z.rohstoff.fodmapPortionG + " g" : ""}">●</span>` : "";
        const offen = df && df.art === "substitution" && df.phaseIdx === pi && df.zutatIdx === zi;
        zeilen.push(`<tr><td>${esc(ph.name)} · ${esc(z.name)}${z.rohstoff?"":' <span class="warn-inline">unbekannt</span>'}${fodmapHtml}</td>
          <td class="pct">${(z.prozent*100).toFixed(1)} %</td>
          <td class="menge">${Calc.runden(g, z.einheit)}</td>
          <td class="noprint"><button class="ghost" data-subst-phase="${pi}" data-subst-zutat="${zi}">Ersetzen</button></td>
        </tr>${offen ? `<tr class="noprint"><td colspan="4" style="padding:0">${substForm}</td></tr>` : ""}`);
      }));
      if(zeilen.length){
        aktivZutatenHtml = `
          <h3 style="margin:1.1rem 0 .4rem;font-size:.95rem">Zutaten v${aktiv.v} — Substitution</h3>
          <table class="zutaten">${zeilen.join("")}</table>
          <div class="hint">FODMAP gesamt (v${aktiv.v}): <b>${fdAktiv.ampel ? esc(fdAktiv.ampel) : "—"}</b>${
            fdAktiv.unbewertet ? ` · ${fdAktiv.unbewertet} Zutat(en) unbewertet` : ""}</div>`;
      }
    }

    // AP-0313/§5: Referenz-Vergleich. Die Auswahl (Suche + Kategoriefilter + Trefferliste) ist
    // noprint, die Tabelle selbst nicht — sie soll über das Print-CSS aus AP-0306 mitdrucken.
    // Suchtext/Kategorie liegen bewusst in devForm und nicht in Store.suchtext/Store.kategorie:
    // die Referenzsuche darf die Rezeptliste links nicht mitfiltern.
    const refs = Store.referenzIds
      .map(id => Store.rezepte.find(r => r.id === id))
      .filter(Boolean)
      .filter(r => r.id !== rz.id);
    let referenzWahl = "";
    if(df && df.art === "referenz"){
      const q = (df.suchtext || "").trim().toLowerCase();
      const kats = [...new Set(Store.rezepte.map(r => r.kategorie).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"de"));
      const treffer = Store.rezepte.filter(r =>
        r.id !== rz.id
        && !Store.referenzIds.includes(r.id)
        && (!df.kategorie || r.kategorie === df.kategorie)
        && (!q || (r.name + " " + r.kategorie + " " + (r.unterkategorie||"")).toLowerCase().includes(q))
      ).slice(0, 40);
      const voll = refs.length >= 3;
      referenzWahl = `
        <div class="noprint" style="border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem">
          <div class="scaler" style="padding-top:0;border-top:0;margin-top:0">
            <label>Suche<input id="refSuche" type="search" value="${esc(df.suchtext || "")}"
              placeholder="Rezept suchen…" autocomplete="off"></label>
            <label>Kategorie<select id="refKategorie">
              <option value="">Alle Kategorien</option>
              ${kats.map(k => `<option value="${esc(k)}"${k===df.kategorie?" selected":""}>${esc(k)}</option>`).join("")}
            </select></label>
          </div>
          ${voll
            ? '<div class="hint">Drei Referenzen gewählt — für eine weitere zuerst eine entfernen.</div>'
            : treffer.length
              ? `<div class="refliste">${treffer.map(r => `<button data-ref-add="${esc(r.id)}">
                  ${esc(r.name)} <span style="color:var(--muted);font-size:.82rem">· ${esc(r.kategorie)}</span>
                </button>`).join("")}</div>`
              : '<div class="hint">Kein Rezept gefunden.</div>'}
          <div class="actions noprint" style="margin-top:.7rem">
            <button class="ghost" id="btnEntwFormAbbrechen">Schliessen</button>
          </div>
        </div>`;
    }

    let vergleichHtml = "";
    if(aktivResolved && refs.length){
      const vg = Calc.referenzVergleich(aktivResolved, refs);
      const fmt = (art, v) => v == null ? "—" : (art === "chf" ? chf(v) : pct(v, 1));
      const zeileHtml = z => `<tr><td>${esc(z.label)}</td>
        <td class="num">${fmt(z.art, z.wert)}</td>
        ${z.refs.map(r => `<td class="num${r.markiert ? " abw" : ""}"${
          r.abw != null ? ` title="Abweichung ${(r.abw*100).toFixed(0)} % gegenüber der Entwicklungsversion"` : ""
        }>${fmt(z.art, r.wert)}</td>`).join("")}</tr>`;
      vergleichHtml = `
        <div class="tabellescroll">
          <table class="log vergleich">
            <tr><th>Kennzahl</th><th class="num">v${aktiv.v} (Entwicklung)</th>
              ${refs.map(r => `<th class="num">${esc(r.name)}</th>`).join("")}</tr>
            ${vg.kennzahlen.map(zeileHtml).join("")}
            <tr class="gruppe"><td colspan="${refs.length + 2}">Zutaten (% der Basis)</td></tr>
            ${vg.zutaten.map(zeileHtml).join("")}
          </table>
        </div>
        <div class="hint">▲ markiert: mehr als 20 % relative Abweichung der Referenz gegenüber
          der Entwicklungsversion v${aktiv.v}.</div>`;
    }
    const referenzHtml = `
      <h3 style="margin:1.1rem 0 .4rem;font-size:.95rem">Referenz-Vergleich</h3>
      ${refs.length ? `<div class="noprint">${refs.map(r => `<span class="refchip">${esc(r.name)}
        <button class="ghost" data-ref-del="${esc(r.id)}" title="Referenz entfernen">✕</button></span>`).join("")}</div>` : ""}
      ${vergleichHtml}
      ${!aktivResolved
        ? '<div class="hint">Noch keine Version — der Vergleich braucht eine Entwicklungsversion.</div>'
        : !refs.length
          ? '<div class="hint">Keine Referenz gewählt — bis zu 3 Bestandsrezepte zum Vergleich hinzufügen.</div>'
          : ""}
      <div class="actions noprint" style="margin-top:.7rem">
        <button class="ghost" id="btnEntwReferenz">Referenzen wählen</button>
      </div>
      ${referenzWahl}`;

    const versuche = (e.versuche || []).slice().sort((a,b) => (a.datum||"").localeCompare(b.datum||""));
    const versucheHtml = versuche.length ? `
      <table class="log">
        <tr><th>Datum</th><th>Version</th><th class="num">Soll</th><th class="num">Ist</th><th>Bewertung</th><th>Erkenntnis</th></tr>
        ${versuche.map(v => `<tr>
          <td>${esc(v.datum)}</td><td>v${v.version}</td>
          <td class="num">${v.soll_g} g</td><td class="num">${v.ist_g} g</td>
          <td>${"★".repeat(v.bewertung)}${"☆".repeat(5-v.bewertung)}</td>
          <td>${esc(v.erkenntnis||"")}</td></tr>`).join("")}
      </table>` : '<div class="hint">Noch kein Versuch erfasst.</div>';

    let versuchForm = "";
    if(df && df.art === "versuch"){
      versuchForm = `
        <div class="noprint" style="border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem">
          <div class="scaler" style="padding-top:0;border-top:0;margin-top:0">
            <label>Datum<input id="devDatum" type="date" value="${esc(df.datum)}"></label>
            <label>Version<select id="devVersion">${sortiert.map(v=>`<option value="${v.v}"${v.v===df.version?" selected":""}>v${v.v}</option>`).join("")}</select></label>
            <label>Soll (g)<input id="devSoll" type="number" min="1" step="1" value="${esc(df.soll)}"></label>
            <label>Ist (g)<input id="devIst" type="number" min="1" step="1" value="${esc(df.ist)}"></label>
            <label>Bewertung<select id="devBewertung">${[1,2,3,4,5].map(n=>`<option value="${n}"${n===df.bewertung?" selected":""}>${n} — ${"★".repeat(n)}${"☆".repeat(5-n)}</option>`).join("")}</select></label>
          </div>
          <label style="display:block;margin-top:.6rem;font-size:.85rem;color:var(--muted)">Erkenntnis
            <input id="devErkenntnis" type="text" style="width:100%;margin-top:.25rem" value="${esc(df.erkenntnis)}"
              placeholder="z. B. Krume offener, Kruste zu blass"></label>
          <div class="actions noprint" style="margin-top:.7rem">
            <button id="btnEntwVersuchSpeichern">Versuch speichern</button>
            <button class="ghost" id="btnEntwFormAbbrechen">Abbrechen</button>
          </div>
        </div>`;
    }

    return `<section class="card">
      <h2>Entwicklung</h2>
      <div class="body">
        <div class="hint">Status: <b>${e.status === "produktiv" ? "produktiv, Verlauf erhalten" : "in Entwicklung"}</b></div>
        ${versionenHtml}
        <div class="actions noprint" style="margin-top:.7rem">
          <button class="ghost" id="btnEntwVersionNeu">+ Neue Version</button>
          ${sortiert.length >= 2 ? `<button class="ghost" id="btnEntwDiff">Vergleichen</button>` : ""}
          ${aktiv ? `<button class="ghost" id="btnEntwBefoerdern">Version befördern</button>` : ""}
        </div>
        ${versionForm}${diffForm}${befoerdernForm}
        ${zielwerteHtml}
        ${aktivZutatenHtml}
        ${referenzHtml}
        <h3 style="margin:1.1rem 0 .4rem;font-size:.95rem">Versuche</h3>
        ${versucheHtml}
        <div class="actions noprint" style="margin-top:.7rem">
          <button class="ghost" id="btnEntwVersuchNeu">+ Neuer Versuch</button>
        </div>
        ${versuchForm}
      </div>
    </section>`;
  },

  entwEreignisse(rz){
    el("#btnEntwStarten") && el("#btnEntwStarten").addEventListener("click", () => App.entwStarten());
    if(!rz.entwicklung) return;
    document.querySelectorAll("[data-entw-aktiv]").forEach(b =>
      b.addEventListener("click", () => App.entwAktivSetzen(Number(b.dataset.entwAktiv))));
    document.querySelectorAll("[data-entw-bearbeiten]").forEach(b =>
      b.addEventListener("click", () => App.entwVersionBearbeitenOeffnen(Number(b.dataset.entwBearbeiten))));
    el("#btnEntwVersionNeu") && el("#btnEntwVersionNeu").addEventListener("click", () => App.entwVersionNeuOeffnen());
    el("#btnEntwDiff") && el("#btnEntwDiff").addEventListener("click", () => App.entwDiffOeffnen());
    el("#btnEntwBefoerdern") && el("#btnEntwBefoerdern").addEventListener("click", () => App.entwBefoerdernOeffnen());
    el("#btnEntwVersuchNeu") && el("#btnEntwVersuchNeu").addEventListener("click", () => App.entwVersuchOeffnen());
    el("#btnEntwFormAbbrechen") && el("#btnEntwFormAbbrechen").addEventListener("click", () => App.entwFormAbbrechen());
    el("#btnEntwZielwerte") && el("#btnEntwZielwerte").addEventListener("click", () => App.entwZielwerteOeffnen());
    el("#btnEntwReferenz") && el("#btnEntwReferenz").addEventListener("click", () => App.entwReferenzOeffnen());
    document.querySelectorAll("[data-ref-add]").forEach(b =>
      b.addEventListener("click", () => App.entwReferenzHinzufuegen(b.dataset.refAdd)));
    document.querySelectorAll("[data-ref-del]").forEach(b =>
      b.addEventListener("click", () => App.entwReferenzEntfernen(b.dataset.refDel)));
    document.querySelectorAll("[data-subst-phase]").forEach(b =>
      b.addEventListener("click", () => App.entwSubstitutionOeffnen(Number(b.dataset.substPhase), Number(b.dataset.substZutat))));

    const df = Store.devForm;
    if(df && df.art === "version"){
      el("#devNotiz").addEventListener("input", e => { df.notiz = e.target.value; });
      el("#devPhasenText").addEventListener("input", e => { df.phasenText = e.target.value; });
      el("#btnEntwVersionSpeichern").addEventListener("click", (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        App.entwVersionSpeichern().finally(() => { if(btn) btn.disabled = false; });
      });
    }
    if(df && df.art === "diff"){
      el("#diffA").addEventListener("change", e => App.entwDiffAendern("a", e.target.value));
      el("#diffB").addEventListener("change", e => App.entwDiffAendern("b", e.target.value));
    }
    if(df && df.art === "befoerdern"){
      el("#btnEntwBefoerdernBestaetigt").addEventListener("click", (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        App.entwBefoerdernBestaetigt().finally(() => { if(btn) btn.disabled = false; });
      });
    }
    if(df && df.art === "versuch"){
      el("#devDatum").addEventListener("input", e => { df.datum = e.target.value; });
      el("#devVersion").addEventListener("change", e => { df.version = Number(e.target.value); });
      el("#devSoll").addEventListener("input", e => { df.soll = e.target.value; });
      el("#devIst").addEventListener("input", e => { df.ist = e.target.value; });
      el("#devBewertung").addEventListener("change", e => { df.bewertung = Number(e.target.value); });
      el("#devErkenntnis").addEventListener("input", e => { df.erkenntnis = e.target.value; });
      el("#btnEntwVersuchSpeichern").addEventListener("click", (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        App.entwVersuchSpeichern().finally(() => { if(btn) btn.disabled = false; });
      });
    }
    if(df && df.art === "zielwerte"){
      el("#zwHydration").addEventListener("input", e => { df.hydration = e.target.value; });
      el("#zwSuesse").addEventListener("input", e => { df.suesse = e.target.value; });
      el("#zwFett").addEventListener("input", e => { df.fett = e.target.value; });
      el("#zwSalz").addEventListener("input", e => { df.salz = e.target.value; });
      el("#zwKosten").addEventListener("input", e => { df.kosten = e.target.value; });
      el("#zwZuckerart").addEventListener("change", e => { df.zuckerartId = e.target.value; });
      el("#btnEntwZielwerteSpeichern").addEventListener("click", (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        App.entwZielwerteSpeichern().finally(() => { if(btn) btn.disabled = false; });
      });
      el("#btnEntwRahmenHerleiten").addEventListener("click", (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        App.entwRahmenHerleiten().finally(() => { if(btn) btn.disabled = false; });
      });
    }
    if(df && df.art === "referenz"){
      // Die Trefferliste muss beim Tippen mitlaufen, dafuer wird die Karte neu gezeichnet —
      // das Suchfeld verliert dabei den Fokus. Darum hier gezielt zurueckholen und den Cursor
      // ans Ende setzen, sonst tippt man nach dem ersten Zeichen ins Leere.
      const suche = el("#refSuche");
      if(suche){
        suche.addEventListener("input", e => App.entwReferenzSuche(e.target.value));
        if(df.fokus){ suche.focus(); suche.setSelectionRange(suche.value.length, suche.value.length); }
      }
      el("#refKategorie") && el("#refKategorie").addEventListener("change", e => App.entwReferenzKategorie(e.target.value));
    }
    if(df && df.art === "substitution"){
      el("#substKandidat").addEventListener("change", e => App.entwSubstitutionKandidatWaehlen(e.target.value));
      el("#btnEntwSubstUebernehmen") && el("#btnEntwSubstUebernehmen").addEventListener("click", (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        App.entwSubstitutionUebernehmen().finally(() => { if(btn) btn.disabled = false; });
      });
    }
  },

  /* ---------- AP-0304: Metadaten-Ausklapper (B5) -------------------------------
     Alles, was vor dem Drucken aufgeklappt werden muss. Als Konstante, damit ein
     neuer Ausklapper an genau EINER Stelle eingetragen wird und der Selbsttest die
     Vollstaendigkeit pruefen kann (Abnahmekriterium 2). */
  DRUCK_AUFKLAPPEN: "details.phase, details.metablock",

  /* true, solange der Druckpfad die Ausklapper zwangsweise oeffnet. Das Setzen von
     details.open loest ein toggle-Ereignis aus — ohne diese Sperre wuerden die
     Zuhoerer unten den erzwungenen Zustand als Nutzerwahl merken, und nach dem Druck
     staende alles offen (der afterprint-Rueckbau aus AP-0306 baut ja genau aus diesem
     gemerkten Zustand neu auf). Betrifft Phasen und Metadatenbloecke gleichermassen. */
  druckLaeuft: false,

  phaseToggle(d){
    if(View.druckLaeuft) return;
    const i = Number(d.dataset.i);
    d.open ? Store.offenePhasen.add(i) : Store.offenePhasen.delete(i);
  },
  metablockToggle(d){
    if(View.druckLaeuft) return;
    Layout.metaSetzen(d.dataset.block, d.open);
  },
  drucken(){
    View.druckLaeuft = true;
    document.querySelectorAll(View.DRUCK_AUFKLAPPEN).forEach(d => { d.open = true; });
    window.print();
    View.druckLaeuft = false;
  },

  // AP-0305/§4.4: Kachel fuer einen liegengebliebenen Entwurf, erscheint nur, solange der
  // Editor selbst zu ist (View.rezept() reicht entwurfGespeichert nur dann durch).
  entwurfTile(gespeichert){
    const dt = new Date(gespeichert.ts);
    const wann = isNaN(dt) ? gespeichert.ts : dt.toLocaleString("de-CH");
    return `<div class="msg warn noprint">
      Für dieses Rezept liegt ein nicht gespeicherter Entwurf vom ${esc(wann)} bereit.
      <div class="actions" style="margin-top:.5rem">
        <button id="btnEntwurfOeffnen">Entwurf öffnen</button>
        <button class="ghost" id="btnEntwurfVerwerfen">Entwurf verwerfen</button>
      </div>
    </div>`;
  },

  // AP-0305/AP-0203 §4.1-§4.2: Konfliktdialog, wortwoertlich aus dem Konzept. fremdeAnsicht
  // zeigt stattdessen den frisch geladenen Bestand (rz.phasen, zu diesem Zeitpunkt bereits
  // der NEUE Stand aus OneDrive, siehe App.zutatenEditorSpeichern) neben dem Entwurf.
  zutatenEditorKonflikt(rz, ed){
    if(ed.konflikt.fremdeAnsicht){
      const fremd = rz.phasen.map(ph => `<div class="editorphase"><h4>${esc(ph.name)}</h4>
        <table class="zutaten">${(ph.zutaten||[]).map(z => `<tr><td>${esc(z.name)}</td>
          <td class="pct">${(z.prozent*100).toFixed(1)} %</td>
          <td class="menge">${Calc.runden(z.prozent*rz.basisMengeG, z.einheit)}</td></tr>`).join("")}</table></div>`).join("");
      return `<div class="msg warn noprint">
        <b>Fremde Fassung — aktueller Stand in Rezepte.xlsx</b>
        ${fremd}
        <div class="actions" style="margin-top:.6rem"><button class="ghost" id="btnZutatenKonfliktZurueck">Zurück zum Dialog</button></div>
      </div>`;
    }
    return `<div class="msg warn noprint">
      <b>Rezepte.xlsx wurde zwischenzeitlich geändert</b>
      Seit dem Öffnen dieses Rezepts hat jemand anders (oder ein anderes Gerät) die Datei gespeichert.
      Deine Änderungen sind nicht verloren — sie liegen als Entwurf bereit.<br>
      Der Bestand wurde neu geladen. Du kannst deine Fassung speichern und die fremde Änderung in diesen
      Feldern überschreiben, sie zuerst ansehen, oder deinen Entwurf vorerst behalten.
      <div class="actions" style="margin-top:.6rem">
        <button id="btnZutatenKonfliktMeine">Meine Fassung speichern</button>
        <button class="ghost" id="btnZutatenKonfliktFremde">Fremde Fassung ansehen</button>
        <button class="ghost" id="btnZutatenKonfliktBehalten">Entwurf behalten</button>
      </div>
    </div>`;
  },

  // AP-0305: der eigentliche Zutaten-Editor — ersetzt table.zutaten/ol.schritte 1:1 an
  // derselben Stelle (Zubereitung-Karte). Prueft bei jedem Rendern neu (Editor.pruefen ist
  // rein und billig) und haengt das Ergebnis an ed.pruefung — App.zutatenEditorSpeichern()
  // nutzt dieselbe Pruefung, ohne sie ein zweites Mal auszuformulieren.
  zutatenEditorMarkup(rz, ed){
    if(ed.konflikt) return View.zutatenEditorKonflikt(rz, ed);

    const normPhasen = Editor.normalisiert(ed.phasen);
    const pruefung = Editor.pruefen(normPhasen, rz);
    ed.pruefung = pruefung;

    const rohstoffOptionen = [...new Set(Store.rohstoffe.map(r => r.name))].sort()
      .map(n => `<option value="${esc(n)}">`).join("");

    const phasenHtml = ed.phasen.map((ph, pi) => {
      const zeilen = (ph.zutaten || []).map((z, zi) => {
        const leer = z.prozent === "" || z.prozent == null || isNaN(Number(z.prozent));
        const g = leer ? "" : Math.round(Number(z.prozent) * rz.basisMengeG * 10) / 10;
        const pc = leer ? "" : Math.round(Number(z.prozent) * 100 * 1000) / 1000;
        return `<div class="editorzeile" data-pi="${pi}" data-zi="${zi}">
          <input type="text" data-feld="name" value="${esc(z.name || "")}" placeholder="Zutat" list="zutatenvorschlaege">
          <input type="number" data-feld="menge" min="0" step="any" value="${g}" title="Menge in Gramm (Basis ${rz.basisMengeG} g)">
          <input type="number" data-feld="prozent" min="0" step="any" value="${pc}" title="Bäckerprozent">
          <select data-feld="einheit">${Import.EINHEITEN.map(e => `<option value="${e}"${z.einheit === e ? " selected" : ""}>${e}</option>`).join("")}</select>
          <button type="button" class="entfernen" data-entfernen title="Zutat entfernen">×</button>
        </div>`;
      }).join("");
      const schritteHtml = (ph.schritte || []).map((s, si) => `
        <div class="editorschritt" data-pi="${pi}" data-si="${si}">
          <input type="text" data-schritt value="${esc(s.text || "")}" placeholder="Zubereitungsschritt">
          <button type="button" class="entfernen" data-schritt-entfernen title="Schritt entfernen">×</button>
        </div>`).join("");
      return `<div class="editorphase" data-pi="${pi}">
        <h4>${esc(ph.name)}</h4>
        ${zeilen}
        <div class="actions noprint editorhinzu"><button class="ghost" type="button" data-zutat-hinzu="${pi}">+ Zutat</button></div>
        ${schritteHtml}
        <div class="actions noprint editorhinzu"><button class="ghost" type="button" data-schritt-hinzu="${pi}">+ Schritt</button></div>
      </div>`;
    }).join("");

    const fehlerHtml = pruefung.abweisen.length
      ? `<ul class="editorfehler">${pruefung.abweisen.map(f => `<li>${esc(f.feld)}: ${esc(f.grund)}</li>`).join("")}</ul>` : "";
    const warnHtml = pruefung.warnen.length
      ? `<ul class="editorwarnung">${pruefung.warnen.map(f => `<li>${esc(f.grund)}${
          f.phaseIndex != null ? ` <button class="ghost" type="button" data-zusammenfassen="${f.phaseIndex}|${esc(f.nameKey)}">Zusammenfassen</button>` : ""
        }</li>`).join("")}</ul>` : "";

    // §3 Schritt 2 (Vorschau): erst der zweite Klick auf "Speichern" (hier: "Jetzt speichern")
    // schreibt tatsaechlich — jede Feldaenderung davor setzt ed.vorschauBestaetigt zurueck.
    const vorschau = ed.vorschauBestaetigt ? (() => {
      const diff = Editor.diff(rz.phasen, normPhasen);
      return `<div class="editorvorschau">
        <b>${diff.anzahl} Änderung${diff.anzahl === 1 ? "" : "en"}</b> an „${esc(rz.name)}“ — vor dem Speichern wird ein Backup angelegt.
        ${diff.details.length ? `<ul>${diff.details.map(d => `<li>${esc(d)}</li>`).join("")}</ul>` : '<div class="hint" style="margin-top:.4rem">Keine inhaltliche Änderung erkannt.</div>'}
        <div class="actions noprint" style="margin-top:.6rem">
          <button id="btnZutatenJetztSpeichern"${pruefung.ok ? "" : " disabled"}>Jetzt speichern</button>
          <button class="ghost" id="btnZutatenVorschauZurueck">Zurück</button>
        </div>
      </div>`;
    })() : "";

    const speichernTitel = pruefung.abweisen[0] ? esc(pruefung.abweisen[0].feld + ": " + pruefung.abweisen[0].grund) : "";
    return `
      <datalist id="zutatenvorschlaege">${rohstoffOptionen}</datalist>
      <div class="noprint" style="padding:0 1rem 1rem">
        ${phasenHtml}
        ${fehlerHtml}
        ${warnHtml}
        ${!ed.vorschauBestaetigt ? `
          <div class="actions" style="margin-top:.8rem">
            <button id="btnZutatenSpeichern"${pruefung.ok ? "" : ' disabled title="' + speichernTitel + '"'}>Speichern</button>
            <button class="ghost" id="btnZutatenAbbrechen">Abbrechen</button>
          </div>` : ""}
        ${vorschau}
      </div>`;
  },

  rezept(){
    const rz = Store.aktuellesRezept, f = Store.faktor;
    if(!rz){
      el("#rezeptbereich").innerHTML = "";
      el("#panelEntwicklung").innerHTML = '<div class="empty">Kein Rezept gewählt.</div>';
      View.einkaufsliste();
      View.notizsection();
      return;
    }

    // AP-0303: Korrekturablage dieses Rezepts — Zutatenzeile, Einkaufsliste und die
    // Notizsection selbst lesen alle von hier, damit nirgends eine zweite Wahrheit entsteht.
    const kx = Korrekturen.get(rz.id);
    const schwund = Calc.schwundAktuell(rz.backprotokoll);
    const k = Calc.kosten(rz, f, schwund);
    const n = Calc.naehrwerte(rz, f);
    const fd = Calc.fodmapGesamt(Calc.zutatenFlach(rz));

    const phasen = rz.phasen.map((p, i) => {
      const offen = Store.offenePhasen.has(i) ? " open" : "";
      const zt = p.zutaten.length
        ? `<table class="zutaten">${p.zutaten.map((z, j) => View.zutatenzeile(z, rz, f, kx.zutaten[i + "/" + j])).join("")}</table>` : "";
      const sc = p.schritte.length
        ? `<ol class="schritte">${p.schritte.map(s => `<li>${esc(s.text)}</li>`).join("")}</ol>` : "";
      return `<details class="phase" data-i="${i}"${offen}>
                <summary>${esc(p.name)}</summary>
                <div class="phasebody">${zt}${sc}</div>
              </details>`;
    }).join("");

    // AP-0305: Zutaten-Editor — ed != null heisst "dieses Rezept wird gerade bearbeitet".
    // entwurfGespeichert ist ein liegengebliebener Entwurf aus einem frueheren Konflikt/
    // Abbruch (§4.4); die Kachel dazu erscheint nur, solange der Editor selbst zu ist.
    const ed = (Store.zutatenEditor && Store.zutatenEditor.rezeptId === rz.id) ? Store.zutatenEditor : null;
    const entwurfGespeichert = !ed ? Entwurf.lesen(rz.id) : null;
    const bearbeitenButton = !ed
      ? `<div class="actions noprint" style="padding:.6rem 1rem 0"><button class="ghost" id="btnZutatenBearbeiten">Bearbeiten</button></div>` : "";
    const entwurfTile = entwurfGespeichert ? View.entwurfTile(entwurfGespeichert) : "";
    const zubereitungInhalt = ed ? View.zutatenEditorMarkup(rz, ed) : phasen;

    const log = rz.backprotokoll.length ? `
      <table class="log">
        <tr><th>Datum</th><th class="num">Soll</th><th class="num">Ist</th><th class="num">Abw.</th><th>Notiz</th></tr>
        ${rz.backprotokoll.map(e => `<tr>
          <td>${esc(e.datum)}</td><td class="num">${e.sollG} g</td><td class="num">${e.istG} g</td>
          <td class="num">${nf(Calc.schwundEintrag(e.sollG,e.istG)*-100,1)} %</td>
          <td>${esc(e.notizen||"")}</td></tr>`).join("")}
      </table>` : '<div class="hint">Noch kein Eintrag — Schwund unbekannt.</div>';

    const fehlendHinweis = (arr, was) => arr.length
      ? `<div class="hint">${arr.length} Zutat(en) ohne ${was} — Summe unvollständig: ${esc([...new Set(arr)].join(", "))}</div>` : "";

    // AP-0318/FR-1305: Preisalter je Rohstoff dieses Rezepts sichtbar machen — "unbekannt"
    // zaehlt wie "zu alt", nicht wie "aktuell" (§ Regel "ohne Beleg kein Wert", AP-0317).
    const heute = new Date();
    const preisalterListe = [...new Map(Calc.zutatenFlach(rz)
      .filter(z => z.rohstoff)
      .map(z => [z.rohstoff.id, z.rohstoff])).values()]
      .map(r => ({ name: r.name, tage: Calc.preisAlterTage(r.preisStand, heute) }))
      .filter(e => e.tage == null || e.tage > 365);
    const preisalterHinweis = preisalterListe.length
      ? `<div class="hint"><span class="warn-inline" style="margin-left:0">${preisalterListe.length} Rohstoff(e) mit Preis älter als 12 Monate oder ohne Datum:</span> `
        + esc(preisalterListe.map(e => e.name + " (" + (e.tage == null ? "unbekannt" : e.tage + " Tage") + ")").join(", ")) + "</div>"
      : "";
    const rechercheButton = Service.verfuegbar()
      ? `<div class="actions noprint" style="margin-top:.6rem"><button class="ghost" id="btnRecherche">Preise aktualisieren</button></div>` : "";

    // AP-0304: Zutaten ohne Rohstoff-Treffer. Das ist der Alias-Hinweis aus AP-0201 §1 (B5):
    // trifft der Name keinen Rohstoff, fehlt die Zutat in Kosten UND Naehrwerten, und die
    // Ursache ist fast immer eine Schreibvariante (O-10, 30 offene Alias-Faelle).
    const ohneRohstoff = [...new Set(Calc.zutatenFlach(rz).filter(z => !z.rohstoff).map(z => z.name))];

    // Ein Metadatenblock (AP-0201 §1, B5): standardmaessig zu, Zustand je Block gemerkt.
    // "kurz" steht rechts in der Zusammenfassung und ist bereits fertiges HTML.
    const metaBlock = (id, titel, kurz, inhalt) => `
      <details class="metablock" data-block="${id}"${Layout.metaOffen(id) ? " open" : ""}>
        <summary>${esc(titel)}<span class="metakurz">${kurz}</span></summary>
        <div class="metabody">${inhalt}</div>
      </details>`;

    // AP-0305: Eingabeformular fuer einen neuen Backprotokoll-Eintrag. Store.backEintrag
    // haelt den Formularzustand (App.backEintragOeffnen()); null = Formular geschlossen,
    // dann nur der Anstoss-Button.
    const be = Store.backEintrag;
    const backForm = be ? `
      <div class="noprint" style="border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem">
        <div class="scaler" style="padding-top:0;border-top:0;margin-top:0">
          <label>Datum<input id="beDatum" type="date" value="${esc(be.datum)}"></label>
          <label>Soll (g)<input id="beSoll" type="number" min="1" step="1" value="${esc(be.soll)}"></label>
          <label>Ist (g)<input id="beIst" type="number" min="1" step="1" value="${esc(be.ist)}"></label>
        </div>
        <label style="display:block;margin-top:.6rem;font-size:.85rem;color:var(--muted)">Notizen
          <input id="beNotizen" type="text" style="width:100%;margin-top:.25rem"
            value="${esc(be.notizen)}" placeholder="z. B. Kruste zu hell, Ofen 10 °C höher">
        </label>
        <div class="actions noprint" style="margin-top:.7rem">
          <button id="btnEintragSpeichern">Eintrag speichern</button>
          <button class="ghost" id="btnEintragAbbrechen">Abbrechen</button>
        </div>
      </div>` : `
      <div class="actions noprint" style="margin-top:.9rem">
        <button class="ghost" id="btnEintrag">Neuer Eintrag</button>
      </div>`;

    el("#rezeptbereich").innerHTML = `
      <section class="card">
        <div class="body rezeptkopf">
          <h2>${esc(rz.name)}</h2>
          <!-- AP-0304: Der Kopf traegt nur noch, was beim Kochen zaehlt (Wireframe W,
               AP-0201 §2.3). Unterkategorie, Quelle, Basis-Rohstoff und Rezept-ID stehen
               vollstaendig im Metadatenblock "Herkunft" darunter — nichts geht verloren. -->
          <div class="sub">${esc(rz.kategorie)} · ${rz.phasen.length} Phase${rz.phasen.length === 1 ? "" : "n"}
            · ${Math.round(rz.portionen*f)} ${esc(rz.einheit)}
            · ${Calc.runden(rz.sollgewichtG*f)}</div>
          <div class="scaler noprint">
            <label>Basis (g)<input id="zielBasis" type="number" min="1" step="10" value="${Math.round(rz.basisMengeG*f)}"></label>
            <label>Portionen<input id="zielPortionen" type="number" min="1" step="1" value="${Math.round(rz.portionen*f)}"></label>
            <button class="ghost" id="btnReset">Original</button>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Zubereitung</h2>
        ${bearbeitenButton}
        <div style="padding:0 1rem">${entwurfTile}</div>
        ${zubereitungInhalt}
      </section>

      <!-- AP-0304 (B5): Metadaten als Ausklapper-Stapel UNTER der Rezeptur, alle zu.
           Die frueheren Karten "Naehrwerte", "Kosten" und "Backprotokoll" sind inhaltlich
           unveraendert hierher gewandert; "Herkunft" und "Hinweise" kommen neu dazu. -->
      <div class="metastapel">
        ${metaBlock("naehrwerte", "Nährwerte",
          `${nf(n.proPortion.kcal,0)} kcal / ${esc(rz.einheit)}`, `
          <div class="kpis">
            <div class="kpi"><div class="k">kcal / Portion</div><div class="v">${nf(n.proPortion.kcal,0)}</div></div>
            <div class="kpi"><div class="k">Eiweiss</div><div class="v">${nf(n.proPortion.eiweiss,1)} g</div></div>
            <div class="kpi"><div class="k">Fett</div><div class="v">${nf(n.proPortion.fett,1)} g</div></div>
            <div class="kpi"><div class="k">Kohlenhydrate</div><div class="v">${nf(n.proPortion.kh,1)} g</div></div>
            <div class="kpi"><div class="k">kcal / 100 g</div><div class="v">${nf(n.pro100g.kcal,0)}</div></div>
          </div>
          ${fehlendHinweis(n.fehlend, "Nährwerte")}`)}

        ${metaBlock("kosten", "Kosten", chf(k.effektiv), `
          <div class="kpis">
            <div class="kpi"><div class="k">Rohstoffe</div><div class="v">${chf(k.roh)}</div></div>
            <div class="kpi"><div class="k">Schwund</div><div class="v">${schwund==null ? "0 %" : pct(schwund,1)}</div></div>
            <div class="kpi"><div class="k">Gesamt</div><div class="v">${chf(k.effektiv)}</div></div>
            <div class="kpi"><div class="k">pro ${esc(rz.einheit)}</div><div class="v">${chf(k.proPortion)}</div></div>
          </div>
          ${fehlendHinweis(k.fehlend, "Preis")}
          ${schwund==null ? '<div class="hint">Noch kein Protokolleintrag — Schwund als 0 % angenommen.</div>' : ""}
          <div class="hint">Gesamt = Rohstoffkosten ÷ (1 − Schwund)</div>
          ${preisalterHinweis}
          ${rechercheButton}`)}

        ${metaBlock("protokoll", "Verfahren & Protokoll",
          `${esc(rz.verfahren || "Verfahren offen")} · ${rz.backprotokoll.length} ${rz.backprotokoll.length === 1 ? "Eintrag" : "Einträge"}`, `
          <div class="hint" style="margin-top:0">Verfahren: <b>${esc(rz.verfahren || "—")}</b>${
            rz.verfahren ? "" : " — für dieses Rezept noch nicht zugeordnet (AP-0306)"}</div>
          ${log}
          ${backForm}`)}

        ${metaBlock("herkunft", "Herkunft", esc(rz.quelle || "—"), `
          <dl class="herkunft">
            <dt>Rezept-ID</dt><dd>${esc(rz.id || "—")}</dd>
            <dt>Kategorie</dt><dd>${esc(rz.kategorie || "—")}${rz.unterkategorie ? " · " + esc(rz.unterkategorie) : ""}</dd>
            <dt>Quelle</dt><dd>${esc(rz.quelle || "—")}</dd>
            <dt>Basis-Rohstoff</dt><dd>${Calc.runden(rz.basisMengeG*f)} ${esc(rz.basisName || "—")}</dd>
            <dt>Sollgewicht</dt><dd>${Calc.runden(rz.sollgewichtG*f)}</dd>
            <dt>Original</dt><dd>${Calc.runden(rz.basisMengeG)} ${esc(rz.basisName || "—")} · ${nf(rz.portionen,0)} ${esc(rz.einheit)}</dd>
          </dl>`)}

        ${metaBlock("hinweise", "Hinweise",
          fd.ampel ? `FODMAP ${esc(fd.ampel)}` : "FODMAP —", `
          <div class="hint" style="margin-top:0">FODMAP gesamt: <b>${fd.ampel ? esc(fd.ampel) : "—"}</b>${fd.unbewertet ? ` · ${fd.unbewertet} Zutat(en) unbewertet` : ""}</div>
          ${ohneRohstoff.length
            ? `<div class="hint"><span class="warn-inline" style="margin-left:0">${ohneRohstoff.length} Zutat(en) ohne Rohstoff-Zuordnung</span> — meist eine Schreibvariante, die als Alias fehlt (O-10). Sie fehlen in Kosten und Nährwerten: ${esc(ohneRohstoff.join(", "))}</div>`
            : '<div class="hint">Alle Zutaten sind einem Rohstoff zugeordnet.</div>'}`)}
      </div>

      <div class="actions noprint">
        <button class="ghost" id="btnExport">Exportieren</button>
        <button class="ghost" id="btnDruck">Drucken / PDF</button>
        <button class="ghost" id="btnZurueck">Zurück zur Liste</button>
      </div>`;

    // AP-0301: Entwicklung (B6) liegt strukturell in der rechten Schiene (AP-0201 §1),
    // nicht mehr im Fluss der Mittelspalte — Inhalt/Verhalten von View.entwKarte()
    // bleibt unverändert, nur das Zielelement wechselt.
    el("#panelEntwicklung").innerHTML = `<div class="entw-inhalt">${View.entwKarte(rz)}</div>`;
    View.einkaufsliste();
    View.notizsection();

    // Ereignisse der Rezeptansicht
    document.querySelectorAll("details.phase").forEach(d =>
      d.addEventListener("toggle", () => View.phaseToggle(d)));
    // AP-0304: offen/zu je Metadatenblock geraetelokal merken (AP-0201 §1, B5).
    document.querySelectorAll("details.metablock").forEach(d =>
      d.addEventListener("toggle", () => View.metablockToggle(d)));
    el("#zielBasis").addEventListener("input", e => {
      const v = Number(e.target.value); if(v > 0) App.skalieren(Calc.faktorAusBasis(v, rz)); });
    el("#zielPortionen").addEventListener("input", e => {
      const v = Number(e.target.value); if(v > 0) App.skalieren(Calc.faktorAusPortionen(v, rz)); });
    el("#btnReset").addEventListener("click", () => App.skalieren(1));
    // AP-0306: alle Phasen vor dem Druckdialog aufklappen (details.phase[open], nicht nur
    // die CSS-Regel unten) — moderne Browser rendern den Inhalt eines geschlossenen <details>
    // per content-visibility, das eine reine display:block-Regel auf .phasebody NICHT
    // uebersteuert. AP-0304 erweitert das auf die neuen Metadatenbloecke (View.DRUCK_AUFKLAPPEN)
    // und sperrt waehrenddessen die toggle-Zuhoerer: das Setzen von .open feuert toggle, und
    // ohne Sperre lief Store.offenePhasen bzw. Layout.meta voll — der afterprint-Rueckbau
    // (App.start()) haette dann ALLES offen wiederhergestellt statt den Zustand von vorher.
    el("#btnDruck").addEventListener("click", () => View.drucken());
    el("#btnZurueck").addEventListener("click", () => App.schliessen());
    el("#btnExport").addEventListener("click", () => App.exportEinzeln());
    el("#btnRecherche") && el("#btnRecherche").addEventListener("click", () => App.rechercheOeffnen());
    // AP-0305: Backprotokoll-Formular — je nach Zustand entweder Anstoss-Button oder Felder+Speichern.
    if(be){
      el("#beDatum").addEventListener("input", e => { be.datum = e.target.value; });
      el("#beSoll").addEventListener("input", e => { be.soll = e.target.value; });
      el("#beIst").addEventListener("input", e => { be.ist = e.target.value; });
      el("#beNotizen").addEventListener("input", e => { be.notizen = e.target.value; });
      el("#btnEintragAbbrechen").addEventListener("click", () => { Store.backEintrag = null; View.rezept(); });
      el("#btnEintragSpeichern").addEventListener("click", (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        App.backEintragSpeichern().finally(() => { if(btn) btn.disabled = false; });
      });
    }else{
      el("#btnEintrag").addEventListener("click", () => App.backEintragOeffnen());
    }
    // AP-0305: Zutaten-Editor — Bearbeiten-Anstoss, Entwurf-Kachel (§4.4) und, wenn offen,
    // Zeilen/Formular/Vorschau/Konfliktdialog (§4.1). Alle Elemente existieren nur, wenn der
    // jeweilige Zustand aktiv ist — Ereignisse darum durchweg mit "el(...) &&" abgesichert.
    el("#btnZutatenBearbeiten") && el("#btnZutatenBearbeiten").addEventListener("click", () => App.zutatenEditorOeffnen());
    el("#btnEntwurfOeffnen") && el("#btnEntwurfOeffnen").addEventListener("click", () => App.zutatenEditorEntwurfLaden());
    el("#btnEntwurfVerwerfen") && el("#btnEntwurfVerwerfen").addEventListener("click", () => App.zutatenEditorEntwurfVerwerfen());
    if(ed && ed.konflikt){
      el("#btnZutatenKonfliktMeine") && el("#btnZutatenKonfliktMeine").addEventListener("click", (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        App.zutatenEditorKonfliktMeineFassungSpeichern().finally(() => { if(btn) btn.disabled = false; });
      });
      el("#btnZutatenKonfliktFremde") && el("#btnZutatenKonfliktFremde").addEventListener("click", () => App.zutatenEditorKonfliktFremdeAnsehen());
      el("#btnZutatenKonfliktZurueck") && el("#btnZutatenKonfliktZurueck").addEventListener("click", () => App.zutatenEditorKonfliktZurueck());
      el("#btnZutatenKonfliktBehalten") && el("#btnZutatenKonfliktBehalten").addEventListener("click", () => App.zutatenEditorKonfliktBehalten());
    }else if(ed){
      document.querySelectorAll(".editorzeile").forEach(zeile => {
        const pi = Number(zeile.dataset.pi), zi = Number(zeile.dataset.zi);
        zeile.querySelectorAll("[data-feld]").forEach(inp =>
          inp.addEventListener("change", e => App.zutatenEditorZutatFeld(pi, zi, e.target.dataset.feld, e.target.value)));
        zeile.querySelector("[data-entfernen]").addEventListener("click", () => App.zutatenEditorZutatEntfernen(pi, zi));
      });
      document.querySelectorAll("[data-zutat-hinzu]").forEach(btn =>
        btn.addEventListener("click", () => App.zutatenEditorZutatHinzufuegen(Number(btn.dataset.zutatHinzu))));
      document.querySelectorAll(".editorschritt").forEach(zeile => {
        const pi = Number(zeile.dataset.pi), si = Number(zeile.dataset.si);
        zeile.querySelector("[data-schritt]").addEventListener("change", e => App.zutatenEditorSchrittFeld(pi, si, e.target.value));
        zeile.querySelector("[data-schritt-entfernen]").addEventListener("click", () => App.zutatenEditorSchrittEntfernen(pi, si));
      });
      document.querySelectorAll("[data-schritt-hinzu]").forEach(btn =>
        btn.addEventListener("click", () => App.zutatenEditorSchrittHinzufuegen(Number(btn.dataset.schrittHinzu))));
      document.querySelectorAll("[data-zusammenfassen]").forEach(btn =>
        btn.addEventListener("click", () => {
          const [pi, nameKey] = btn.dataset.zusammenfassen.split("|");
          App.zutatenEditorZusammenfassen(Number(pi), nameKey);
        }));
      el("#btnZutatenAbbrechen") && el("#btnZutatenAbbrechen").addEventListener("click", () => App.zutatenEditorAbbrechen());
      el("#btnZutatenSpeichern") && el("#btnZutatenSpeichern").addEventListener("click", () => App.zutatenEditorVorschauOeffnen());
      el("#btnZutatenVorschauZurueck") && el("#btnZutatenVorschauZurueck").addEventListener("click", () => App.zutatenEditorVorschauZurueck());
      el("#btnZutatenJetztSpeichern") && el("#btnZutatenJetztSpeichern").addEventListener("click", (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        App.zutatenEditorSpeichern().finally(() => { if(btn) btn.disabled = false; });
      });
    }
    View.entwEreignisse(rz);
  },

  /* ---------- Import-Dialog (AP-0315) ------------------------------------
     Ein Durchlauf, EIN Bildschirm: Eingabe -> (Fehler | Zuordnung + Konflikte + Vorschau).
     Store.import === null -> Dialog geschlossen, nichts rendern. */
  import(){
    const box = el("#importbereich");
    const st = Store.import;
    if(!st){ box.innerHTML = ""; return; }

    const kopf = `
      <section class="card" id="importKarte">
        <h2>Rezept importieren</h2>
        <div class="body">
          <div class="hint">Datei wählen (.json im Format <code>rezept/1</code>, oder .xlsx einer Bestandsdatei)
            oder Text einfügen. Freitext lässt sich mit «Freitext umwandeln» in ein Gerüst überführen —
            Baeckerprozente fehlen danach meist und müssen von Hand ergänzt werden, bevor die Prüfung
            durchläuft. Bei einer .xlsx-Bestandsdatei erkennt der Import automatisch, was sicher zuordenbar
            ist (AP-0316) — der Rest steht als Meldung da und muss vor «Prüfen» von Hand ergänzt werden.</div>
          <input type="file" id="importDatei" accept=".json,.xlsx,.xls,application/json" style="margin:.5rem 0">
          <textarea class="importtext" id="importText" placeholder='{"format":"rezept/1","rezepte":[…]} oder Freitext'>${esc(st.text)}</textarea>
          <div class="actions" style="margin-top:.6rem">
            <button id="importFreitext" class="ghost">Freitext umwandeln</button>
            <button id="importPruefen">Prüfen</button>
            <button id="importAbbrechen" class="ghost">Abbrechen</button>
          </div>
          ${Service.verfuegbar() ? `
          <div class="hint" style="margin-top:.8rem">KI-Import (AP-0318): erzeugt einen Vorschlag im selben
            Textfeld — läuft danach durch dieselbe Prüfung/Vorschau wie jeder andere Import, wird nie
            ungeprüft übernommen.</div>
          <div class="actions" style="margin-top:.4rem">
            <button id="importKiText" class="ghost">Aus Text erzeugen (KI)</button>
            <label class="ghost" style="display:inline-block;cursor:pointer" for="importKiBild">Aus Bild erzeugen (KI)</label>
            <input type="file" id="importKiBild" accept="image/*" style="display:none">
          </div>` : ""}
        </div>
      </section>`;

    if(!st.geprueft){ box.innerHTML = kopf; View.importEreignisse(); return; }

    if(st.fehler.length){
      box.innerHTML = kopf + `
        <section class="card">
          <h2>Prüfung fehlgeschlagen — nichts übernommen</h2>
          <div class="body">
            <ul class="importfehler">
              ${st.fehler.map(f => `<li><code>${esc(f.pfad)}</code> — ${esc(f.meldung)}</li>`).join("")}
            </ul>
          </div>
        </section>`;
      View.importEreignisse();
      return;
    }

    const unbekanntHtml = st.unbekannt.length ? `
      <section class="card">
        <h2>Unbekannte Zutaten (${st.unbekannt.length})</h2>
        <div class="body">
          ${st.unbekannt.map(name => `
            <div class="zuordnungzeile">
              <span class="nm">${esc(name)}</span>
              <select data-unbekannt="${esc(name)}">
                <option value="">unbekannt lassen</option>
                ${Store.rohstoffe.map(r => `<option value="${esc(r.id)}"${st.zuordnung[name]===r.id?" selected":""}>${esc(r.name)}</option>`).join("")}
              </select>
            </div>`).join("")}
          <div class="hint">Eine Zuordnung wird als Alias gemerkt (Blatt «Aliase» in Rohstoffe.xlsx)
            und wirkt beim nächsten Import automatisch — auch auf einem anderen Gerät.</div>
        </div>
      </section>` : "";

    const konfliktHtml = st.konflikte.length ? `
      <section class="card">
        <h2>Gleichnamige Rezepte (${st.konflikte.length})</h2>
        <div class="body">
          ${st.konflikte.map(k => `
            <div class="msg warn">
              <b>${esc(k.neu.name)}</b> existiert bereits als «${esc(k.bestehend.name)}» (${esc(k.bestehend.id)}).
              <div class="actions" style="margin-top:.4rem">
                <button data-konflikt="${k.index}" data-wahl="neu"
                  class="${st.entscheidung[k.index]==='neu' ? '' : 'ghost'}">Neues Rezept anlegen</button>
                <button data-konflikt="${k.index}" data-wahl="version"
                  class="${st.entscheidung[k.index]==='version' ? '' : 'ghost'}">Als Version anhängen</button>
              </div>
            </div>`).join("")}
        </div>
      </section>` : "";

    const vorschauHtml = `
      <section class="card">
        <h2>Vorschau (${st.rezepte.length} Rezept${st.rezepte.length===1?"":"e"})</h2>
        <div class="body">
          ${st.rezepte.map((rz, i) => {
            const modus = st.entscheidung[i] === "version" ? "wird als Version angehängt" : "wird neu angelegt";
            const zt = rz.phasen.map(ph => ph.zutaten.length
              ? `<table class="zutaten">${ph.zutaten.map(z => View.zutatenzeile(z, rz, 1)).join("")}</table>` : "").join("");
            return `<div class="importvorschau">
              <h3>${esc(rz.name || "(ohne Namen)")} <span class="hint" style="display:inline">— ${modus}</span></h3>
              <div class="sub" style="color:var(--muted);font-size:.85rem">${esc(rz.kategorie||"—")}
                · Basis ${rz.basisMengeG!=null ? Calc.runden(rz.basisMengeG) : "—"} ${esc(rz.basisName||"—")}</div>
              ${zt}
            </div>`;
          }).join("")}
          <div class="actions" style="margin-top:.8rem">
            <button id="importUebernehmen">Übernehmen</button>
            <button id="importAbbrechen2" class="ghost">Abbrechen</button>
          </div>
        </div>
      </section>`;

    box.innerHTML = kopf + unbekanntHtml + konfliktHtml + vorschauHtml;
    View.importEreignisse();
  },

  importEreignisse(){
    const st = Store.import;
    el("#importText") && el("#importText").addEventListener("input", e => { st.text = e.target.value; });
    el("#importDatei") && el("#importDatei").addEventListener("change", e => {
      const datei = e.target.files[0]; if(!datei) return;
      if(/\.xlsx?$/i.test(datei.name)){ App.importExcelAltdatei(datei); return; }
      const reader = new FileReader();
      reader.onload = () => { st.text = String(reader.result || ""); App.importAuswerten(); };
      reader.readAsText(datei);
    });
    el("#importFreitext") && el("#importFreitext").addEventListener("click", () => {
      st.text = JSON.stringify(Import.freitextZerlegen(st.text), null, 2);
      View.import();
    });
    el("#importPruefen") && el("#importPruefen").addEventListener("click", () => App.importPruefen());
    el("#importKiText") && el("#importKiText").addEventListener("click", (e) => {
      const textEl = el("#importText"); if(textEl) st.text = textEl.value;
      const btn = e.currentTarget; btn.disabled = true;
      App.importAusKiText(st.text).finally(() => { if(btn) btn.disabled = false; });
    });
    el("#importKiBild") && el("#importKiBild").addEventListener("change", (e) => {
      const datei = e.target.files[0]; if(!datei) return;
      const reader = new FileReader();
      reader.onload = () => App.importAusKiBild(String(reader.result || ""));
      reader.readAsDataURL(datei);
    });
    el("#importAbbrechen") && el("#importAbbrechen").addEventListener("click", () => App.importSchliessen());
    el("#importAbbrechen2") && el("#importAbbrechen2").addEventListener("click", () => App.importSchliessen());
    el("#importUebernehmen") && el("#importUebernehmen").addEventListener("click", () => App.importUebernehmen());
    document.querySelectorAll("[data-unbekannt]").forEach(sel =>
      sel.addEventListener("change", e => App.importZuordnen(e.target.dataset.unbekannt, e.target.value)));
    document.querySelectorAll("[data-konflikt]").forEach(btn =>
      btn.addEventListener("click", e => App.importEntscheiden(Number(e.target.dataset.konflikt), e.target.dataset.wahl)));
  },

  /* ---------- Recherche-Dialog (AP-0318, «Preise aktualisieren») ---------------------
     Store.recherche === null -> Dialog geschlossen, nichts rendern. Gleiche Regel wie im
     Import-Dialog: nichts wird ungefragt geschrieben, jede Zeile braucht ein Häkchen. */
  recherche(){
    const box = el("#rechercheBereich");
    const st = Store.recherche;
    if(!st){ box.innerHTML = ""; return; }

    if(st.laedt){
      box.innerHTML = `<section class="card" id="rechercheKarte"><h2>Preise aktualisieren</h2>
        <div class="body"><div class="hint">Anfrage läuft für ${st.namen.length} Rohstoff(e) …</div></div></section>`;
      return;
    }
    if(st.fehler){
      box.innerHTML = `<section class="card" id="rechercheKarte"><h2>Preise aktualisieren</h2>
        <div class="body">
          <div class="msg err">Anfrage fehlgeschlagen: ${esc(st.fehler)}</div>
          <div class="actions" style="margin-top:.6rem"><button class="ghost" id="rechercheAbbrechen">Schliessen</button></div>
        </div></section>`;
      View.rechercheEreignisse();
      return;
    }

    const zeilen = st.vorschlaege.map(v => {
      if(v.gefunden === false)
        return `<div class="msg warn"><b>${esc(v.name)}</b> — nicht gefunden, alter Wert bleibt stehen.</div>`;
      const rohstoff = Store.rohstoffe.find(r => Model.normKey(r.name) === Model.normKey(v.name));
      const altPreis = rohstoff && rohstoff.kostenProKg != null ? chf(rohstoff.kostenProKg) + "/kg" : "—";
      const neuPreis = v.kostenProKg != null ? chf(v.kostenProKg) + "/kg" : "—";
      return `<div class="zuordnungzeile">
        <label style="display:flex;gap:.5rem;align-items:flex-start;cursor:pointer">
          <input type="checkbox" data-recherche="${esc(v.name)}"${st.entscheidung[v.name] ? " checked" : ""}>
          <span><b>${esc(v.name)}</b><br>
            ${esc(altPreis)} → ${esc(neuPreis)}<br>
            <span class="hint" style="display:inline">Quelle: ${esc(v.quelle||"—")} · Stand: ${esc(v.stand||"—")}</span>
          </span>
        </label>
      </div>`;
    }).join("");

    box.innerHTML = `<section class="card" id="rechercheKarte">
      <h2>Preise aktualisieren</h2>
      <div class="body">
        <div class="hint">Vorschlag je Rohstoff mit Quelle und Stand — nur angehakte Zeilen werden geschrieben.</div>
        ${zeilen || '<div class="hint">Keine Vorschläge erhalten.</div>'}
        <div class="actions" style="margin-top:.8rem">
          <button id="rechercheUebernehmen">Übernehmen</button>
          <button class="ghost" id="rechercheAbbrechen">Abbrechen</button>
        </div>
      </div>
    </section>`;
    View.rechercheEreignisse();
  },
