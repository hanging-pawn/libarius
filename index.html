/* ---------- View -------------------------------------------------------- */
const el = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const nf = (v,d=1) => v==null ? "—" : Number(v).toFixed(d);
const chf = (v) => v==null ? "—" : "CHF " + Number(v).toFixed(2);
const pct = (v,d=1) => v==null ? "—" : (v*100).toFixed(d) + " %";

const View = {
  meldung(text, art, titel){
    const box = el("#meldungen");
    const d = document.createElement("div");
    d.className = "msg " + (art||"");
    d.innerHTML = (titel ? "<b>"+esc(titel)+"</b>" : "") + esc(text);
    box.appendChild(d);
  },

  kategorienFuellen(){
    const sel = el("#kategorie");
    sel.innerHTML = '<option value="">Alle Kategorien</option>';
    const kats = [...new Set(Store.rezepte.map(r => r.kategorie).filter(Boolean))].sort();
    kats.forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = k; sel.appendChild(o); });
  },

  gefilterte(){
    const q = Store.suchtext.trim().toLowerCase();
    return Store.rezepte.filter(r =>
      (!Store.kategorie || r.kategorie === Store.kategorie) &&
      (!q || (r.name + " " + r.kategorie + " " + (r.unterkategorie||"")).toLowerCase().includes(q))
    );
  },

  liste(){
    const ul = el("#liste"); const rs = View.gefilterte();
    const fehlerhaft = Store.rezepteFehlerhaft || [];
    if(!rs.length && !fehlerhaft.length){ ul.innerHTML = '<li class="empty">Kein Rezept gefunden</li>'; return; }
    const zeilen = rs.map(r => `
      <li><button data-id="${esc(r.id)}">
        <span class="nm">${esc(r.name)}</span>
        <span class="meta">${esc(r.kategorie)} · ${r.portionen} ${esc(r.einheit)}</span>
      </button></li>`).join("");
    // FR-abgeleitet (Feinkonzept §7): ungültiges JSON blockiert nicht die Liste,
    // die betroffene Zeile wird sichtbar als fehlerhaft markiert statt geöffnet.
    const fehlerZeilen = fehlerhaft.map(f => `
      <li class="fehlerzeile">
        <span class="nm">${esc(f.name)}</span>
        <span class="warn-inline">fehlerhaft (Zeile ${f.zeile}) — ${esc(f.fehler)}</span>
      </li>`).join("");
    ul.innerHTML = zeilen + fehlerZeilen;
    ul.querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => App.rezeptOeffnen(b.dataset.id)));
  },

  zutatenzeile(z, rz, faktor){
    const g = Calc.mengeG(z, rz.basisMengeG, faktor);
    const stk = Calc.alsStueck(g, z.rohstoff);
    const menge = stk
      ? `${Calc.rundenStueck(stk.stueck)} Stk <span style="color:var(--muted);font-weight:400">(${Calc.runden(g, z.einheit)})</span>`
      : Calc.runden(g, z.einheit);
    const unbekannt = z.rohstoff ? "" : '<span class="warn-inline">unbekannter Rohstoff</span>';
    return `<tr><td>${esc(z.name)}${unbekannt}</td>
      <td class="pct">${(z.prozent*100).toFixed(1)} %</td>
      <td class="menge">${menge}</td></tr>`;
  },

  /* ---------- Entwicklungsmodus (AP-0311/§3) -------------------------------
     rz.entwicklung == null -> nur der Anstoss-Button (Abnahmekriterium 3: unveraendertes
     Verhalten ohne das Feld). Store.devForm haelt das jeweils eine offene Formular
     (Versions-Bearbeitung/-Neuanlage, Diff, Befoerdern-Bestaetigung, Versuchseintrag) —
     gleiches Prinzip wie Store.backEintrag. */
  entwKarte(rz){
    const e = rz.entwicklung;
    if(!e){
      return `<section class="card">
        <h2>Entwicklung</h2>
        <div class="body">
          <div class="hint">Kein Entwicklungsverlauf — dieses Rezept läuft als produktive Rezeptur.</div>
          <div class="actions noprint" style="margin-top:.6rem">
            <button class="ghost" id="btnEntwStarten">Entwicklungsmodus starten</button>
          </div>
        </div>
      </section>`;
    }

    const df = Store.devForm;
    const sortiert = (e.versionen || []).slice().sort((a,b) => a.v - b.v);
    const aktiv = Calc.entwAktiveVersion(e);

    const versionenHtml = sortiert.map(v => `
      <div class="zuordnungzeile">
        <span class="nm">v${v.v}${aktiv && v.v === aktiv.v ? " ●" : ""} · ${esc(v.datum)}</span>
        <span class="hint" style="display:inline;flex:1;margin:0">${esc(v.notiz || "")}</span>
        <div class="actions noprint" style="flex:none">
          ${!(aktiv && v.v === aktiv.v) ? `<button class="ghost" data-entw-aktiv="${v.v}">Aktiv setzen</button>` : ""}
          <button class="ghost" data-entw-bearbeiten="${v.v}">Bearbeiten</button>
        </div>
      </div>`).join("") || '<div class="hint">Noch keine Version.</div>';

    let versionForm = "";
    if(df && df.art === "version"){
      versionForm = `
        <div class="noprint" style="border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem">
          <div class="hint">${df.modus === "neu"
            ? "Neue Version v" + df.v + " — Kopie der aktiven Version, danach frei editierbar."
            : "v" + df.v + " bearbeiten."}</div>
          <label style="display:block;margin-top:.5rem;font-size:.85rem;color:var(--muted)">Notiz
            <input id="devNotiz" type="text" style="width:100%;margin-top:.25rem" value="${esc(df.notiz)}"
              placeholder="Was hat sich geändert?"></label>
          <label style="display:block;margin-top:.6rem;font-size:.85rem;color:var(--muted)">Phasen (JSON) dieser Version
            <textarea id="devPhasenText" class="importtext" style="margin-top:.25rem">${esc(df.phasenText)}</textarea></label>
          <div class="actions noprint" style="margin-top:.7rem">
            <button id="btnEntwVersionSpeichern">Version speichern</button>
            <button class="ghost" id="btnEntwFormAbbrechen">Abbrechen</button>
          </div>
        </div>`;
    }

    let diffForm = "";
    if(df && df.art === "diff"){
      const vA = e.versionen.find(v => v.v === df.a), vB = e.versionen.find(v => v.v === df.b);
      const diff = Calc.entwDiff(vA, vB);
      const opt = (sel) => sortiert.map(v => `<option value="${v.v}"${v.v===sel?" selected":""}>v${v.v} (${esc(v.datum)})</option>`).join("");
      diffForm = `
        <div class="noprint" style="border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem">
          <div class="scaler" style="padding-top:0;border-top:0;margin-top:0">
            <label>Version A<select id="diffA">${opt(df.a)}</select></label>
            <label>Version B<select id="diffB">${opt(df.b)}</select></label>
          </div>
          <table class="log" style="margin-top:.7rem">
            <tr><th>Zutat</th><th class="num">v${df.a}</th><th class="num">v${df.b}</th><th class="num">Δ</th></tr>
            ${diff.zutaten.map(z => `<tr${z.delta != null && Math.abs(z.delta) > 0.0001 ? ' style="font-weight:600"' : ""}>
              <td>${esc(z.name)}</td><td class="num">${z.aPct==null?"—":pct(z.aPct,1)}</td>
              <td class="num">${z.bPct==null?"—":pct(z.bPct,1)}</td>
              <td class="num">${z.delta==null?"—":(z.delta>=0?"+":"")+pct(z.delta,1)}</td></tr>`).join("")}
          </table>
          <div class="hint">Schritte geändert: ${diff.schritte.filter(s=>s.geaendert).length
            ? esc(diff.schritte.filter(s=>s.geaendert).map(s=>s.phase).join(", "))
            : "keine"}</div>
          <div class="actions noprint" style="margin-top:.7rem">
            <button class="ghost" id="btnEntwFormAbbrechen">Schliessen</button>
          </div>
        </div>`;
    }

    let befoerdernForm = "";
    if(df && df.art === "befoerdern"){
      befoerdernForm = `
        <div class="noprint" style="border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem">
          <div class="msg warn"><b>v${df.v} wird produktive Rezeptur.</b> Bisherige Rezeptur bleibt als Version erhalten.</div>
          <div class="actions noprint" style="margin-top:.6rem">
            <button id="btnEntwBefoerdernBestaetigt">Bestätigen</button>
            <button class="ghost" id="btnEntwFormAbbrechen">Abbrechen</button>
          </div>
        </div>`;
    }

    const versuche = (e.versuche || []).slice().sort((a,b) => (a.datum||"").localeCompare(b.datum||""));
    const versucheHtml = versuche.length ? `
      <table class="log">
        <tr><th>Datum</th><th>Version</th><th class="num">Soll</th><th class="num">Ist</th><th>Bewertung</th><th>Erkenntnis</th></tr>
        ${versuche.map(v => `<tr>
          <td>${esc(v.datum)}</td><td>v${v.version}</td>
          <td class="num">${v.soll_g} g</td><td class="num">${v.ist_g} g</td>
          <td>${"★".repeat(v.bewertung)}${"☆".repeat(5-v.bewertung)}</td>
          <td>${esc(v.erkenntnis||"")}</td></tr>`).join("")}
      </table>` : '<div class="hint">Noch kein Versuch erfasst.</div>';

    let versuchForm = "";
    if(df && df.art === "versuch"){
      versuchForm = `
        <div class="noprint" style="border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem">
          <div class="scaler" style="padding-top:0;border-top:0;margin-top:0">
            <label>Datum<input id="devDatum" type="date" value="${esc(df.datum)}"></label>
            <label>Version<select id="devVersion">${sortiert.map(v=>`<option value="${v.v}"${v.v===df.version?" selected":""}>v${v.v}</option>`).join("")}</select></label>
            <label>Soll (g)<input id="devSoll" type="number" min="1" step="1" value="${esc(df.soll)}"></label>
            <label>Ist (g)<input id="devIst" type="number" min="1" step="1" value="${esc(df.ist)}"></label>
            <label>Bewertung<select id="devBewertung">${[1,2,3,4,5].map(n=>`<option value="${n}"${n===df.bewertung?" selected":""}>${n} — ${"★".repeat(n)}${"☆".repeat(5-n)}</option>`).join("")}</select></label>
          </div>
          <label style="display:block;margin-top:.6rem;font-size:.85rem;color:var(--muted)">Erkenntnis
            <input id="devErkenntnis" type="text" style="width:100%;margin-top:.25rem" value="${esc(df.erkenntnis)}"
              placeholder="z. B. Krume offener, Kruste zu blass"></label>
          <div class="actions noprint" style="margin-top:.7rem">
            <button id="btnEntwVersuchSpeichern">Versuch speichern</button>
            <button class="ghost" id="btnEntwFormAbbrechen">Abbrechen</button>
          </div>
        </div>`;
    }

    return `<section class="card">
      <h2>Entwicklung</h2>
      <div class="body">
        <div class="hint">Status: <b>${e.status === "produktiv" ? "produktiv, Verlauf erhalten" : "in Entwicklung"}</b></div>
        ${versionenHtml}
        <div class="actions noprint" style="margin-top:.7rem">
          <button class="ghost" id="btnEntwVersionNeu">+ Neue Version</button>
          ${sortiert.length >= 2 ? `<button class="ghost" id="btnEntwDiff">Vergleichen</button>` : ""}
          ${aktiv ? `<button class="ghost" id="btnEntwBefoerdern">Version befördern</button>` : ""}
        </div>
        ${versionForm}${diffForm}${befoerdernForm}
        <h3 style="margin:1.1rem 0 .4rem;font-size:.95rem">Versuche</h3>
        ${versucheHtml}
        <div class="actions noprint" style="margin-top:.7rem">
          <button class="ghost" id="btnEntwVersuchNeu">+ Neuer Versuch</button>
        </div>
        ${versuchForm}
      </div>
    </section>`;
  },

  entwEreignisse(rz){
    el("#btnEntwStarten") && el("#btnEntwStarten").addEventListener("click", () => App.entwStarten());
    if(!rz.entwicklung) return;
    document.querySelectorAll("[data-entw-aktiv]").forEach(b =>
      b.addEventListener("click", () => App.entwAktivSetzen(Number(b.dataset.entwAktiv))));
    document.querySelectorAll("[data-entw-bearbeiten]").forEach(b =>
      b.addEventListener("click", () => App.entwVersionBearbeitenOeffnen(Number(b.dataset.entwBearbeiten))));
    el("#btnEntwVersionNeu") && el("#btnEntwVersionNeu").addEventListener("click", () => App.entwVersionNeuOeffnen());
    el("#btnEntwDiff") && el("#btnEntwDiff").addEventListener("click", () => App.entwDiffOeffnen());
    el("#btnEntwBefoerdern") && el("#btnEntwBefoerdern").addEventListener("click", () => App.entwBefoerdernOeffnen());
    el("#btnEntwVersuchNeu") && el("#btnEntwVersuchNeu").addEventListener("click", () => App.entwVersuchOeffnen());
    el("#btnEntwFormAbbrechen") && el("#btnEntwFormAbbrechen").addEventListener("click", () => App.entwFormAbbrechen());

    const df = Store.devForm;
    if(df && df.art === "version"){
      el("#devNotiz").addEventListener("input", e => { df.notiz = e.target.value; });
      el("#devPhasenText").addEventListener("input", e => { df.phasenText = e.target.value; });
      el("#btnEntwVersionSpeichern").addEventListener("click", (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        App.entwVersionSpeichern().finally(() => { if(btn) btn.disabled = false; });
      });
    }
    if(df && df.art === "diff"){
      el("#diffA").addEventListener("change", e => App.entwDiffAendern("a", e.target.value));
      el("#diffB").addEventListener("change", e => App.entwDiffAendern("b", e.target.value));
    }
    if(df && df.art === "befoerdern"){
      el("#btnEntwBefoerdernBestaetigt").addEventListener("click", (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        App.entwBefoerdernBestaetigt().finally(() => { if(btn) btn.disabled = false; });
      });
    }
    if(df && df.art === "versuch"){
      el("#devDatum").addEventListener("input", e => { df.datum = e.target.value; });
      el("#devVersion").addEventListener("change", e => { df.version = Number(e.target.value); });
      el("#devSoll").addEventListener("input", e => { df.soll = e.target.value; });
      el("#devIst").addEventListener("input", e => { df.ist = e.target.value; });
      el("#devBewertung").addEventListener("change", e => { df.bewertung = Number(e.target.value); });
      el("#devErkenntnis").addEventListener("input", e => { df.erkenntnis = e.target.value; });
      el("#btnEntwVersuchSpeichern").addEventListener("click", (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        App.entwVersuchSpeichern().finally(() => { if(btn) btn.disabled = false; });
      });
    }
  },

  rezept(){
    const rz = Store.aktuellesRezept, f = Store.faktor;
    if(!rz){ el("#rezeptbereich").innerHTML = ""; return; }

    const schwund = Calc.schwundAktuell(rz.backprotokoll);
    const k = Calc.kosten(rz, f, schwund);
    const n = Calc.naehrwerte(rz, f);
    const fd = Calc.fodmapGesamt(Calc.zutatenFlach(rz));

    const phasen = rz.phasen.map((p, i) => {
      const offen = Store.offenePhasen.has(i) ? " open" : "";
      const zt = p.zutaten.length
        ? `<table class="zutaten">${p.zutaten.map(z => View.zutatenzeile(z, rz, f)).join("")}</table>` : "";
      const sc = p.schritte.length
        ? `<ol class="schritte">${p.schritte.map(s => `<li>${esc(s.text)}</li>`).join("")}</ol>` : "";
      return `<details class="phase" data-i="${i}"${offen}>
                <summary>${esc(p.name)}</summary>
                <div class="phasebody">${zt}${sc}</div>
              </details>`;
    }).join("");

    const log = rz.backprotokoll.length ? `
      <table class="log">
        <tr><th>Datum</th><th class="num">Soll</th><th class="num">Ist</th><th class="num">Abw.</th><th>Notiz</th></tr>
        ${rz.backprotokoll.map(e => `<tr>
          <td>${esc(e.datum)}</td><td class="num">${e.sollG} g</td><td class="num">${e.istG} g</td>
          <td class="num">${nf(Calc.schwundEintrag(e.sollG,e.istG)*-100,1)} %</td>
          <td>${esc(e.notizen||"")}</td></tr>`).join("")}
      </table>` : '<div class="hint">Noch kein Eintrag — Schwund unbekannt.</div>';

    const fehlendHinweis = (arr, was) => arr.length
      ? `<div class="hint">${arr.length} Zutat(en) ohne ${was} — Summe unvollständig: ${esc([...new Set(arr)].join(", "))}</div>` : "";

    // AP-0318/FR-1305: Preisalter je Rohstoff dieses Rezepts sichtbar machen — "unbekannt"
    // zaehlt wie "zu alt", nicht wie "aktuell" (§ Regel "ohne Beleg kein Wert", AP-0317).
    const heute = new Date();
    const preisalterListe = [...new Map(Calc.zutatenFlach(rz)
      .filter(z => z.rohstoff)
      .map(z => [z.rohstoff.id, z.rohstoff])).values()]
      .map(r => ({ name: r.name, tage: Calc.preisAlterTage(r.preisStand, heute) }))
      .filter(e => e.tage == null || e.tage > 365);
    const preisalterHinweis = preisalterListe.length
      ? `<div class="hint"><span class="warn-inline" style="margin-left:0">${preisalterListe.length} Rohstoff(e) mit Preis älter als 12 Monate oder ohne Datum:</span> `
        + esc(preisalterListe.map(e => e.name + " (" + (e.tage == null ? "unbekannt" : e.tage + " Tage") + ")").join(", ")) + "</div>"
      : "";
    const rechercheButton = Service.verfuegbar()
      ? `<div class="actions noprint" style="margin-top:.6rem"><button class="ghost" id="btnRecherche">Preise aktualisieren</button></div>` : "";

    // AP-0305: Eingabeformular fuer einen neuen Backprotokoll-Eintrag. Store.backEintrag
    // haelt den Formularzustand (App.backEintragOeffnen()); null = Formular geschlossen,
    // dann nur der Anstoss-Button.
    const be = Store.backEintrag;
    const backForm = be ? `
      <div class="noprint" style="border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem">
        <div class="scaler" style="padding-top:0;border-top:0;margin-top:0">
          <label>Datum<input id="beDatum" type="date" value="${esc(be.datum)}"></label>
          <label>Soll (g)<input id="beSoll" type="number" min="1" step="1" value="${esc(be.soll)}"></label>
          <label>Ist (g)<input id="beIst" type="number" min="1" step="1" value="${esc(be.ist)}"></label>
        </div>
        <label style="display:block;margin-top:.6rem;font-size:.85rem;color:var(--muted)">Notizen
          <input id="beNotizen" type="text" style="width:100%;margin-top:.25rem"
            value="${esc(be.notizen)}" placeholder="z. B. Kruste zu hell, Ofen 10 °C höher">
        </label>
        <div class="actions noprint" style="margin-top:.7rem">
          <button id="btnEintragSpeichern">Eintrag speichern</button>
          <button class="ghost" id="btnEintragAbbrechen">Abbrechen</button>
        </div>
      </div>` : `
      <div class="actions noprint" style="margin-top:.9rem">
        <button class="ghost" id="btnEintrag">Neuer Eintrag</button>
      </div>`;

    el("#rezeptbereich").innerHTML = `
      <section class="card">
        <div class="body rezeptkopf">
          <h2>${esc(rz.name)}</h2>
          <div class="sub">${esc(rz.kategorie)}${rz.unterkategorie ? " · " + esc(rz.unterkategorie) : ""}
            · Quelle: ${esc(rz.quelle||"—")}<br>
            ${Math.round(rz.portionen*f)} ${esc(rz.einheit)} · Basis:
            ${Calc.runden(rz.basisMengeG*f)} ${esc(rz.basisName)}
            · Sollgewicht ${Calc.runden(rz.sollgewichtG*f)}</div>
          <div class="scaler noprint">
            <label>Basis (g)<input id="zielBasis" type="number" min="1" step="10" value="${Math.round(rz.basisMengeG*f)}"></label>
            <label>Portionen<input id="zielPortionen" type="number" min="1" step="1" value="${Math.round(rz.portionen*f)}"></label>
            <button class="ghost" id="btnReset">Original</button>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Zubereitung</h2>
        ${phasen}
      </section>

      <section class="card">
        <h2>Nährwerte</h2>
        <div class="body">
          <div class="kpis">
            <div class="kpi"><div class="k">kcal / Portion</div><div class="v">${nf(n.proPortion.kcal,0)}</div></div>
            <div class="kpi"><div class="k">Eiweiss</div><div class="v">${nf(n.proPortion.eiweiss,1)} g</div></div>
            <div class="kpi"><div class="k">Fett</div><div class="v">${nf(n.proPortion.fett,1)} g</div></div>
            <div class="kpi"><div class="k">Kohlenhydrate</div><div class="v">${nf(n.proPortion.kh,1)} g</div></div>
            <div class="kpi"><div class="k">kcal / 100 g</div><div class="v">${nf(n.pro100g.kcal,0)}</div></div>
          </div>
          ${fehlendHinweis(n.fehlend, "Nährwerte")}
          <div class="hint">FODMAP gesamt: <b>${fd.ampel ? esc(fd.ampel) : "—"}</b>${fd.unbewertet ? ` · ${fd.unbewertet} Zutat(en) unbewertet` : ""}</div>
        </div>
      </section>

      <section class="card">
        <h2>Kosten</h2>
        <div class="body">
          <div class="kpis">
            <div class="kpi"><div class="k">Rohstoffe</div><div class="v">${chf(k.roh)}</div></div>
            <div class="kpi"><div class="k">Schwund</div><div class="v">${schwund==null ? "0 %" : pct(schwund,1)}</div></div>
            <div class="kpi"><div class="k">Gesamt</div><div class="v">${chf(k.effektiv)}</div></div>
            <div class="kpi"><div class="k">pro ${esc(rz.einheit)}</div><div class="v">${chf(k.proPortion)}</div></div>
          </div>
          ${fehlendHinweis(k.fehlend, "Preis")}
          ${schwund==null ? '<div class="hint">Noch kein Backprotokoll — Schwund als 0 % angenommen.</div>' : ""}
          <div class="hint">Gesamt = Rohstoffkosten ÷ (1 − Schwund)</div>
          ${preisalterHinweis}
          ${rechercheButton}
        </div>
      </section>

      <section class="card">
        <h2>Backprotokoll</h2>
        <div class="body">
          ${log}
          ${backForm}
        </div>
      </section>

      ${View.entwKarte(rz)}

      <div class="actions noprint">
        <button class="ghost" id="btnExport">Exportieren</button>
        <button class="ghost" id="btnDruck">Drucken / PDF</button>
        <button class="ghost" id="btnZurueck">Zurück zur Liste</button>
      </div>`;

    // Ereignisse der Rezeptansicht
    document.querySelectorAll("details.phase").forEach(d =>
      d.addEventListener("toggle", () => {
        const i = Number(d.dataset.i);
        d.open ? Store.offenePhasen.add(i) : Store.offenePhasen.delete(i);
      }));
    el("#zielBasis").addEventListener("input", e => {
      const v = Number(e.target.value); if(v > 0) App.skalieren(Calc.faktorAusBasis(v, rz)); });
    el("#zielPortionen").addEventListener("input", e => {
      const v = Number(e.target.value); if(v > 0) App.skalieren(Calc.faktorAusPortionen(v, rz)); });
    el("#btnReset").addEventListener("click", () => App.skalieren(1));
    // AP-0306: alle Phasen vor dem Druckdialog aufklappen (details.phase[open], nicht nur
    // die CSS-Regel unten) — moderne Browser rendern den Inhalt eines geschlossenen <details>
    // per content-visibility, das eine reine display:block-Regel auf .phasebody NICHT
    // uebersteuert. Store.offenePhasen bleibt dabei unveraendert; afterprint (App.start())
    // baut die Ansicht daraus neu auf und stellt den Bildschirm-Zustand wieder her.
    el("#btnDruck").addEventListener("click", () => {
      document.querySelectorAll("details.phase").forEach(d => { d.open = true; });
      window.print();
    });
    el("#btnZurueck").addEventListener("click", () => App.schliessen());
    el("#btnExport").addEventListener("click", () => App.exportEinzeln());
    el("#btnRecherche") && el("#btnRecherche").addEventListener("click", () => App.rechercheOeffnen());
    // AP-0305: Backprotokoll-Formular — je nach Zustand entweder Anstoss-Button oder Felder+Speichern.
    if(be){
      el("#beDatum").addEventListener("input", e => { be.datum = e.target.value; });
      el("#beSoll").addEventListener("input", e => { be.soll = e.target.value; });
      el("#beIst").addEventListener("input", e => { be.ist = e.target.value; });
      el("#beNotizen").addEventListener("input", e => { be.notizen = e.target.value; });
      el("#btnEintragAbbrechen").addEventListener("click", () => { Store.backEintrag = null; View.rezept(); });
      el("#btnEintragSpeichern").addEventListener("click", (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        App.backEintragSpeichern().finally(() => { if(btn) btn.disabled = false; });
      });
    }else{
      el("#btnEintrag").addEventListener("click", () => App.backEintragOeffnen());
    }
    View.entwEreignisse(rz);
  },

  /* ---------- Import-Dialog (AP-0315) ------------------------------------
     Ein Durchlauf, EIN Bildschirm: Eingabe -> (Fehler | Zuordnung + Konflikte + Vorschau).
     Store.import === null -> Dialog geschlossen, nichts rendern. */
  import(){
    const box = el("#importbereich");
    const st = Store.import;
    if(!st){ box.innerHTML = ""; return; }

    const kopf = `
      <section class="card" id="importKarte">
        <h2>Rezept importieren</h2>
        <div class="body">
          <div class="hint">Datei wählen (.json im Format <code>rezept/1</code>, oder .xlsx einer Bestandsdatei)
            oder Text einfügen. Freitext lässt sich mit «Freitext umwandeln» in ein Gerüst überführen —
            Baeckerprozente fehlen danach meist und müssen von Hand ergänzt werden, bevor die Prüfung
            durchläuft. Bei einer .xlsx-Bestandsdatei erkennt der Import automatisch, was sicher zuordenbar
            ist (AP-0316) — der Rest steht als Meldung da und muss vor «Prüfen» von Hand ergänzt werden.</div>
          <input type="file" id="importDatei" accept=".json,.xlsx,.xls,application/json" style="margin:.5rem 0">
          <textarea class="importtext" id="importText" placeholder='{"format":"rezept/1","rezepte":[…]} oder Freitext'>${esc(st.text)}</textarea>
          <div class="actions" style="margin-top:.6rem">
            <button id="importFreitext" class="ghost">Freitext umwandeln</button>
            <button id="importPruefen">Prüfen</button>
            <button id="importAbbrechen" class="ghost">Abbrechen</button>
          </div>
          ${Service.verfuegbar() ? `
          <div class="hint" style="margin-top:.8rem">KI-Import (AP-0318): erzeugt einen Vorschlag im selben
            Textfeld — läuft danach durch dieselbe Prüfung/Vorschau wie jeder andere Import, wird nie
            ungeprüft übernommen.</div>
          <div class="actions" style="margin-top:.4rem">
            <button id="importKiText" class="ghost">Aus Text erzeugen (KI)</button>
            <label class="ghost" style="display:inline-block;cursor:pointer" for="importKiBild">Aus Bild erzeugen (KI)</label>
            <input type="file" id="importKiBild" accept="image/*" style="display:none">
          </div>` : ""}
        </div>
      </section>`;

    if(!st.geprueft){ box.innerHTML = kopf; View.importEreignisse(); return; }

    if(st.fehler.length){
      box.innerHTML = kopf + `
        <section class="card">
          <h2>Prüfung fehlgeschlagen — nichts übernommen</h2>
          <div class="body">
            <ul class="importfehler">
              ${st.fehler.map(f => `<li><code>${esc(f.pfad)}</code> — ${esc(f.meldung)}</li>`).join("")}
            </ul>
          </div>
        </section>`;
      View.importEreignisse();
      return;
    }

    const unbekanntHtml = st.unbekannt.length ? `
      <section class="card">
        <h2>Unbekannte Zutaten (${st.unbekannt.length})</h2>
        <div class="body">
          ${st.unbekannt.map(name => `
            <div class="zuordnungzeile">
              <span class="nm">${esc(name)}</span>
              <select data-unbekannt="${esc(name)}">
                <option value="">unbekannt lassen</option>
                ${Store.rohstoffe.map(r => `<option value="${esc(r.id)}"${st.zuordnung[name]===r.id?" selected":""}>${esc(r.name)}</option>`).join("")}
              </select>
            </div>`).join("")}
          <div class="hint">Eine Zuordnung wird als Alias gemerkt (Blatt «Aliase» in Rohstoffe.xlsx)
            und wirkt beim nächsten Import automatisch — auch auf einem anderen Gerät.</div>
        </div>
      </section>` : "";

    const konfliktHtml = st.konflikte.length ? `
      <section class="card">
        <h2>Gleichnamige Rezepte (${st.konflikte.length})</h2>
        <div class="body">
          ${st.konflikte.map(k => `
            <div class="msg warn">
              <b>${esc(k.neu.name)}</b> existiert bereits als «${esc(k.bestehend.name)}» (${esc(k.bestehend.id)}).
              <div class="actions" style="margin-top:.4rem">
                <button data-konflikt="${k.index}" data-wahl="neu"
                  class="${st.entscheidung[k.index]==='neu' ? '' : 'ghost'}">Neues Rezept anlegen</button>
                <button data-konflikt="${k.index}" data-wahl="version"
                  class="${st.entscheidung[k.index]==='version' ? '' : 'ghost'}">Als Version anhängen</button>
              </div>
            </div>`).join("")}
        </div>
      </section>` : "";

    const vorschauHtml = `
      <section class="card">
        <h2>Vorschau (${st.rezepte.length} Rezept${st.rezepte.length===1?"":"e"})</h2>
        <div class="body">
          ${st.rezepte.map((rz, i) => {
            const modus = st.entscheidung[i] === "version" ? "wird als Version angehängt" : "wird neu angelegt";
            const zt = rz.phasen.map(ph => ph.zutaten.length
              ? `<table class="zutaten">${ph.zutaten.map(z => View.zutatenzeile(z, rz, 1)).join("")}</table>` : "").join("");
            return `<div class="importvorschau">
              <h3>${esc(rz.name || "(ohne Namen)")} <span class="hint" style="display:inline">— ${modus}</span></h3>
              <div class="sub" style="color:var(--muted);font-size:.85rem">${esc(rz.kategorie||"—")}
                · Basis ${rz.basisMengeG!=null ? Calc.runden(rz.basisMengeG) : "—"} ${esc(rz.basisName||"—")}</div>
              ${zt}
            </div>`;
          }).join("")}
          <div class="actions" style="margin-top:.8rem">
            <button id="importUebernehmen">Übernehmen</button>
            <button id="importAbbrechen2" class="ghost">Abbrechen</button>
          </div>
        </div>
      </section>`;

    box.innerHTML = kopf + unbekanntHtml + konfliktHtml + vorschauHtml;
    View.importEreignisse();
  },

  importEreignisse(){
    const st = Store.import;
    el("#importText") && el("#importText").addEventListener("input", e => { st.text = e.target.value; });
    el("#importDatei") && el("#importDatei").addEventListener("change", e => {
      const datei = e.target.files[0]; if(!datei) return;
      if(/\.xlsx?$/i.test(datei.name)){ App.importExcelAltdatei(datei); return; }
      const reader = new FileReader();
      reader.onload = () => { st.text = String(reader.result || ""); App.importAuswerten(); };
      reader.readAsText(datei);
    });
    el("#importFreitext") && el("#importFreitext").addEventListener("click", () => {
      st.text = JSON.stringify(Import.freitextZerlegen(st.text), null, 2);
      View.import();
    });
    el("#importPruefen") && el("#importPruefen").addEventListener("click", () => App.importPruefen());
    el("#importKiText") && el("#importKiText").addEventListener("click", (e) => {
      const textEl = el("#importText"); if(textEl) st.text = textEl.value;
      const btn = e.currentTarget; btn.disabled = true;
      App.importAusKiText(st.text).finally(() => { if(btn) btn.disabled = false; });
    });
    el("#importKiBild") && el("#importKiBild").addEventListener("change", (e) => {
      const datei = e.target.files[0]; if(!datei) return;
      const reader = new FileReader();
      reader.onload = () => App.importAusKiBild(String(reader.result || ""));
      reader.readAsDataURL(datei);
    });
    el("#importAbbrechen") && el("#importAbbrechen").addEventListener("click", () => App.importSchliessen());
    el("#importAbbrechen2") && el("#importAbbrechen2").addEventListener("click", () => App.importSchliessen());
    el("#importUebernehmen") && el("#importUebernehmen").addEventListener("click", () => App.importUebernehmen());
    document.querySelectorAll("[data-unbekannt]").forEach(sel =>
      sel.addEventListener("change", e => App.importZuordnen(e.target.dataset.unbekannt, e.target.value)));
    document.querySelectorAll("[data-konflikt]").forEach(btn =>
      btn.addEventListener("click", e => App.importEntscheiden(Number(e.target.dataset.konflikt), e.target.dataset.wahl)));
  },

  /* ---------- Recherche-Dialog (AP-0318, «Preise aktualisieren») ---------------------
     Store.recherche === null -> Dialog geschlossen, nichts rendern. Gleiche Regel wie im
     Import-Dialog: nichts wird ungefragt geschrieben, jede Zeile braucht ein Häkchen. */
  recherche(){
    const box = el("#rechercheBereich");
    const st = Store.recherche;
    if(!st){ box.innerHTML = ""; return; }

    if(st.laedt){
      box.innerHTML = `<section class="card" id="rechercheKarte"><h2>Preise aktualisieren</h2>
        <div class="body"><div class="hint">Anfrage läuft für ${st.namen.length} Rohstoff(e) …</div></div></section>`;
      return;
    }
    if(st.fehler){
      box.innerHTML = `<section class="card" id="rechercheKarte"><h2>Preise aktualisieren</h2>
        <div class="body">
          <div class="msg err">Anfrage fehlgeschlagen: ${esc(st.fehler)}</div>
          <div class="actions" style="margin-top:.6rem"><button class="ghost" id="rechercheAbbrechen">Schliessen</button></div>
        </div></section>`;
      View.rechercheEreignisse();
      return;
    }

    const zeilen = st.vorschlaege.map(v => {
      if(v.gefunden === false)
        return `<div class="msg warn"><b>${esc(v.name)}</b> — nicht gefunden, alter Wert bleibt stehen.</div>`;
      const rohstoff = Store.rohstoffe.find(r => Model.normKey(r.name) === Model.normKey(v.name));
      const altPreis = rohstoff && rohstoff.kostenProKg != null ? chf(rohstoff.kostenProKg) + "/kg" : "—";
      const neuPreis = v.kostenProKg != null ? chf(v.kostenProKg) + "/kg" : "—";
      return `<div class="zuordnungzeile">
        <label style="display:flex;gap:.5rem;align-items:flex-start;cursor:pointer">
          <input type="checkbox" data-recherche="${esc(v.name)}"${st.entscheidung[v.name] ? " checked" : ""}>
          <span><b>${esc(v.name)}</b><br>
            ${esc(altPreis)} → ${esc(neuPreis)}<br>
            <span class="hint" style="display:inline">Quelle: ${esc(v.quelle||"—")} · Stand: ${esc(v.stand||"—")}</span>
          </span>
        </label>
      </div>`;
    }).join("");

    box.innerHTML = `<section class="card" id="rechercheKarte">
      <h2>Preise aktualisieren</h2>
      <div class="body">
        <div class="hint">Vorschlag je Rohstoff mit Quelle und Stand — nur angehakte Zeilen werden geschrieben.</div>
        ${zeilen || '<div class="hint">Keine Vorschläge erhalten.</div>'}
        <div class="actions" style="margin-top:.8rem">
          <button id="rechercheUebernehmen">Übernehmen</button>
          <button class="ghost" id="rechercheAbbrechen">Abbrechen</button>
        </div>
      </div>
    </section>`;
    View.rechercheEreignisse();
  },

  rechercheEreignisse(){
    document.querySelectorAll("[data-recherche]").forEach(cb =>
      cb.addEventListener("change", e => App.rechercheEntscheiden(e.target.dataset.recherche, e.target.checked)));
    el("#rechercheUebernehmen") && el("#rechercheUebernehmen").addEventListener("click", () => App.rechercheUebernehmen());
    el("#rechercheAbbrechen") && el("#rechercheAbbrechen").addEventListener("click", () => App.rechercheSchliessen());
  }
};

/* ---------- SelfTest: Referenzwerte aus Feinkonzept AP-0206 §9 ---------- */
function selfTest(){
  const nah = (a,b,t) => a!=null && Math.abs(a-b) < (t||0.001);
  const idx = Model.rohstoffIndex(BEISPIEL_ROHSTOFFE);
  const rzT = { basisMengeG:1000, portionen:1, phasen:[{zutaten:[
      {name:"Wasser",prozent:0.650,rohstoff:idx.get("wasser"),nameKey:"wasser"},
      {name:"Milch 3.5%",prozent:0.030,rohstoff:idx.get("milch 3.5%"),nameKey:"milch 3.5%"}]}] };
  const suT = { basisMengeG:1000, portionen:1, phasen:[{zutaten:[
      {name:"Zucker",prozent:0.100,rohstoff:idx.get("zucker"),nameKey:"zucker"},
      {name:"Tagatose",prozent:0.050,rohstoff:idx.get("tagatose"),nameKey:"tagatose"}]}] };
  const t = [
    ["T1 Skalierung",       nah(Calc.mengeG({prozent:0.65}, 1000, 1.5), 975)],
    ["T2 Stückzahl",        nah(Calc.alsStueck(120, idx.get("vollei")).stueck, 2)],
    ["T3 Schwund",          nah(Calc.schwundEintrag(2400, 2180), 0.09167, 0.0001)],
    ["T4 Kosten",           nah(3.20/(1-0.08), 3.4783, 0.001)],
    ["T5 Hydration",        nah(Calc.kennzahlen(rzT,1).hydration, 0.680)],
    ["T6 Süsse",            nah(Calc.kennzahlen(suT,1).suesse, 0.146)],
    ["T7 Ampel grün",       Calc.ampel(0.65, 0.68) === "gruen"],
    ["T7b Ampel rot",       Calc.ampel(0.55, 0.68) === "rot"],
    ["T8 Substitution",     nah(Calc.substitutionsMenge(100, 1.0, 0.92).menge, 108.7, 0.05)],
    ["T9 FODMAP rot",       Calc.fodmapGesamt([{rohstoff:{fodmap:"gruen"}},{rohstoff:{fodmap:"gruen"}},{rohstoff:{fodmap:"rot"}}]).ampel === "rot"],
    ["T10 FODMAP unbew.",   Calc.fodmapGesamt([{rohstoff:{fodmap:"gruen"}},{rohstoff:{fodmap:"gruen"}},{rohstoff:null},{rohstoff:null}]).ampel === "gelb"],
    ["T11 Alias",           Model.nameKey("Mehl 00") === "weissmehl 00"],
    // ---- AP-0303 Skalierung + Einheiten-Umrechnung — Testblock (5 Fälle) ----
    // Bürli-Beispiel Lastenheft §5.1: Basis 1000 g Mehl → Ziel 1500 g, Wasser 65 % = 975 g.
    ["AP0303-1 Bürli-Beispiel (1000→1500g, Wasser 65%)",
                            nah(Calc.mengeG({prozent:0.65}, 1000, Calc.faktorAusBasis(1500, {basisMengeG:1000})), 975)],
    // 80 g Vollei ÷ 60 g Einheitsgrösse = 1.333 Stk, gerundet auf 0.5 → 1.5 Stk.
    ["AP0303-2 Stück-Rundung (80g Vollei à 60g → 1.5 Stk)",
                            Calc.rundenStueck(Calc.alsStueck(80, idx.get("vollei")).stueck) === 1.5],
    // Bidirektional: 2 Portionen → 3 Portionen ergibt denselben Faktor 1.5 wie Basis 1000→1500.
    ["AP0303-3 Portionen-Skalierung bidirektional (2→3 Portionen)",
                            nah(Calc.faktorAusPortionen(3, {portionen:2}), 1.5)],
    // ml-Rundung auf 5 ml (AP-0303-Kontext).
    ["AP0303-4 ml-Rundung (122 ml → 120 ml)",
                            Calc.runden(122, "ml") === "120 ml"],
    // g-Rundung auf 1 g bleibt nach FR-305 unverändert (Feinkonzept AP-0206 §4).
    ["AP0303-5 g-Rundung (974.6 g → 975 g)",
                            Calc.runden(974.6) === "975 g"],
    // ---- AP-0304 Kosten- und Nährwertberechnung — Testblock (3 Fälle) ----
    // Handrechnung: 700 g Mehl 00 (à 2.20/kg) + 100 g Zucker (à 1.30/kg) + 50 g Butter (à 15.50/kg),
    // kein Backprotokoll ⇒ Schwund unbekannt/0 %. Roh = 1.54 + 0.13 + 0.775 = 2.445 CHF, 2 Portionen.
    (() => {
      const rzKosten = { basisMengeG:1000, portionen:2, backprotokoll:[], phasen:[{zutaten:[
        {name:"Weissmehl 00", prozent:0.700, rohstoff:idx.get("weissmehl 00"), nameKey:"weissmehl 00"},
        {name:"Zucker",       prozent:0.100, rohstoff:idx.get("zucker"),       nameKey:"zucker"},
        {name:"Butter",       prozent:0.050, rohstoff:idx.get("butter"),       nameKey:"butter"}
      ]}] };
      const kk = Calc.kosten(rzKosten, 1, Calc.schwundAktuell(rzKosten.backprotokoll));
      return ["AP0304-1 Kosten Handrechnung (kein Protokoll ⇒ Schwund 0%, Gesamt 2.445 CHF, ±0.05)",
        nah(kk.effektiv, 2.445, 0.05) && nah(kk.proPortion, 1.2225, 0.05)];
    })(),
    // Handrechnung Nährwerte für dasselbe Rezept: 700×344/100 + 100×400/100 + 50×741/100
    // = 2408 + 400 + 370.5 = 3178.5 kcal gesamt, 1589.25 kcal/Portion.
    (() => {
      const rzNaehr = { basisMengeG:1000, portionen:2, phasen:[{zutaten:[
        {name:"Weissmehl 00", prozent:0.700, rohstoff:idx.get("weissmehl 00"), nameKey:"weissmehl 00"},
        {name:"Zucker",       prozent:0.100, rohstoff:idx.get("zucker"),       nameKey:"zucker"},
        {name:"Butter",       prozent:0.050, rohstoff:idx.get("butter"),       nameKey:"butter"}
      ]}] };
      const nn = Calc.naehrwerte(rzNaehr, 1);
      return ["AP0304-2 Nährwerte Handrechnung (3178.5 kcal gesamt, 1589.25 kcal/Portion, ±1)",
        nah(nn.gesamt.kcal, 3178.5, 1) && nah(nn.proPortion.kcal, 1589.25, 1)];
    })(),
    // Zutat mit aufgelöstem Rohstoff, aber ohne hinterlegten Preis: muss als Lücke geführt
    // werden (fehlend[]) statt mit 0.00 CHF stillschweigend in die Summe einzugehen.
    (() => {
      const rzLuecke = { basisMengeG:1000, portionen:1, backprotokoll:[], phasen:[{zutaten:[
        {name:"Weissmehl 00", prozent:0.500, rohstoff:idx.get("weissmehl 00"), nameKey:"weissmehl 00"},
        {name:"Geheimzutat",  prozent:0.020, rohstoff:{kostenProKg:null, naehrwerte:{kcal:null,eiweiss:null,fett:null,kh:null}}, nameKey:"geheimzutat"}
      ]}] };
      const kl = Calc.kosten(rzLuecke, 1, null);
      return ["AP0304-3 Zutat ohne Preis erscheint als Lücke, nicht als 0.00 CHF",
        kl.fehlend.includes("Geheimzutat") && nah(kl.effektiv, 1.10, 0.01)];
    })(),
    // ---- AP-0315 Austauschformat + Import-Dialog — Testblock ----
    // Gültige Datei (Struktur wie FORMAT.md-Beispiel) besteht die Prüfung.
    ["AP0315-1 gültige Datei besteht Prüfung",
                            Import.pruefen({ format:"rezept/1", rezepte:[{
                              name:"Test", kategorie:"Backen", basisName:"Weissmehl 00", basisMengeG:1000,
                              sollgewichtG:1000, portionen:1, einheit:"Stk",
                              phasen:[{ name:"Phase 1", zutaten:[{name:"Weissmehl 00",prozent:1,einheit:"g"}], schritte:[] }],
                              backprotokoll:[], entwicklung:null
                            }]}).ok === true],
    // Fehlerhafte Datei (prozent fehlt) nennt Feld UND Position, verändert nichts.
    ["AP0315-2 fehlerhafte Datei nennt Feld+Position",
                            (() => {
                              const r = Import.pruefen({ format:"rezept/1", rezepte:[{
                                name:"Test", kategorie:"Backen", basisName:"Weissmehl 00", basisMengeG:1000,
                                sollgewichtG:1000, portionen:1, einheit:"Stk",
                                phasen:[{ name:"Phase 1", zutaten:[{name:"Wasser",einheit:"g"}], schritte:[] }]
                              }]});
                              return r.ok === false && r.fehler.some(f => f.pfad === "rezepte[0].phasen[0].zutaten[0].prozent");
                            })()],
    // Unbekannte Zutat wird erkannt (gegen die Beispiel-Rohstoffe).
    ["AP0315-3 unbekannte Zutat erkannt",
                            Import.unbekannteNamen([Import.zuIntern({
                              name:"Test", kategorie:"Backen", basisName:"Weissmehl 00", basisMengeG:1000,
                              sollgewichtG:1000, portionen:1, einheit:"Stk",
                              phasen:[{ name:"P", zutaten:[{name:"Glutamat",prozent:0.01,einheit:"g"}], schritte:[] }]
                            })], BEISPIEL_ROHSTOFFE).includes("Glutamat")],
    // Gleichnamiges Rezept löst einen Konflikt aus (nicht: stillschweigend übernehmen).
    ["AP0315-4 Namenskonflikt erkannt",
                            Import.konflikte([Import.zuIntern({
                              name:"Sauerteigbrot hell", kategorie:"Backen", basisName:"Weissmehl 00", basisMengeG:1000,
                              sollgewichtG:1000, portionen:1, einheit:"Stk",
                              phasen:[{ name:"P", zutaten:[], schritte:[] }]
                            })], BEISPIEL_REZEPTE).length === 1],
    // Export → Import ergibt denselben Bestand (Rundlauf): Export eines Beispielrezepts,
    // erneut geprüft und intern gewandelt, muss strukturell gleich zum Original sein.
    ["AP0315-5 Rundlauf Export → Import",
                            (() => {
                              const original = BEISPIEL_REZEPTE[0];
                              const exportiert = Import.alsExportAlle([original]);
                              const pruefung = Import.pruefen(exportiert);
                              if(!pruefung.ok) return false;
                              const zurueck = Import.zuIntern(exportiert.rezepte[0]);
                              return zurueck.name === original.name
                                && zurueck.basisMengeG === original.basisMengeG
                                && zurueck.phasen.length === original.phasen.length
                                && zurueck.phasen[0].zutaten.length === original.phasen[0].zutaten.length
                                && zurueck.phasen[0].zutaten[0].prozent === original.phasen[0].zutaten[0].prozent;
                            })()],
    // ---- AP-0316 Excel-Import Altdateien — Testblock (4 Fälle) ----
    // Nachgebautes Muster aus AP-0101/St. Galler Bürli: Kopfzeile "Sollgewicht", zwei
    // Teigphasen-Spalten (Autolyse, Hauptteig), eine mehrphasige Zutat (Halbweissmehl).
    (() => {
      const aoa = [
        ["Sollgewicht", 24, "Bürli", "a", 140.6, "g", 3374.4],
        ["", "%", "1 Leib", "", "", "Autolyse", "Hauptteig"],
        ["Wasser", 0.1326, 449.92, "g", "", 449.92, ""],
        ["Halbweissmehl", 0.3271, 1109.8, "g", 0.405, 449.47, 660.33],
        ["Ruchmehl", 0.2210, 749.87, "g", "", "", 749.87],
        ["Mehlanteil gesamt", "", 1859.67, "g", "", "", ""],
        ["Vorteig\nDen Sauerteig mit dem Wasser verrühren.\nMehl dazugeben und vermischen.", "", "", "", "", "", ""],
        ["Hauptteig\nAlle Zutaten kneten.\nTeig ruhen lassen.", "", "", "", "", "", ""]
      ];
      const { rezept, protokoll } = Import.excelBlattErkennen("Bürli-Test", aoa, { dateipfad:"Test.xlsx", kategorieHinweis:"Backen" });
      const hauptteig = rezept && rezept.phasen.find(p => p.name === "Hauptteig");
      const okStruktur = rezept && rezept.basisName === "Halbweissmehl" && rezept.basisMengeG === 1109.8
        && rezept.sollgewichtG === 3374.4 && rezept.portionen === 24 && rezept.phasen.length === 3
        && rezept.phasen.some(p => p.name === "Autolyse") && rezept.phasen.some(p => p.name === "Vorteig")
        // Phasenspalte "Hauptteig" und Text-Ueberschrift "Hauptteig" werden zusammengefuehrt,
        // nicht als zwei gleichnamige Phasen nebeneinander gefuehrt.
        && !!hauptteig && hauptteig.zutaten.length === 2 && hauptteig.schritte.length === 2;
      return ["AP0316-1 mehrphasiges Muster (Bürli) korrekt erkannt, Prüfung besteht",

    })(),
    // Einphasiges Muster (Gelato): keine Phasenspalten, generische Phase "Zutaten" aus Spalte C.
    (() => {

        ["Sollgewicht", 30, "Portionen", "a", 80, "g", 2400],
        ["", "%", "", "", "", "", "", "", "", "", "Grundrezept"],
        ["Latte intero", 0.59, 1298.5, "g", "", "", "", "", "", "", 0.59],
        ["Zucchero", 0.144, 316.7, "g", "", "", "", "", "", "", 0.144],
        ["Anleitung:\nLatte erwärmen.\nZucker einrühren.\nAbkühlen lassen.", "", "", "", "", "", "", "", "", "", ""]

      const { rezept } = Import.excelBlattErkennen("Gelato-Test", aoa, {});
      return ["AP0316-2 einphasiges Muster (Gelato) — keine Prozent-Spalte als Phase missverstanden",
        !!rezept && rezept.phasen.length === 2 && rezept.phasen[0].name === "Zutaten"
          && rezept.phasen[0].zutaten.length === 2 && rezept.basisName === "Latte intero"];
    })(),
    // Blatt ohne "Sollgewicht"-Kopf (z.B. Wurstrezeptur mit abweichender Konvention, oder ein
    // Hilfsblatt wie "Umrechnungsfaktoren"): kein Rezept, Grund steht im Protokoll — kein Raten.
    (() => {
      const aoa = [["", "", "", "Nr1"], ["Zutaten", "", "%", ""], ["Kalbfleisch", 0.7, "", ""]];
      const { rezept, protokoll } = Import.excelBlattErkennen("Wurst-Test", aoa, {});
      return ["AP0316-3 abweichende Datei-Konvention (kein \"Sollgewicht\"-Kopf) — kein Rezept, keine Vermutung",
        rezept === null && protokoll.status === "kopf_nicht_erkannt" && protokoll.geraten.length === 0];
    })(),
    // Prinzip "kein Rater": in keinem der drei Fälle oben wird protokoll.geraten befüllt —
    // der Erkenner kennt diese Kategorie bewusst nur als (immer leeren) Kontrollpunkt.
    ["AP0316-4 Prinzip eingehalten: geraten bleibt in jedem Fall leer",
                            Import.excelBlattErkennen("x", [["Sollgewicht"]], {}).protokoll.geraten.length === 0],
    // ---- AP-0305 Backprotokoll + Speichern — Testblock (2 Fälle) ----
    // Produktive Rezepte.xlsx traegt aktuell in jeder Zeile denselben unausgefuellten
    // Platzhalter (Datum "YYYY-MM-DD", Felder soll_g/ist_g statt sollG/istG) — Model.parseRezepte
    // muss ihn verwerfen und darf einen echten, korrekt benannten Eintrag daneben nicht verlieren.
    (() => {
      const header = ["Rezept-ID","Name","Kategorie","Unterkategorie","Basis-Rohstoff","Basis-Menge (g)",
        "Sollgewicht (g)","Portionen","Einheit","Quelle","Phasen (JSON)","Backprotokoll (JSON)"];
      const row = ["RZP-T","Test","Backen",null,"Mehl",1000,1000,1,"Stk",null,"[]",

      return ["AP0305-1 Backprotokoll-Platzhalter verworfen, gültiger Eintrag bleibt (sollG/istG)",

    })(),
    // Zelladresse fuer die gezielten Workbook-API-Updates: Spalte per Name gefunden,
    // 0-indexiert in einen Buchstaben umgerechnet, mit der uebergebenen Excel-Zeile kombiniert.
    ["AP0305-2 Zelladresse (Spalte „Backprotokoll (JSON)“, Zeile 5) → C5",
                            Model.zelladresse(["Rezept-ID","Name","Backprotokoll (JSON)"], "Backprotokoll (JSON)", 5) === "C5"],
    // ---- AP-0318 Service-Schnittstelle — Testblock (4 Fälle) ----
    // Ohne CONFIG.serviceUrl ist der Dienst nicht verfuegbar — der Default-Zustand dieser App

    ["AP0318-1 ohne serviceUrl ist kein Dienst verfuegbar", Service.verfuegbar() === false],
    (() => {

      CONFIG.serviceUrl = "https://beispiel.invalid/service";
