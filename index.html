/* ---------- Layout: dreispaltiges Grundgerüst (AP-0301, nach AP-0201 §2/§3.5) ----
   Reine Darstellungssteuerung — kein Bezug zum Rechenkern. Zustand je Bereich
   (offen/zu, aktiver Reiter rechts, Vollbild) liegt gerätelokal in localStorage
   unter "libarius.layout.v1" (Settings-Wrapper, Schlüssel "layout"). Die Stufe
   (W/M/K) wird nicht gespeichert, sondern bei jedem Aufruf aus der Fensterbreite
   gelesen — Breakpoints exakt wie AP-0201 §2.1: 860 px und 1280 px. */
const Layout = {
  state: { links: true, rechts: true, rechtsTab: "kochen", vollbild: false },
  // explizit=false: der Zustand kommt aus der Stufen-Vorgabe, nicht von einem bewussten
  // Klick des Geräts — beim Drehen/Skalieren darf er dann pro Stufe neu berechnet werden
  // (§1 Standardzustand). Sobald einmal geklappt/getippt wurde, bleibt die Wahl bestehen,
  // auch über eine spätere Breitenänderung hinweg (§3.5 "gerätelokal gemerkt").
  explizit: false,

  stufe(){
    const w = window.innerWidth;
    return w >= 1280 ? "w" : (w >= 860 ? "m" : "k");
  },
  schmal(){ return Layout.stufe() !== "w"; },

  standard(){
    const w = !Layout.schmal();
    Layout.state.links = w;
    Layout.state.rechts = w;
  },
  laden(){
    const gespeichert = Settings.get("layout", null);
    if(gespeichert){
      Object.assign(Layout.state, gespeichert);
      Layout.explizit = true;
    }else{
      // Standardzustand aus AP-0201 §1: bei W beide Schienen offen, bei M/K beide zu.
      Layout.standard();
      Layout.state.rechtsTab = "kochen";
      Layout.explizit = false;
    }
  },
  speichern(){ Layout.explizit = true; Settings.set("layout", Layout.state); },

  /* AP-0304 (AP-0201 §1 B5, §3.5): offen/zu je Metadatenblock, geraetelokal gemerkt.
     Bewusst ein EIGENER Settings-Schluessel statt Layout.state: das Aufklappen eines
     Metadatenblocks in der Mittelspalte ist keine bewusste Schienenwahl und darf
     Layout.explizit nicht setzen — sonst friere man mit dem ersten Klick auf "Kosten"
     den Schienen-Standardzustand beim Drehen/Skalieren ein (Regel M, §2.2).
     Standard: alle Bloecke zu. */
  meta: {},
  metaLaden(){ const g = Settings.get("metablock", null); Layout.meta = (g && typeof g === "object") ? g : {}; },
  metaOffen(id){ return Layout.meta[id] === true; },
  metaSetzen(id, offen){ Layout.meta[id] = !!offen; Settings.set("metablock", Layout.meta); },

  anwenden(){
    // Regel M/K gilt auch nach einer Fensterbreitenänderung (Drehen, Fenster ziehen) —
    // nicht nur beim aktiven Öffnen einer Schiene. Ohne bewusste Wahl (explizit=false)
    // wird bei jeder Breitenänderung einfach der Standardzustand der aktuellen Stufe neu
    // berechnet; mit bewusster Wahl gilt nur noch die Regel "höchstens eine Schiene bei M/K".
    if(!Layout.explizit){
      Layout.standard();
    }else if(Layout.schmal() && Layout.state.links && Layout.state.rechts){
      Layout.state.rechts = false;
    }
    const b = document.body;
    b.dataset.links = Layout.state.links ? "offen" : "zu";
    b.dataset.rechts = Layout.state.rechts ? "offen" : "zu";
    b.classList.toggle("vollbild", Layout.state.vollbild);
    document.querySelectorAll(".railtab").forEach(t =>
      t.classList.toggle("aktiv", t.dataset.tab === Layout.state.rechtsTab));
    el("#panelKochen").hidden = Layout.state.rechtsTab !== "kochen";
    el("#panelEntwicklung").hidden = Layout.state.rechtsTab !== "entwicklung";
    const overlayOffen = Layout.stufe() === "k" && (Layout.state.links || Layout.state.rechts);
    el("#scrim").hidden = !overlayOffen;
  },

  // Regel M (AP-0201 §2.2): bei M/K höchstens eine Schiene offen — das Öffnen
  // der einen schliesst die andere. Bei W sind beide unabhängig (Wireframe W).
  oeffnenLinks(){
    Layout.state.links = true;
    if(Layout.schmal()) Layout.state.rechts = false;
    Layout.speichern(); Layout.anwenden();
  },
  schliessenLinks(){ Layout.state.links = false; Layout.speichern(); Layout.anwenden(); },
  toggleLinks(){ Layout.state.links ? Layout.schliessenLinks() : Layout.oeffnenLinks(); },

  oeffnenRechts(){
    Layout.state.rechts = true;
    if(Layout.schmal()) Layout.state.links = false;
    Layout.speichern(); Layout.anwenden();
  },
  schliessenRechts(){ Layout.state.rechts = false; Layout.speichern(); Layout.anwenden(); },
  toggleRechts(){ Layout.state.rechts ? Layout.schliessenRechts() : Layout.oeffnenRechts(); },

  tabWaehlen(tab){
    Layout.state.rechtsTab = tab;
    Layout.oeffnenRechts();
  },

  toggleVollbild(){
    Layout.state.vollbild = !Layout.state.vollbild;
    Layout.speichern(); Layout.anwenden();
  },

  scrimKlick(){
    Layout.state.links = false; Layout.state.rechts = false;
    Layout.speichern(); Layout.anwenden();
  },

  init(){
    Layout.laden();
    Layout.metaLaden();
    el("#btnRailLinks").addEventListener("click", Layout.toggleLinks);
    el("#btnRailLinksSpindel").addEventListener("click", Layout.toggleLinks);
    el("#btnRailLinksSchliessen").addEventListener("click", Layout.schliessenLinks);
    el("#btnRailRechts").addEventListener("click", Layout.toggleRechts);
    el("#btnRailRechtsSpindel").addEventListener("click", Layout.toggleRechts);
    el("#btnRailRechtsSchliessen").addEventListener("click", Layout.schliessenRechts);
    el("#btnVollbild").addEventListener("click", Layout.toggleVollbild);
    el("#btnVollbildEnde").addEventListener("click", Layout.toggleVollbild);
    el("#scrim").addEventListener("click", Layout.scrimKlick);
    document.querySelectorAll(".railtab").forEach(t =>
      t.addEventListener("click", () => Layout.tabWaehlen(t.dataset.tab)));
    window.addEventListener("resize", Layout.anwenden);
    window.addEventListener("orientationchange", Layout.anwenden);
    Layout.anwenden();
  }
};

/* ---------- SelfTest: Referenzwerte aus Feinkonzept AP-0206 §9 ---------- */
// AP-0305: async seit diesem AP — die drei gemockten Schreibpfad-Zweige (Umsetzungsschritt 5)
// rufen editorSchreiben() ueber eine gemockte Graph-Schicht auf und brauchen echte awaits.
async function selfTest(){
  const nah = (a,b,t) => a!=null && Math.abs(a-b) < (t||0.001);
  const idx = Model.rohstoffIndex(BEISPIEL_ROHSTOFFE);
  const rzT = { basisMengeG:1000, portionen:1, phasen:[{zutaten:[
      {name:"Wasser",prozent:0.650,rohstoff:idx.get("wasser"),nameKey:"wasser"},
      {name:"Milch 3.5%",prozent:0.030,rohstoff:idx.get("milch 3.5%"),nameKey:"milch 3.5%"}]}] };
  const suT = { basisMengeG:1000, portionen:1, phasen:[{zutaten:[
      {name:"Zucker",prozent:0.100,rohstoff:idx.get("zucker"),nameKey:"zucker"},
      {name:"Tagatose",prozent:0.050,rohstoff:idx.get("tagatose"),nameKey:"tagatose"}]}] };

  // AP-0305 Umsetzungsschritt 5: gemockte Graph-Schicht fuer editorSchreiben() — jeder Aufruf
  // (Erfolg oder Fehlschlag) wird in "log" gebucht, BEVOR ueber "script" entschieden wird, ob er
  // wirft. So belegt log je Zweig lueckenlos, welche Aufrufe stattfanden und welche nicht.
  const mockGateway = (script) => {
    const log = [];
    return { log,
      async getItemMeta(){ log.push("getItemMeta"); return script.eTag(); },
      async backup(){ log.push("backup"); if(script.backupWirft) throw new Error("Backup-Fehler (mock)"); return "datei.xlsx"; },
      async updateCell(pfad, sheet, addr){ log.push("updateCell:" + addr);
        if(script.updateCellWirft === addr) throw new Error("Zelle " + addr + " schreiben fehlgeschlagen (mock)");
        return true; }
    };
  };
  const editorSchreibenHeader = ["Rezept-ID","Name","Kategorie","Unterkategorie","Basis-Rohstoff",
    "Basis-Menge (g)","Sollgewicht (g)","Portionen","Einheit","Quelle","Phasen (JSON)",
    "Backprotokoll (JSON)","Entwicklung (JSON)","Verfahren","Protokoll (JSON)","Geändert"];
  const editorSchreibenParams = { rezeptePfad:"/Test/Rezepte.xlsx", sheetName:"Rezepte",
    header: editorSchreibenHeader, zeileExcel: 5, normPhasen:[{name:"P",zutaten:[{name:"Mehl",prozent:1,einheit:"g"}],schritte:[]}] };
  const addrPhasen = Model.zelladresse(editorSchreibenHeader, "Phasen (JSON)", 5);   // "K5"
  const addrGeaendert = Model.zelladresse(editorSchreibenHeader, "Geändert", 5);     // "P5"

  // Zweig A: gleicher eTag — Backup UND beide Zell-Updates finden statt, Ergebnis "ok".
  const gwGleich = mockGateway({ eTag:() => ({ eTag:"E1" }) });
  const ergGleich = await editorSchreiben(gwGleich, { ...editorSchreibenParams, aktuellerETag:"E1" });

  // Zweig B: fremder eTag — Abbruch direkt nach der Pruefung, NICHTS geschrieben.
  const gwFremd = mockGateway({ eTag:() => ({ eTag:"E2" }) });
  const ergFremd = await editorSchreiben(gwFremd, { ...editorSchreibenParams, aktuellerETag:"E1" });

  // Zweig C: Schreibfehler mittendrin — Backup gelingt, die Kernzelle (Phasen) schlaegt fehl;
  // das Nebenfeld (Geändert) darf danach gar nicht erst versucht werden.
  const gwFehler = mockGateway({ eTag:() => ({ eTag:"E1" }), updateCellWirft: addrPhasen });
  const ergFehler = await editorSchreiben(gwFehler, { ...editorSchreibenParams, aktuellerETag:"E1" });

  const t = [
    ["T1 Skalierung",       nah(Calc.mengeG({prozent:0.65}, 1000, 1.5), 975)],
    ["T2 Stückzahl",        nah(Calc.alsStueck(120, idx.get("vollei")).stueck, 2)],
    ["T3 Schwund",          nah(Calc.schwundEintrag(2400, 2180), 0.09167, 0.0001)],
    ["T4 Kosten",           nah(3.20/(1-0.08), 3.4783, 0.001)],
    ["T5 Hydration",        nah(Calc.kennzahlen(rzT,1).hydration, 0.680)],
    ["T6 Süsse",            nah(Calc.kennzahlen(suT,1).suesse, 0.146)],
    ["T7 Ampel grün",       Calc.ampel(0.65, 0.68) === "gruen"],
    ["T7b Ampel rot",       Calc.ampel(0.55, 0.68) === "rot"],
    ["T8 Substitution",     nah(Calc.substitutionsMenge(100, 1.0, 0.92).menge, 108.7, 0.05)],
    ["T9 FODMAP rot",       Calc.fodmapGesamt([{rohstoff:{fodmap:"gruen"}},{rohstoff:{fodmap:"gruen"}},{rohstoff:{fodmap:"rot"}}]).ampel === "rot"],
    ["T10 FODMAP unbew.",   Calc.fodmapGesamt([{rohstoff:{fodmap:"gruen"}},{rohstoff:{fodmap:"gruen"}},{rohstoff:null},{rohstoff:null}]).ampel === "gelb"],
    ["T11 Alias",           Model.nameKey("Mehl 00") === "weissmehl 00"],
    // ---- AP-0303 Skalierung + Einheiten-Umrechnung — Testblock (5 Fälle) ----
    // Bürli-Beispiel Lastenheft §5.1: Basis 1000 g Mehl → Ziel 1500 g, Wasser 65 % = 975 g.
    ["AP0303-1 Bürli-Beispiel (1000→1500g, Wasser 65%)",
                            nah(Calc.mengeG({prozent:0.65}, 1000, Calc.faktorAusBasis(1500, {basisMengeG:1000})), 975)],
    // 80 g Vollei ÷ 60 g Einheitsgrösse = 1.333 Stk, gerundet auf 0.5 → 1.5 Stk.
    ["AP0303-2 Stück-Rundung (80g Vollei à 60g → 1.5 Stk)",
                            Calc.rundenStueck(Calc.alsStueck(80, idx.get("vollei")).stueck) === 1.5],
    // Bidirektional: 2 Portionen → 3 Portionen ergibt denselben Faktor 1.5 wie Basis 1000→1500.
    ["AP0303-3 Portionen-Skalierung bidirektional (2→3 Portionen)",
                            nah(Calc.faktorAusPortionen(3, {portionen:2}), 1.5)],
    // ml-Rundung auf 5 ml (AP-0303-Kontext).
    ["AP0303-4 ml-Rundung (122 ml → 120 ml)",
                            Calc.runden(122, "ml") === "120 ml"],
    // g-Rundung auf 1 g bleibt nach FR-305 unverändert (Feinkonzept AP-0206 §4).
    ["AP0303-5 g-Rundung (974.6 g → 975 g)",
                            Calc.runden(974.6) === "975 g"],
    // ---- AP-0304 Kosten- und Nährwertberechnung — Testblock (3 Fälle) ----
    // Handrechnung: 700 g Mehl 00 (à 2.20/kg) + 100 g Zucker (à 1.30/kg) + 50 g Butter (à 15.50/kg),

        {name:"Weissmehl 00", prozent:0.700, rohstoff:idx.get("weissmehl 00"), nameKey:"weissmehl 00"},

      return ["AP0304-1 Kosten Handrechnung (kein Protokoll ⇒ Schwund 0%, Gesamt 2.445 CHF, ±0.05)",

    (() => {

        {name:"Weissmehl 00", prozent:0.700, rohstoff:idx.get("weissmehl 00"), nameKey:"weissmehl 00"},

      return ["AP0304-2 Nährwerte Handrechnung (3178.5 kcal gesamt, 1589.25 kcal/Portion, ±1)",

    })(),
    // Zutat mit aufgelöstem Rohstoff, aber ohne hinterlegten Preis: muss als Lücke geführt

        {name:"Weissmehl 00", prozent:0.500, rohstoff:idx.get("weissmehl 00"), nameKey:"weissmehl 00"},
        {name:"Geheimzutat",  prozent:0.020, rohstoff:{kostenProKg:null, naehrwerte:{kcal:null,eiweiss:null,fett:null,kh:null}}, nameKey:"geheimzutat"}
      ]}] };
      const kl = Calc.kosten(rzLuecke, 1, null);
      return ["AP0304-3 Zutat ohne Preis erscheint als Lücke, nicht als 0.00 CHF",
        kl.fehlend.includes("Geheimzutat") && nah(kl.effektiv, 1.10, 0.01)];
    })(),
    // ---- AP-0315 Austauschformat + Import-Dialog — Testblock ----
    // Gültige Datei (Struktur wie FORMAT.md-Beispiel) besteht die Prüfung.
    ["AP0315-1 gültige Datei besteht Prüfung",
                            Import.pruefen({ format:"rezept/1", rezepte:[{

                              phasen:[{ name:"Phase 1", zutaten:[{name:"Weissmehl 00",prozent:1,einheit:"g"}], schritte:[] }],
                              backprotokoll:[], entwicklung:null
                            }]}).ok === true],
    // Fehlerhafte Datei (prozent fehlt) nennt Feld UND Position, verändert nichts.
    ["AP0315-2 fehlerhafte Datei nennt Feld+Position",

                                phasen:[{ name:"Phase 1", zutaten:[{name:"Wasser",einheit:"g"}], schritte:[] }]

                              return r.ok === false && r.fehler.some(f => f.pfad === "rezepte[0].phasen[0].zutaten[0].prozent");
                            })()],
    // Unbekannte Zutat wird erkannt (gegen die Beispiel-Rohstoffe).
    ["AP0315-3 unbekannte Zutat erkannt",
                            Import.unbekannteNamen([Import.zuIntern({
                              name:"Test", kategorie:"Backen", basisName:"Weissmehl 00", basisMengeG:1000,
                              sollgewichtG:1000, portionen:1, einheit:"Stk",
                              phasen:[{ name:"P", zutaten:[{name:"Glutamat",prozent:0.01,einheit:"g"}], schritte:[] }]
                            })], BEISPIEL_ROHSTOFFE).includes("Glutamat")],
    // Gleichnamiges Rezept löst einen Konflikt aus (nicht: stillschweigend übernehmen).
    ["AP0315-4 Namenskonflikt erkannt",
                            Import.konflikte([Import.zuIntern({
                              name:"Sauerteigbrot hell", kategorie:"Backen", basisName:"Weissmehl 00", basisMengeG:1000,
                              sollgewichtG:1000, portionen:1, einheit:"Stk",
                              phasen:[{ name:"P", zutaten:[], schritte:[] }]
                            })], BEISPIEL_REZEPTE).length === 1],
    // Export → Import ergibt denselben Bestand (Rundlauf): Export eines Beispielrezepts,
    // erneut geprüft und intern gewandelt, muss strukturell gleich zum Original sein.
    ["AP0315-5 Rundlauf Export → Import",
                            (() => {
                              const original = BEISPIEL_REZEPTE[0];
                              const exportiert = Import.alsExportAlle([original]);
                              const pruefung = Import.pruefen(exportiert);
                              if(!pruefung.ok) return false;
                              const zurueck = Import.zuIntern(exportiert.rezepte[0]);
                              return zurueck.name === original.name

                                && zurueck.phasen[0].zutaten[0].prozent === original.phasen[0].zutaten[0].prozent;
                            })()],
    // ---- AP-0316 Excel-Import Altdateien — Testblock (4 Fälle) ----
    // Nachgebautes Muster aus AP-0101/St. Galler Bürli: Kopfzeile "Sollgewicht", zwei
    // Teigphasen-Spalten (Autolyse, Hauptteig), eine mehrphasige Zutat (Halbweissmehl).
    (() => {
      const aoa = [
        ["Sollgewicht", 24, "Bürli", "a", 140.6, "g", 3374.4],
        ["", "%", "1 Leib", "", "", "Autolyse", "Hauptteig"],
        ["Wasser", 0.1326, 449.92, "g", "", 449.92, ""],
        ["Halbweissmehl", 0.3271, 1109.8, "g", 0.405, 449.47, 660.33],
        ["Ruchmehl", 0.2210, 749.87, "g", "", "", 749.87],
        ["Mehlanteil gesamt", "", 1859.67, "g", "", "", ""],
        ["Vorteig\nDen Sauerteig mit dem Wasser verrühren.\nMehl dazugeben und vermischen.", "", "", "", "", "", ""],
        ["Hauptteig\nAlle Zutaten kneten.\nTeig ruhen lassen.", "", "", "", "", "", ""]
      ];
      const { rezept, protokoll } = Import.excelBlattErkennen("Bürli-Test", aoa, { dateipfad:"Test.xlsx", kategorieHinweis:"Backen" });
      const hauptteig = rezept && rezept.phasen.find(p => p.name === "Hauptteig");
      const okStruktur = rezept && rezept.basisName === "Halbweissmehl" && rezept.basisMengeG === 1109.8
        && rezept.sollgewichtG === 3374.4 && rezept.portionen === 24 && rezept.phasen.length === 3
        && rezept.phasen.some(p => p.name === "Autolyse") && rezept.phasen.some(p => p.name === "Vorteig")
        // Phasenspalte "Hauptteig" und Text-Ueberschrift "Hauptteig" werden zusammengefuehrt,
        // nicht als zwei gleichnamige Phasen nebeneinander gefuehrt.
        && !!hauptteig && hauptteig.zutaten.length === 2 && hauptteig.schritte.length === 2;
      return ["AP0316-1 mehrphasiges Muster (Bürli) korrekt erkannt, Prüfung besteht",
        okStruktur && Import.pruefen({ format:"rezept/1", rezepte:[rezept] }).ok === true
          && protokoll.geraten.length === 0];
    })(),
    // Einphasiges Muster (Gelato): keine Phasenspalten, generische Phase "Zutaten" aus Spalte C.
    (() => {
      const aoa = [
        ["Sollgewicht", 30, "Portionen", "a", 80, "g", 2400],
        ["", "%", "", "", "", "", "", "", "", "", "Grundrezept"],
        ["Latte intero", 0.59, 1298.5, "g", "", "", "", "", "", "", 0.59],
        ["Zucchero", 0.144, 316.7, "g", "", "", "", "", "", "", 0.144],
        ["Anleitung:\nLatte erwärmen.\nZucker einrühren.\nAbkühlen lassen.", "", "", "", "", "", "", "", "", "", ""]
      ];
      const { rezept } = Import.excelBlattErkennen("Gelato-Test", aoa, {});
      return ["AP0316-2 einphasiges Muster (Gelato) — keine Prozent-Spalte als Phase missverstanden",
        !!rezept && rezept.phasen.length === 2 && rezept.phasen[0].name === "Zutaten"
          && rezept.phasen[0].zutaten.length === 2 && rezept.basisName === "Latte intero"];
    })(),
    // Blatt ohne "Sollgewicht"-Kopf (z.B. Wurstrezeptur mit abweichender Konvention, oder ein
    // Hilfsblatt wie "Umrechnungsfaktoren"): kein Rezept, Grund steht im Protokoll — kein Raten.
    (() => {
      const aoa = [["", "", "", "Nr1"], ["Zutaten", "", "%", ""], ["Kalbfleisch", 0.7, "", ""]];
      const { rezept, protokoll } = Import.excelBlattErkennen("Wurst-Test", aoa, {});
      return ["AP0316-3 abweichende Datei-Konvention (kein \"Sollgewicht\"-Kopf) — kein Rezept, keine Vermutung",
        rezept === null && protokoll.status === "kopf_nicht_erkannt" && protokoll.geraten.length === 0];

    // * faktorBeiEingabe) — skaleninvariant, hier ohne Store/DOM als reine Rechnung nachgebaut.
    ["AP0303-4 Uebernahme-Formel ist skaleninvariant (dieselbe Korrektur ergibt dasselbe Prozent, gleich bei welchem Faktor eingegeben)",
                            (() => {
                              const basisMengeG = 1000;
                              const beiFaktor1 = { ist:650, faktorBeiEingabe:1 };
                              const beiFaktor2 = { ist:1300, faktorBeiEingabe:2 };
                              const prozent1 = beiFaktor1.ist / (basisMengeG * beiFaktor1.faktorBeiEingabe);
                              const prozent2 = beiFaktor2.ist / (basisMengeG * beiFaktor2.faktorBeiEingabe);
                              return nah(prozent1, 0.65) && nah(prozent1, prozent2);
                            })()],
    // ---- AP-0304 Metadaten-Ausklapper (B5) — Testblock (4 Fälle) ----
    // AP-0201 §1: alle Metadatenbloecke sind standardmaessig ZU. Nur ein ausdruecklich
    // gemerkter Zustand klappt einen Block wieder auf.
    (() => {
      const vorher = Layout.meta;
      Layout.meta = {};
      const zuOhneZustand = Layout.metaOffen("naehrwerte") === false && Layout.metaOffen("gibtsnicht") === false;
      Layout.meta = { naehrwerte:true, kosten:false };
      const gemerkt = Layout.metaOffen("naehrwerte") === true && Layout.metaOffen("kosten") === false;
      Layout.meta = vorher;
      return ["AP0304-1 Metadatenblock ohne gemerkten Zustand ist zu, gemerkter Zustand gilt",
        zuOhneZustand && gemerkt];
    })(),
    // Abnahmekriterium 2: der Druckpfad muss die Phasen UND jeden Metadatenblock erfassen.
    ["AP0304-2 Druck klappt Phasen und Metadatenblöcke auf (ein Selektor, eine Stelle)",
                            View.DRUCK_AUFKLAPPEN.includes("details.phase")

    (() => {
      const vorherMeta = Layout.meta, vorherDruck = View.druckLaeuft, vorherPhasen = Store.offenePhasen;
      Layout.meta = {}; Store.offenePhasen = new Set();

      View.druckLaeuft = true;  View.metablockToggle(mb); View.phaseToggle(ph);

      Layout.meta = vorherMeta; View.druckLaeuft = vorherDruck; Store.offenePhasen = vorherPhasen;
      Settings.set("metablock", Layout.meta);
      return ["AP0304-3 Aufklappen für den Druck wird nicht gemerkt, ein echter Klick schon",

    })(),
    // Die Spalte "Verfahren" (AP-0306 dieses Sprints) speist den Block "Verfahren & Protokoll".
    // Fehlt die Spalte oder ist die Zelle leer (RZP-048/079/080), bleibt verfahren null.
    (() => {
      const header = ["Rezept-ID","Name","Kategorie","Unterkategorie","Basis-Rohstoff","Basis-Menge (g)",
        "Sollgewicht (g)","Portionen","Einheit","Quelle","Phasen (JSON)","Backprotokoll (JSON)",
        "Entwicklung (JSON)","Verfahren","Protokoll (JSON)"];
      const zeile = v => ["RZP-T","Test","Backen",null,"Mehl",1000,1000,1,"Stk",null,"[]","[]",null,v,null];
      const mit   = Model.parseRezepte([header, zeile("Räuchern")]).rezepte[0];

        mit.verfahren === "Räuchern" && leer.verfahren === null && ohne.verfahren === null];
    })(),
    // ---- AP-0305 Zutaten-Editor — Testblock (Validierung, Vorschau, Schreibpfad) ----
    // V-1: Menge <= 0 weist ab, nennt Feld "Menge" (AP-0203 §2).
    (() => {
      const rzB = { basisName:"Mehl", basisMengeG:1000, sollgewichtG:1000 };
      const phasen = [{ name:"P", zutaten:[{name:"Mehl",prozent:0,einheit:"g"}], schritte:[] }];
      const p = Editor.pruefen(phasen, rzB);
      return ["AP0305-3 V-1 Menge ≤ 0 weist ab (Feld „Menge“)",
        p.ok === false && p.abweisen.some(f => f.feld === "Menge")];
    })(),
    // V-2: wird die Zutat entfernt, die dem Basis-Rohstoff entspricht, weist die Prüfung ab —
    // ohne sie ist kein Bäckerprozent rechenbar (Feld/Menge/Einheit bleiben in diesem AP editierbar,
    // basisName selbst nicht — die Regel schützt ihn vor dem Verwaisen).
    (() => {
      const rzB = { basisName:"Mehl", basisMengeG:1000, sollgewichtG:1000 };
      const phasen = [{ name:"P", zutaten:[{name:"Wasser",prozent:0.5,einheit:"g"}], schritte:[] }];
      const p = Editor.pruefen(phasen, rzB);
      return ["AP0305-4 V-2 fehlender Basis-Rohstoff unter den Zutaten weist ab",
        p.ok === false && p.abweisen.some(f => f.feld === "Basis-Rohstoff")];
    })(),
    // V-3: unaufgelöste Rohstoffe warnen, blockieren aber nicht — greift gegen Store.rohstoffe.
    (() => {
      const alt = Store.rohstoffe;
      Store.rohstoffe = BEISPIEL_ROHSTOFFE;
      const rzB = { basisName:"Glutamat", basisMengeG:1000, sollgewichtG:1000 };
      const phasen = [{ name:"P", zutaten:[{name:"Glutamat",prozent:0.01,einheit:"g"}], schritte:[] }];
      const p = Editor.pruefen(phasen, rzB);
      Store.rohstoffe = alt;
      return ["AP0305-5 V-3 unbekannter Rohstoff warnt, weist nicht ab",
        p.ok === true && p.warnen.some(f => f.feld === "Zutat" && /Glutamat/.test(f.grund))];
    })(),
    // V-4: doppelte Zutat in derselben Phase warnt mit Aktion "zusammenfassen"; Editor.zusammenfassen
    // addiert die Mengen und entfernt die Doppelzeile — Original-Array bleibt unangetastet (Kopie).
    (() => {
      const alt = Store.rohstoffe;
      Store.rohstoffe = BEISPIEL_ROHSTOFFE;
      const rzB = { basisName:"Wasser", basisMengeG:1000, sollgewichtG:1000 };
      const phasen = [{ name:"Teig", zutaten:[
        {name:"Wasser",prozent:0.30,einheit:"g"}, {name:"Wasser",prozent:0.20,einheit:"g"}], schritte:[] }];
      const p = Editor.pruefen(phasen, rzB);
      const warnung = p.warnen.find(f => f.nameKey === "wasser");
      const zusammengefasst = Editor.zusammenfassen(phasen, 0, "wasser");
      Store.rohstoffe = alt;
      return ["AP0305-6 V-4 doppelte Zutat je Phase warnt, Zusammenfassen addiert und dedupliziert",
        !!warnung && warnung.phaseIndex === 0
          && phasen[0].zutaten.length === 2   // Original unveraendert (Kopie in zusammenfassen())
          && zusammengefasst[0].zutaten.length === 1
          && nah(zusammengefasst[0].zutaten[0].prozent, 0.50)];
    })(),
    // V-7: leerer Zubereitungsschritt-Text weist ab statt still zu verschwinden.
    ["AP0305-7 V-7 leerer Schritt-Text weist ab (Feld „Zubereitungsschritt“)",
                            (() => {
                              const rzB = { basisName:"Mehl", basisMengeG:1000, sollgewichtG:1000 };
                              const phasen = [{ name:"P", zutaten:[{name:"Mehl",prozent:1,einheit:"g"}], schritte:[{nr:1,text:"  "}] }];
                              const p = Editor.pruefen(Editor.normalisiert(phasen), rzB);
                              return p.ok === false && p.abweisen.some(f => f.feld === "Zubereitungsschritt");
                            })()],
    // V-11: eine Zelle über dem Excel-Limit (32'767 Zeichen) weist ab, statt die Datei beim
    // Schreiben abzuschneiden.
    ["AP0305-8 V-11 überlange Phasen (JSON)-Zelle weist ab",
                            (() => {
                              const rzB = { basisName:"Mehl", basisMengeG:1000, sollgewichtG:1000 };
                              const phasen = [{ name:"P", zutaten:[
                                {name:"Mehl",prozent:1,einheit:"g"},
                                {name:"X".repeat(33000),prozent:0.1,einheit:"g"}], schritte:[] }];
                              const p = Editor.pruefen(phasen, rzB);
                              return p.ok === false && p.abweisen.some(f => f.feld === "Phasen (JSON)");
                            })()],
    // §3 Schritt 2 (Vorschau): Editor.diff zaehlt hinzugefuegte/entfernte/geaenderte Zutaten und
    // Schritte positional je Phase — Grundlage der "n Änderungen"-Anzeige.
    ["AP0305-9 Editor.diff zaehlt hinzugefuegt/entfernt/geaendert korrekt",
                            (() => {
                              const original = [{ name:"P", zutaten:[
                                {name:"Mehl",prozent:0.700,einheit:"g"}, {name:"Zucker",prozent:0.100,einheit:"g"}],
                                schritte:[{nr:1,text:"Mischen"}] }];
                              const entwurf = [{ name:"P", zutaten:[
                                {name:"Mehl",prozent:0.750,einheit:"g"}, {name:"Salz",prozent:0.020,einheit:"g"}],
                                schritte:[{nr:1,text:"Mischen"},{nr:2,text:"Ruhen lassen"}] }];
                              const d = Editor.diff(original, entwurf);
                              return d.anzahl === 3;   // Mehl geaendert, Zucker->Salz geaendert, Schritt hinzugefuegt
                            })()],
    // ---- AP-0305 Schreibpfad — drei Zweige mit gemockter Graph-Schicht (Umsetzungsschritt 5) ----
    // Zweig 1: gleicher eTag — Backup UND beide Zell-Updates finden statt (Kernzelle + "Geändert").
    ["AP0305-10 Schreibpfad, gleicher eTag: Backup und beide Zell-Updates finden statt",
                            ergGleich.ergebnis === "ok"
                              && gwGleich.log.includes("backup")
                              && gwGleich.log.includes("updateCell:" + addrPhasen)
                              && gwGleich.log.includes("updateCell:" + addrGeaendert)
                              && gwGleich.log.filter(x => x === "getItemMeta").length === 2],
    // Zweig 2: fremder eTag — Abbruch direkt nach der Pruefung, WEDER Backup NOCH ein
    // Zell-Update finden statt (Abnahmekriterium 2 des AP).
    ["AP0305-11 Schreibpfad, fremder eTag: kein Backup, kein Data.updateCell",
                            ergFremd.ergebnis === "konflikt"
                              && gwFremd.log.length === 1 && gwFremd.log[0] === "getItemMeta"
                              && !gwFremd.log.includes("backup")
                              && !gwFremd.log.some(x => x.startsWith("updateCell"))],
    // Zweig 3: Schreibfehler mittendrin — Backup gelingt, die Kernzelle schlaegt fehl; das
    // Nebenfeld "Geändert" wird danach gar nicht erst versucht (Kernzelle zuerst, §3 Grundsatz).
    ["AP0305-12 Schreibpfad, Fehler an der Kernzelle: Backup gelingt, „Geändert“ wird nicht versucht",
                            ergFehler.ergebnis === "fehler" && ergFehler.stufe === "phasen"
                              && gwFehler.log.includes("backup")
                              && gwFehler.log.includes("updateCell:" + addrPhasen)
                              && !gwFehler.log.includes("updateCell:" + addrGeaendert)]
  ];
  const fehler = t.filter(x => !x[1]).map(x => x[0]);
  return { anzahl:t.length, fehler };
}

// AP-0305/AP-0203 §3 Schritt 4-7 — reiner Schreibkern des Zutaten-Editors, ohne Store/DOM/
// msalApp: "gateway" traegt nur die drei Graph-Aufrufe (getItemMeta/backup/updateCell), damit
// der Selbsttest sie durch eine gemockte Schicht ersetzen kann (Umsetzungsschritt 5: "gleicher
// eTag, fremder eTag, Schreibfehler mittendrin", je Zweig belegt durch die tatsaechlich
// erfolgten Aufrufe — der Mock im Selbsttest fuehrt dazu selbst Buch, siehe "gateway.log").
// App.zutatenEditorSpeichern() (unten) ruft dies mit der echten Data-Schicht auf und deckt
// Schritt 1-3 (Pruefen/Vorschau/Voraussetzungen) sowie Schritt 8 (Abschluss, Store/View) ab.
async function editorSchreiben(gateway, { rezeptePfad, sheetName, header, zeileExcel, aktuellerETag, normPhasen }){
  let meta;
  try{ meta = await gateway.getItemMeta(rezeptePfad); }
  catch(e){ return { ergebnis:"fehler", stufe:"eTag", meldung: e.message }; }

  // Schritt 4: fremder eTag -> Abbruch VOR jedem Schreiben, kein Backup, kein Data.updateCell.
  if(aktuellerETag && meta.eTag !== aktuellerETag) return { ergebnis:"konflikt" };

  // Schritt 5: Backup — scheitert es, wird nichts geschrieben.
  try{ await gateway.backup(rezeptePfad); }
  catch(e){ return { ergebnis:"fehler", stufe:"backup", meldung: e.message }; }

  // Schritt 6a: Kernzelle "Phasen (JSON)" zuerst — scheitert sie, ist nichts halb geschrieben.
  const addrPhasen = Model.zelladresse(header, "Phasen (JSON)", zeileExcel);
  if(!addrPhasen) return { ergebnis:"fehler", stufe:"phasen", meldung:'Spalte "Phasen (JSON)" fehlt in Rezepte.xlsx' };
  try{ await gateway.updateCell(rezeptePfad, sheetName, addrPhasen, JSON.stringify(normPhasen)); }
  catch(e){ return { ergebnis:"fehler", stufe:"phasen", meldung: e.message }; }

  // Schritt 6c: Komfortspalte "Geändert" — nicht fatal, nur meldepflichtig.
  let nebenfehler = false;
  const addrGeaendert = Model.zelladresse(header, "Geändert", zeileExcel);
  if(addrGeaendert){
    try{ await gateway.updateCell(rezeptePfad, sheetName, addrGeaendert, new Date().toISOString().slice(0,10)); }
    catch(e){ nebenfehler = true; }
  }

  // Schritt 7: eTag neu lesen; scheitert das, faellt die naechste Pruefung auf §4.3 zurueck.
  let neuerETag = null;
  try{ neuerETag = (await gateway.getItemMeta(rezeptePfad)).eTag; }catch(e){ neuerETag = null; }

  return { ergebnis:"ok", neuerETag, nebenfehler };
}

/* ---------- App --------------------------------------------------------- */
const App = {
  async start(){
    Layout.init();
    Store.rohstoffe = BEISPIEL_ROHSTOFFE;
    Store.rezepte   = Model.aufloesen(BEISPIEL_REZEPTE, BEISPIEL_ROHSTOFFE);

    View.kategorienFuellen();
    View.liste();

    el("#suche").addEventListener("input", e => { Store.suchtext = e.target.value; View.liste(); });
    el("#kategorie").addEventListener("change", e => { Store.kategorie = e.target.value; View.liste(); });
    el("#btnLogin").addEventListener("click", App.loginKlick);
    el("#btnAltDB").addEventListener("click", App.altDBKlick);
    el("#btnImport").addEventListener("click", App.importOeffnen);
    el("#btnExportAlle").addEventListener("click", App.exportAlle);

    // AP-0306: nach dem Druckdialog die Phasen wieder in den Zustand vor dem Drucken bringen.
    // Einmalig am window registriert (nicht in View.rezept(), das bei jedem Rendern neu
    // aufgerufen wird) — sonst haeuften sich bei jedem Rezeptwechsel weitere Listener an.
    window.addEventListener("afterprint", () => { if(Store.aktuellesRezept) View.rezept(); });

    // AP-0305: selfTest() ist seit diesem AP async — die drei gemockten Schreibpfad-Zweige
    // (Umsetzungsschritt 5) brauchen echte awaits. App.start() selbst wird ohne await
    // aufgerufen (DOMContentLoaded-Handler unten), das ist unveraendert unkritisch.
    const st = await selfTest();
    el("#selftest").textContent = st.fehler.length
      ? ` · Selbsttest: ${st.fehler.length} von ${st.anzahl} fehlgeschlagen (${st.fehler.join(", ")})`
      : ` · Selbsttest: ${st.anzahl}/${st.anzahl} ok`;
    if(st.fehler.length) View.meldung("Fehlgeschlagen: " + st.fehler.join(", "), "err", "Selbsttest des Rechenkerns");

    App.initDaten();
  },

  // US-A1 / Feinkonzept §5.2: file:// bricht vor jeder MSAL-Initialisierung ab.
  // Sonst: Konfiguration laden, MSAL aufbauen, bei bereits bekanntem Konto
  // still anmelden und laden (nie ungefragt, siehe §5.4).
  async initDaten(){
    // redirectUri = diese Seite selbst (ADR AP-0201/§8). Microsoft lädt darum
    // beim Popup-Login dieselbe App-Seite kurz INNERHALB des Popups, um die
    // Antwort zu übergeben. Läuft hier ein zweiter App-Start und der versucht
    // (z.B. über Data.token()) selbst einen Popup zu öffnen, meldet MSAL
    // block_nested_popups. Das öffnende Fenster wertet die Antwort per Polling
    // aus — im Popup selbst ist nichts zu tun, darum hier abbrechen.
    if(window.opener && window.opener !== window) return;
    if(location.protocol === "file:"){
      View.meldung("Diese App braucht eine Web-Adresse (https), weil der Microsoft-Login sonst nicht funktioniert. "
        + "Mit Beispieldaten läuft sie hier trotzdem — für echte Daten über die GitHub-Pages-URL öffnen.",
        "warn", "Als Datei geöffnet");
      return;
    }
    await ladeConfig();
    if(!CONFIG.clientId) return;   // keine Anmeldung möglich, Beispieldaten bleiben nutzbar
    try{
      const konto = await Data.init();
      if(konto) await App.datenLaden(konto);
    }catch(e){
      View.meldung("Anmeldung konnte nicht initialisiert werden: " + e.message, "err", "Fehler beim Start");
    }
  },

  async loginKlick(){
    if(!Data.verfuegbar()){ View.meldung("Konfiguration fehlt — clientId nicht gesetzt.", "err", "Anmeldung nicht möglich"); return; }
    try{
      const konto = await Data.login();
      if(konto) await App.datenLaden(konto);   // Popup-Pfad (Desktop); iPad navigiert per Redirect weg
    }catch(e){
      View.meldung("Anmeldung fehlgeschlagen: " + e.message, "err", "Login");
    }
  },

  async datenLaden(konto){
    el("#btnLogin").textContent = "Abmelden (" + (konto.username || konto.name || "Konto") + ")";
    el("#btnLogin").onclick = () => Data.logout();
    try{
      const { rohstoffe, rezepte, fehlerhaft, geladeneAliase, rezWb, rezSheetName, rohWb, rohSheetName } = await loadWorkbooks();
      // Aliase aus dem Blatt «Aliase» (AP-0315) ueberschreiben etwaige veraltete
      // localStorage-Eintraege — sie sind geraeteuebergreifend die aktuellere Quelle.
      CONFIG.aliase = Object.assign({}, CONFIG.aliase, geladeneAliase);
      Store.rohstoffe = rohstoffe;
      Store.rezepte = Model.aufloesen(rezepte, rohstoffe);
      Store.rezepteFehlerhaft = fehlerhaft;
      Store.rezepteWorkbook = rezWb; Store.rezepteSheetName = rezSheetName;
      Store.rohstoffeWorkbook = rohWb; Store.rohstoffeSheetName = rohSheetName;
      // AP-0305: Basis-eTag fuer die Konflikterkennung vor dem naechsten Schreiben.
      // Schlaegt der Metadaten-Abruf fehl, bleibt die Pruefung beim Speichern einfach aus
      // (kein falscher Konflikt-Alarm) statt den Ladevorgang selbst scheitern zu lassen.
      try{ Store.rezepteETag = (await Data.getItemMeta(CONFIG.rezeptePfad)).eTag; }
      catch(e){ Store.rezepteETag = null; }
      try{ Store.rohstoffeETag = (await Data.getItemMeta(CONFIG.rohstoffePfad)).eTag; }
      catch(e){ Store.rohstoffeETag = null; }
      el("#modus").textContent = "OneDrive — " + Store.rezepte.length + " Rezepte";
      View.kategorienFuellen();
      View.liste();
      if(fehlerhaft.length){
        View.meldung(fehlerhaft.length + " Rezept(e) mit ungültigem JSON übersprungen — in der Liste markiert, restliche Rezepte geladen.",
          "warn", "Teilweise geladen");
      }else{
        View.meldung("Rezepte und Rohstoffe aus OneDrive geladen.", "ok");
      }
    }catch(e){
      View.meldung("Laden fehlgeschlagen: " + e.message, "err", "Fehler beim Laden");
    }
  },

  // AP-0302 Schritt 3 / Lastenheft F1: alternativer OneDrive-Pfad statt der
  // Standard-Datenbank. Pfade werden pro Nutzer in localStorage gemerkt (§5.4).
  async altDBKlick(){
    const rez = prompt("Pfad zur Rezepte.xlsx (ab OneDrive-Wurzel, z. B. /Küche/Rezepte.xlsx):", CONFIG.rezeptePfad || "");
    if(rez == null || !rez.trim()) return;
    const roh = prompt("Pfad zur Rohstoffe.xlsx:", CONFIG.rohstoffePfad || "");
    if(roh == null || !roh.trim()) return;
    CONFIG.rezeptePfad = rez.trim();
    CONFIG.rohstoffePfad = roh.trim();
    Settings.set("rezeptePfad", CONFIG.rezeptePfad);
    Settings.set("rohstoffePfad", CONFIG.rohstoffePfad);
    if(!Data.verfuegbar()){ View.meldung("Pfade gespeichert. Zum Laden zuerst anmelden.", "ok", "Andere Datenbank"); return; }
    const konto = msalApp.getActiveAccount();
    if(!konto){ await App.loginKlick(); return; }
    await App.datenLaden(konto);
  },

  rezeptOeffnen(id){
    Store.aktuellesRezept = Store.rezepte.find(r => r.id === id) || null;
    Store.faktor = 1;
    Store.offenePhasen = new Set([0]);
    // AP-0313: Referenzen gehören zum verglichenen Rezept — beim Wechsel zurücksetzen, sonst
    // stünden im nächsten Rezept die Vergleichsspalten des vorigen.
    Store.referenzIds = [];
    Store.devForm = null;
    // AP-0303: die Korrekturablage selbst bleibt unter ihrer rezeptId liegen (AP-0201 §3.4,
    // Abnahmekriterium 3) — nur der Uebernahme-Bestaetigungsdialog ist ein Formular ueber dem
    // vorherigen Rezept und muss beim Wechsel zu.
    Store.korrekturUebernehmenOffen = false;
    // AP-0305: ein Editor-Entwurf gehoert zum vorherigen Rezept und muss beim Wechsel zu —
    // der Entwurf selbst bleibt aber in Entwurf (localStorage), bis er geladen oder verworfen
    // wird (§4.4), genau wie Korrekturen.alle oben.
    Store.zutatenEditor = null;
    View.rezept();
    window.scrollTo({top:0, behavior:"smooth"});
  },

  skalieren(f){
    const aktiv = document.activeElement;
    const id = aktiv && aktiv.id, pos = aktiv && aktiv.selectionStart;
    Store.faktor = f;
    View.rezept();
    if(id){
      const neu = document.getElementById(id);
      if(neu){ neu.focus(); try{ neu.setSelectionRange(pos,pos); }catch(e){} }
    }
  },

  schliessen(){ Store.aktuellesRezept = null; Store.korrekturUebernehmenOffen = false; View.rezept(); },

  /* ---------- Korrekturen (AP-0303, B4) -------------------------------------
     Kochkorrekturen wirken sofort und ohne Bestaetigung (AP-0203 §6.2) — nur der letzte
     Schritt, "Ins Rezept übernehmen", schreibt nach Rezepte.xlsx, und der braucht immer
     erst die Bestaetigung aus View.korrekturUebernehmenVorschau(). */
  korrekturSetzen(rezeptId, key, wert){
    if(!(wert > 0)) return;
    const rz = Store.aktuellesRezept;
    if(!rz || rz.id !== rezeptId) return;
    const [i, j] = key.split("/").map(Number);
    const z = rz.phasen[i] && rz.phasen[i].zutaten[j];
    if(!z) return;
    const kx = Korrekturen.get(rezeptId);
    // AP-0201 §3.1: sollBeiEingabe/faktorBeiEingabe sind der feste Bezugspunkt, ueber den
    // jede spaetere Skalierung nachgefuehrt wird (Calc.korrekturAktuell) — "ist" selbst
    // wird nie mutiert, deshalb ueberschreibt ein erneutes Eintippen den ganzen Eintrag.
    kx.zutaten[key] = {
      ist: wert, einheit: z.einheit,
      sollBeiEingabe: Calc.mengeG(z, rz.basisMengeG, Store.faktor),
      faktorBeiEingabe: Store.faktor,
      ts: new Date().toISOString()
    };
    Korrekturen.speichern();
    View.rezept();
    View.liste(); // AP-0201 §3.4: Punktmarkierung offener Korrekturen in der Navigation
  },

  korrekturLoeschen(rezeptId, key){
    const kx = Korrekturen.get(rezeptId);
    delete kx.zutaten[key];
    Korrekturen.speichern();
    View.rezept();
    View.liste();
  },

  // AP-0201 §3.5: "Löschen nur ausdrücklich, je Rezept, mit Rückfrage."
  korrekturenVerwerfen(rezeptId){
    const kx = Korrekturen.get(rezeptId);
    if(!Object.keys(kx.zutaten).length && !kx.notiz.trim()) return;
    if(!confirm("Alle Korrekturen und die Notiz dieses Rezepts verwerfen? Das lässt sich nicht rückgängig machen.")) return;
    kx.zutaten = {}; kx.notiz = "";
    Korrekturen.speichern();
    View.rezept();
    View.liste();
  },

  // AP-0203 §6.3 "Ins Rezept übernehmen", auf den schmalen Fall zugeschnitten: nur die
  // korrigierten Zutaten wandern in "Phasen (JSON)", der volle Kopffeld-Editor ist AP-0305.
  // Baut auf dem Schreibvorgang aus App.entwBefoerdernBestaetigt auf (§3 Schreibvorgang):
  // Verbindung pruefen -> eTag-Konflikt pruefen -> Backup -> Zell-Update -> eTag neu lesen,
  // bei jedem Fehler rollt rz.phasen vollstaendig zurueck.
  async korrekturenUebernehmenBestaetigt(){
    const rz = Store.aktuellesRezept;
    if(!rz) return;
    const kx = Korrekturen.get(rz.id);
    const keys = Object.keys(kx.zutaten);
    if(!keys.length) return;

    const altePhasen = rz.phasen;
    const neuePhasen = rz.phasen.map(p => ({ ...p, zutaten: p.zutaten.map(z => ({ ...z })) }));
    keys.forEach(key => {
      const [i, j] = key.split("/").map(Number);
      const z = neuePhasen[i] && neuePhasen[i].zutaten[j];
      if(!z) return;
      const kk = kx.zutaten[key];
      // Skaleninvariant: ist/(basisMengeG*faktorBeiEingabe) ist dasselbe Verhaeltnis wie
      // korrekturAktuell(kk,faktor)/(basisMengeG*faktor) fuer jedes faktor — der Faktor
      // kuerzt sich heraus, es braucht keine Umrechnung ueber den aktuellen Store.faktor.
      z.prozent = kk.ist / (rz.basisMengeG * kk.faktorBeiEingabe);
    });
    rz.phasen = neuePhasen;
    Model.aufloesen([rz], Store.rohstoffe);

    const verbunden = Store.rezepteWorkbook && Data.verfuegbar() && msalApp.getActiveAccount();
    if(!verbunden){
      rz.phasen = altePhasen; Model.aufloesen([rz], Store.rohstoffe);
      Store.korrekturUebernehmenOffen = false;
      View.meldung("Übernahme braucht eine OneDrive-Verbindung — ohne sie bleibt nichts dauerhaft gespeichert, "
        + "die Korrekturen bleiben unverändert stehen.", "warn", "Nicht übernommen");
      View.rezept();
      return;
    }
    if(!rz._raw){
      rz.phasen = altePhasen; Model.aufloesen([rz], Store.rohstoffe);
      View.meldung("Zeilenposition dieses Rezepts ist unbekannt (frisch importiert, noch nicht neu geladen). "
        + "Seite neu laden und erneut versuchen.", "err", "Übernahme nicht möglich");
      return;
    }
    try{
      if(Store.rezepteETag){
        const meta = await Data.getItemMeta(CONFIG.rezeptePfad);
        if(meta.eTag !== Store.rezepteETag){
          rz.phasen = altePhasen; Model.aufloesen([rz], Store.rohstoffe);
          Store.korrekturUebernehmenOffen = false;
          View.meldung("Rezepte.xlsx wurde zwischenzeitlich extern geändert — Bestand wird neu geladen. "
            + "Bitte erneut übernehmen.", "warn", "Konflikt erkannt");
          const konto = msalApp.getActiveAccount();
          await App.datenLaden(konto);
          App.rezeptOeffnen(rz.id);
          return;
        }
      }
      await Data.backup(CONFIG.rezeptePfad);
      const header = rz._raw.spalten, zeileExcel = rz._raw.zeile + 1;
      const iPhasen = header.indexOf("Phasen (JSON)");
      if(iPhasen === -1) throw new Error('Spalte "Phasen (JSON)" fehlt in Rezepte.xlsx');
      await Data.updateCell(CONFIG.rezeptePfad, Store.rezepteSheetName,
        Model.zelladresse(header, "Phasen (JSON)", zeileExcel), JSON.stringify(Import.phasenExport(rz.phasen)));
      try{ Store.rezepteETag = (await Data.getItemMeta(CONFIG.rezeptePfad)).eTag; }
      catch(e){ Store.rezepteETag = null; }

      // AP-0201 §3.5/§6.4: nie loeschen — die uebernommenen Korrekturen wandern archiviert.
      kx.uebernommen = [...(kx.uebernommen || []), { ts: new Date().toISOString(), ziel: "Rezept", werte: kx.zutaten }];
      kx.zutaten = {};
      Korrekturen.speichern();
      Store.korrekturUebernehmenOffen = false;
      View.meldung(keys.length + " Korrektur(en) ins Rezept übernommen, Backup angelegt.", "ok", "Übernommen");
      View.rezept();
      View.liste();
    }catch(e){
      rz.phasen = altePhasen; Model.aufloesen([rz], Store.rohstoffe);
      View.meldung("Übernahme fehlgeschlagen: " + e.message + " — Rezept in OneDrive nicht verändert.", "err", "Fehler beim Speichern");
      View.rezept();
    }
  },

  /* ---------- Backprotokoll (AP-0305) --------------------------------------
     Ablauf: Formular oeffnen -> pruefen -> (Beispieldaten: nur im Speicher | OneDrive:
     Konflikt pruefen -> Backup -> gezielte Zell-Updates via Data.updateCell). Nie blind
     ueberschreiben (Entscheid O-9): eTag-Abgleich vor jedem Schreiben, siehe Data.getItemMeta. */
  backEintragOeffnen(){
    const rz = Store.aktuellesRezept;
    if(!rz) return;
    Store.backEintrag = {
      datum: new Date().toISOString().slice(0, 10),
      soll: Math.round(rz.sollgewichtG * Store.faktor),
      ist: "",
      notizen: ""
    };
    View.rezept();
    el("#beIst") && el("#beIst").focus();
  },

  async backEintragSpeichern(){
    const rz = Store.aktuellesRezept, eingabe = Store.backEintrag;
    if(!rz || !eingabe) return;
    const datum = (eingabe.datum || "").trim();
    const soll = Number(eingabe.soll), ist = Number(eingabe.ist);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(datum)){ View.meldung("Datum fehlt oder ungültig.", "err", "Eintrag unvollständig"); return; }
    if(!(soll > 0)){ View.meldung("Soll (g) muss grösser als 0 sein.", "err", "Eintrag unvollständig"); return; }
    if(!(ist > 0)){ View.meldung("Ist (g) muss grösser als 0 sein.", "err", "Eintrag unvollständig"); return; }
    const neuerEintrag = { datum, sollG: soll, istG: ist, notizen: (eingabe.notizen || "").trim() || null };
    await App.backprotokollSpeichern(rz, neuerEintrag);
  },

  // Schreibt den Eintrag in Store (sofort sichtbar) und, falls eine OneDrive-Verbindung
  // besteht, zurueck nach Rezepte.xlsx. Bei jedem Fehlschlag (Konflikt, Netzfehler) wird
  // der Store-Eintrag zurueckgenommen — nie ein Erfolg vortaeuschen, den OneDrive nicht hat.
  async backprotokollSpeichern(rz, eintrag){
    rz.backprotokoll = [...rz.backprotokoll, eintrag];
    const verbunden = Store.rezepteWorkbook && Data.verfuegbar() && msalApp.getActiveAccount();
    if(!verbunden){
      Store.backEintrag = null;
      View.meldung("Eintrag erfasst — nur in dieser Sitzung, keine OneDrive-Verbindung.", "warn", "Nicht dauerhaft gespeichert");
      View.rezept();
      return;
    }
    if(!rz._raw){
      rz.backprotokoll = rz.backprotokoll.slice(0, -1);
      View.meldung("Zeilenposition dieses Rezepts ist unbekannt (frisch importiert, noch nicht neu geladen). "
        + "Seite neu laden und erneut versuchen.", "err", "Speichern nicht möglich");
      return;
    }
    try{
      if(Store.rezepteETag){
        const meta = await Data.getItemMeta(CONFIG.rezeptePfad);
        if(meta.eTag !== Store.rezepteETag){
          rz.backprotokoll = rz.backprotokoll.slice(0, -1);
          Store.backEintrag = null;
          View.meldung("Rezepte.xlsx wurde zwischenzeitlich extern geändert — Bestand wird neu geladen. "
            + "Eintrag bitte erneut erfassen.", "warn", "Konflikt erkannt");
          const konto = msalApp.getActiveAccount();
          await App.datenLaden(konto);
          App.rezeptOeffnen(rz.id);
          return;
        }
      }
      await Data.backup(CONFIG.rezeptePfad);
      const header = rz._raw.spalten, zeileExcel = rz._raw.zeile + 1;
      const iBack = header.indexOf("Backprotokoll (JSON)");
      if(iBack === -1) throw new Error('Spalte "Backprotokoll (JSON)" fehlt in Rezepte.xlsx');
      await Data.updateCell(CONFIG.rezeptePfad, Store.rezepteSheetName,
        Model.zelladresse(header, "Backprotokoll (JSON)", zeileExcel), JSON.stringify(rz.backprotokoll));
      // Schwund (%) und Geändert sind reine Komfortspalten fuer die direkte Excel-Ansicht —
      // die App selbst berechnet Schwund immer live aus dem Backprotokoll (Calc.schwundAktuell).
      // Ein Fehlschlag hier ist darum nicht fatal, nur meldepflichtig (Abnahmekriterium 1).
      const heute = new Date().toISOString().slice(0, 10);
      const schwund = Calc.schwundAktuell(rz.backprotokoll);
      const nebenfelder = [["Schwund (%)", schwund == null ? 0 : Math.round(schwund * 100)], ["Geändert", heute]];
      const nebenfehler = [];
      for(const [spalte, wert] of nebenfelder){
        const addr = Model.zelladresse(header, spalte, zeileExcel);
        if(!addr) continue;
        try{ await Data.updateCell(CONFIG.rezeptePfad, Store.rezepteSheetName, addr, wert); }
        catch(e){ nebenfehler.push(spalte); }
      }
      try{ Store.rezepteETag = (await Data.getItemMeta(CONFIG.rezeptePfad)).eTag; }
      catch(e){ Store.rezepteETag = null; }
      Store.backEintrag = null;
      View.meldung("Backprotokoll-Eintrag gespeichert, Backup in " + (CONFIG.backupOrdner || "/Backups") + " angelegt."
        + (nebenfehler.length ? " Hinweis: Spalte(n) " + nebenfehler.join(", ") + " konnten nicht mitaktualisiert werden — Backprotokoll selbst ist gespeichert." : ""),
        nebenfehler.length ? "warn" : "ok", "Gespeichert");
      View.rezept();
    }catch(e){
      rz.backprotokoll = rz.backprotokoll.slice(0, -1);
      View.meldung("Speichern fehlgeschlagen: " + e.message + " — Backprotokoll in OneDrive nicht verändert.", "err", "Fehler beim Speichern");
      View.rezept();
    }
  },

  /* ---------- Zutaten-Editor (AP-0305) -------------------------------------
     Ersetzt das rohe JSON-Textfeld des Entwicklungsmodus fuer den produktiven Feldumfang
     Zutat/Menge/Einheit/Bäckerprozent/Zubereitungsschritte (AP-0203 §1, Umsetzungsschritt 1).
     Ablauf wie beschrieben in AP-0203 §3: Pruefen (Editor.pruefen, laeuft bei jedem Rendern) ->
     Vorschau (ein Klick auf "Speichern" zeigt sie, erst "Jetzt speichern" schreibt) ->
     Voraussetzungen -> eTag -> Backup -> Zell-Updates (editorSchreiben) -> eTag neu lesen ->
     Abschluss. Konflikt siehe App.zutatenEditorKonfliktOeffnen() (§4). */
  zutatenEditorOeffnen(){
    const rz = Store.aktuellesRezept;
    if(!rz) return;
    Store.zutatenEditor = {
      rezeptId: rz.id,
      phasen: rz.phasen.map(ph => ({
        name: ph.name,
        zutaten: (ph.zutaten || []).map(z => ({ name: z.name, prozent: z.prozent, einheit: z.einheit })),
        schritte: (ph.schritte || []).map(s => ({ nr: s.nr, text: s.text }))
      })),
      vorschauBestaetigt: false,
      konflikt: null
    };
    View.rezept();
  },

  zutatenEditorAbbrechen(){
    Store.zutatenEditor = null;
    View.rezept();
  },

  // feld ist eines von "name"/"einheit"/"menge"/"prozent" — menge und prozent schreiben
  // beide in dieselbe interne Groesse z.prozent (AP-0203 §1.4: "gespeichert wird der Faktor
  // menge ÷ basisMengeG"), damit die jeweils andere Anzeige beim naechsten Rendern nachzieht.
  zutatenEditorZutatFeld(pi, zi, feld, wert){
    const ed = Store.zutatenEditor, rz = Store.aktuellesRezept;
    const z = ed && ed.phasen[pi] && ed.phasen[pi].zutaten[zi];
    if(!z) return;
    if(feld === "name") z.name = wert;
    else if(feld === "einheit") z.einheit = wert;
    else if(feld === "menge"){
      const g = Number(wert);
      z.prozent = (wert !== "" && isFinite(g) && rz.basisMengeG > 0) ? g / rz.basisMengeG : "";
    }else if(feld === "prozent"){
      const p = Number(wert);
      z.prozent = (wert !== "" && isFinite(p)) ? p / 100 : "";
    }
    ed.vorschauBestaetigt = false;
    View.rezept();
  },

  zutatenEditorZutatHinzufuegen(pi){
    const ed = Store.zutatenEditor;
    if(!ed || !ed.phasen[pi]) return;
    ed.phasen[pi].zutaten.push({ name:"", prozent:"", einheit:"g" });
    ed.vorschauBestaetigt = false;
    View.rezept();
  },

  zutatenEditorZutatEntfernen(pi, zi){
    const ed = Store.zutatenEditor;
    if(!ed || !ed.phasen[pi]) return;
    ed.phasen[pi].zutaten.splice(zi, 1);
    ed.vorschauBestaetigt = false;
    View.rezept();
  },

  // Aktion zur V-4-Warnung: mehrfach vorkommende Zutat derselben Phase zusammenfassen (Mengen
  // addiert) statt sie einzeln loeschen zu muessen.
  zutatenEditorZusammenfassen(pi, nameKey){
    const ed = Store.zutatenEditor;
    if(!ed) return;
    ed.phasen = Editor.zusammenfassen(ed.phasen, pi, nameKey);
    ed.vorschauBestaetigt = false;
    View.rezept();
  },

  zutatenEditorSchrittFeld(pi, si, wert){
    const ed = Store.zutatenEditor;
    const s = ed && ed.phasen[pi] && ed.phasen[pi].schritte[si];
    if(!s) return;
    s.text = wert;
    ed.vorschauBestaetigt = false;
    View.rezept();
  },

  zutatenEditorSchrittHinzufuegen(pi){
    const ed = Store.zutatenEditor;
    if(!ed || !ed.phasen[pi]) return;
    ed.phasen[pi].schritte.push({ nr: ed.phasen[pi].schritte.length + 1, text:"" });
    ed.vorschauBestaetigt = false;
    View.rezept();
  },

  zutatenEditorSchrittEntfernen(pi, si){
    const ed = Store.zutatenEditor;
    if(!ed || !ed.phasen[pi]) return;
    ed.phasen[pi].schritte.splice(si, 1);
    ed.vorschauBestaetigt = false;
    View.rezept();
  },

  // §3 Schritt 1->2: "Speichern" zeigt beim ersten Klick nur die Vorschau (View.zutatenEditorMarkup
  // haelt den Speichern-Knopf disabled, solange Editor.pruefen abweist — hier defensiv erneut geprueft).
  zutatenEditorVorschauOeffnen(){
    const ed = Store.zutatenEditor, rz = Store.aktuellesRezept;
    if(!ed || !rz) return;
    const pruefung = Editor.pruefen(Editor.normalisiert(ed.phasen), rz);
    if(!pruefung.ok) return;
    ed.vorschauBestaetigt = true;
    View.rezept();
  },

  zutatenEditorVorschauZurueck(){
    const ed = Store.zutatenEditor;
    if(!ed) return;
    ed.vorschauBestaetigt = false;
    View.rezept();
  },

  // §3 Schritt 3-8. "Jetzt speichern" (nach der Vorschau) ruft dies auf; die "Meine Fassung
  // speichern"-Aktion des Konfliktdialogs ebenfalls (mit bereits bestaetigter Vorschau).
  async zutatenEditorSpeichern(){
    const ed = Store.zutatenEditor, rz = Store.aktuellesRezept;
    if(!ed || !rz || ed.rezeptId !== rz.id || !ed.vorschauBestaetigt) return;
    const normPhasen = Editor.normalisiert(ed.phasen);
    const pruefung = Editor.pruefen(normPhasen, rz);
    if(!pruefung.ok) return;

    // Schritt 3: Voraussetzungen.
    const verbunden = Store.rezepteWorkbook && Data.verfuegbar() && msalApp.getActiveAccount();
    if(!verbunden){
      rz.phasen = normPhasen;
      Model.aufloesen([rz], Store.rohstoffe);
      Store.zutatenEditor = null;
      View.meldung("Änderungen bleiben in dieser Sitzung erhalten, ohne OneDrive-Verbindung wird nichts gespeichert.",
        "warn", "Nicht dauerhaft gespeichert");
      View.rezept();
      return;
    }
    if(!rz._raw){
      View.meldung("Zeilenposition dieses Rezepts ist unbekannt (frisch importiert, noch nicht neu geladen). "
        + "Seite neu laden und erneut versuchen.", "err", "Speichern nicht möglich");
      return;
    }

    // §4.3 Sonderfall: kein Vergleichs-eTag bekannt -> vor dem Schreiben neu laden statt vergleichen.
    if(!Store.rezepteETag){
      Entwurf.speichern(rz.id, normPhasen);
      View.meldung("Der Stand von Rezepte.xlsx konnte zuletzt nicht bestätigt werden — der Bestand wird vor "
        + "dem Speichern neu geladen.", "warn", "Stand wird geprüft");
      const konto = msalApp.getActiveAccount();
      await App.datenLaden(konto);
      App.rezeptOeffnen(rz.id);
      App.zutatenEditorEntwurfLaden();
      return;
    }

    const header = rz._raw.spalten, zeileExcel = rz._raw.zeile + 1;
    const ergebnis = await editorSchreiben(Data, {
      rezeptePfad: CONFIG.rezeptePfad, sheetName: Store.rezepteSheetName,
      header, zeileExcel, aktuellerETag: Store.rezepteETag, normPhasen
    });

    if(ergebnis.ergebnis === "konflikt"){
      // §4.1: Entwurf sichern, Bestand neu laden, Konfliktdialog statt nur der Kachel.
      Entwurf.speichern(rz.id, normPhasen);
      const konto = msalApp.getActiveAccount();
      await App.datenLaden(konto);
      App.rezeptOeffnen(rz.id);
      App.zutatenEditorKonfliktOeffnen();
      return;
    }
    if(ergebnis.ergebnis === "fehler"){
      View.meldung("Speichern fehlgeschlagen: " + ergebnis.meldung + " — Rezept in OneDrive nicht verändert.",
        "err", "Fehler beim Speichern");
      View.rezept();
      return;
    }

    // Schritt 8: Abschluss.
    rz.phasen = normPhasen;
    Model.aufloesen([rz], Store.rohstoffe);
    Store.rezepteETag = ergebnis.neuerETag;
    Store.zutatenEditor = null;
    Entwurf.verwerfen(rz.id);
    View.meldung("Rezept gespeichert, Backup in " + (CONFIG.backupOrdner || "/Backups") + " angelegt."
      + (ergebnis.nebenfehler ? ' Hinweis: Spalte „Geändert“ konnte nicht mitaktualisiert werden.' : ""),
      ergebnis.nebenfehler ? "warn" : "ok", "Gespeichert");
    View.rezept();
    View.liste();
  },

  // §4.1 Schritt 4: oeffnet den Konfliktdialog mit dem gerade gesicherten Entwurf ueber dem
  // frisch geladenen Bestand.
  zutatenEditorKonfliktOeffnen(){
    const rz = Store.aktuellesRezept;
    const gespeichert = rz && Entwurf.lesen(rz.id);
    if(!gespeichert) return;
    Store.zutatenEditor = {
      rezeptId: rz.id,
      phasen: JSON.parse(JSON.stringify(gespeichert.phasen)),
      vorschauBestaetigt: false,
      konflikt: { fremdeAnsicht:false }
    };
    View.rezept();
  },

  zutatenEditorKonfliktMeineFassungSpeichern(){
    const ed = Store.zutatenEditor;
    if(!ed) return Promise.resolve();
    ed.konflikt = null;
    ed.vorschauBestaetigt = true;
    return App.zutatenEditorSpeichern();
  },

  zutatenEditorKonfliktFremdeAnsehen(){
    const ed = Store.zutatenEditor;
    if(!ed || !ed.konflikt) return;
    ed.konflikt.fremdeAnsicht = true;
    View.rezept();
  },

  zutatenEditorKonfliktZurueck(){
    const ed = Store.zutatenEditor;
    if(!ed || !ed.konflikt) return;
    ed.konflikt.fremdeAnsicht = false;
    View.rezept();
  },

  zutatenEditorKonfliktBehalten(){
    const ed = Store.zutatenEditor;
    if(!ed) return;
    ed.konflikt = null;
    View.rezept();
  },

  // §4.4: Kachel-Aktionen fuer einen liegengebliebenen Entwurf beim Oeffnen eines Rezepts.
  zutatenEditorEntwurfLaden(){
    const rz = Store.aktuellesRezept;
    const gespeichert = rz && Entwurf.lesen(rz.id);
    if(!gespeichert) return;
    Store.zutatenEditor = {
      rezeptId: rz.id,
      phasen: JSON.parse(JSON.stringify(gespeichert.phasen)),
      vorschauBestaetigt: false,
      konflikt: null
    };
    View.rezept();
  },

  zutatenEditorEntwurfVerwerfen(){
    const rz = Store.aktuellesRezept;
    if(!rz) return;
    if(!confirm("Nicht gespeicherten Entwurf für dieses Rezept endgültig verwerfen?")) return;
    Entwurf.verwerfen(rz.id);
    View.rezept();
  },

  /* ---------- Entwicklungsmodus (AP-0311) ----------------------------------
     §1.1+§3 der Spezifikation AP-0203: eigene Excel-Spalte "Entwicklung (JSON)", Versionen
     (Kopie -> frei editierbar), Versuchsprotokoll je Version, Befördern (kopiert die Phasen
     der gewählten Version nach "Phasen (JSON)", Versionsliste bleibt vollständig erhalten —
     nichts wird gelöscht). Schreibpfad identisch zu backprotokollSpeichern oben: Konflikt
     prüfen (eTag), Backup, gezielte Zell-Updates statt Ganzdatei-PUT (Entscheid O-9). */
  entwStarten(){
    const rz = Store.aktuellesRezept;
    if(!rz || rz.entwicklung) return;
    const heute = new Date().toISOString().slice(0, 10);
    const neu = {
      status: "entwicklung", zielwerte: {}, aktivV: 1,
      versionen: [{ v:1, datum: heute, notiz: "Startpunkt, Kopie der produktiven Rezeptur",
                    phasen: Import.phasenExport(rz.phasen) }],
      versuche: []
    };
    App.entwSpeichern(rz, neu, "Entwicklungsmodus gestartet — v1 ist eine Kopie der aktuellen Rezeptur.");
  },

  entwVersionNeuOeffnen(){
    const rz = Store.aktuellesRezept, e = rz && rz.entwicklung;
    if(!e) return;
    const aktiv = Calc.entwAktiveVersion(e);
    const naechsteV = e.versionen.reduce((m,v) => Math.max(m, v.v || 0), 0) + 1;
    Store.devForm = { art:"version", modus:"neu", v: naechsteV, notiz:"",
      phasenText: JSON.stringify(aktiv ? aktiv.phasen : [], null, 2) };
    View.rezept();
  },

  entwVersionBearbeitenOeffnen(v){
    const rz = Store.aktuellesRezept, e = rz && rz.entwicklung;
    if(!e) return;
    const version = e.versionen.find(x => x.v === v);
    if(!version) return;
    Store.devForm = { art:"version", modus:"bearbeiten", v,
      notiz: version.notiz || "", phasenText: JSON.stringify(version.phasen, null, 2) };
    View.rezept();
  },

  entwFormAbbrechen(){ Store.devForm = null; View.rezept(); },

  async entwVersionSpeichern(){
    const rz = Store.aktuellesRezept, df = Store.devForm;
    if(!rz || !rz.entwicklung || !df || df.art !== "version") return;
    let phasen;
    try{ phasen = JSON.parse(df.phasenText); }
    catch(err){ View.meldung("Phasen (JSON) ist kein gültiges JSON — " + err.message, "err", "Version nicht gespeichert"); return; }
    const fehler = Import.phasenFehler(phasen, "phasen");
    if(fehler.length){
      View.meldung(fehler.map(f => f.pfad + ": " + f.meldung).join(" · "), "err", "Version nicht gespeichert");
      return;
    }
    const notiz = (df.notiz || "").trim();
    const heute = new Date().toISOString().slice(0, 10);
    const neueEntwicklung = JSON.parse(JSON.stringify(rz.entwicklung));
    const phasenExportiert = Import.phasenExport(phasen);
    if(df.modus === "neu"){
      neueEntwicklung.versionen = [...neueEntwicklung.versionen, { v: df.v, datum: heute, notiz, phasen: phasenExportiert }];
    }else{
      const idx = neueEntwicklung.versionen.findIndex(x => x.v === df.v);
      if(idx === -1) return;
      neueEntwicklung.versionen[idx] = { ...neueEntwicklung.versionen[idx], notiz, phasen: phasenExportiert };
    }
    neueEntwicklung.aktivV = df.v;
    await App.entwSpeichern(rz, neueEntwicklung,
      df.modus === "neu" ? "Neue Version v" + df.v + " angelegt." : "Version v" + df.v + " gespeichert.");
  },

  entwAktivSetzen(v){
    const rz = Store.aktuellesRezept;
    if(!rz || !rz.entwicklung) return;
    App.entwSpeichern(rz, { ...rz.entwicklung, aktivV: v }, "Version v" + v + " ist jetzt aktiv.");
  },

  entwDiffOeffnen(){
    const rz = Store.aktuellesRezept, e = rz && rz.entwicklung;
    if(!e || !e.versionen.length) return;
    const sortiert = e.versionen.slice().sort((a,b) => a.v - b.v);
    const aktiv = Calc.entwAktiveVersion(e);
    const vorherige = sortiert.filter(v => !aktiv || v.v !== aktiv.v).pop();
    Store.devForm = { art:"diff", a: (vorherige || sortiert[0]).v, b: (aktiv || sortiert[sortiert.length-1]).v };
    View.rezept();
  },

  entwDiffAendern(feld, wert){
    if(!Store.devForm || Store.devForm.art !== "diff") return;
    Store.devForm[feld] = Number(wert);
    View.rezept();
  },

  entwBefoerdernOeffnen(){
    const rz = Store.aktuellesRezept;
    const aktiv = rz && rz.entwicklung && Calc.entwAktiveVersion(rz.entwicklung);
    if(!aktiv) return;
    Store.devForm = { art:"befoerdern", v: aktiv.v };
    View.rezept();
  },

  // Kopiert die Phasen der gewählten Version nach "Phasen (JSON)" und setzt status="produktiv"
  // (§1.1) — die Versionsliste selbst bleibt unverändert, nichts wird gelöscht. Anders als
  // entwSpeichern() unten schreibt das zwei Zellen (Phasen + Entwicklung); bei jedem Fehler
  // rollt die gesamte Operation zurück, damit rz.phasen und rz.entwicklung nie auseinanderlaufen.
  async entwBefoerdernBestaetigt(){
    const rz = Store.aktuellesRezept, df = Store.devForm;
    if(!rz || !rz.entwicklung || !df || df.art !== "befoerdern") return;
    const version = rz.entwicklung.versionen.find(x => x.v === df.v);
    if(!version) return;
    const altePhasen = rz.phasen, alteEntwicklung = rz.entwicklung;
    rz.phasen = Import.phasenExport(version.phasen);
    Model.aufloesen([rz], Store.rohstoffe);
    rz.entwicklung = { ...rz.entwicklung, status:"produktiv", aktivV: version.v };

    const verbunden = Store.rezepteWorkbook && Data.verfuegbar() && msalApp.getActiveAccount();
    if(!verbunden){
      Store.devForm = null;
      View.meldung("Version v" + version.v + " ist jetzt die produktive Rezeptur — nur in dieser Sitzung, keine "
        + "OneDrive-Verbindung. Bisherige Rezeptur bleibt als Version erhalten.", "warn", "Nicht dauerhaft gespeichert");
      View.rezept();
      return;
    }
    if(!rz._raw){
      rz.phasen = altePhasen; rz.entwicklung = alteEntwicklung; Model.aufloesen([rz], Store.rohstoffe);
      View.meldung("Zeilenposition dieses Rezepts ist unbekannt (frisch importiert, noch nicht neu geladen). "
        + "Seite neu laden und erneut versuchen.", "err", "Befördern nicht möglich");
      return;
    }
    try{
      if(Store.rezepteETag){
        const meta = await Data.getItemMeta(CONFIG.rezeptePfad);
        if(meta.eTag !== Store.rezepteETag){
          rz.phasen = altePhasen; rz.entwicklung = alteEntwicklung; Model.aufloesen([rz], Store.rohstoffe);
          Store.devForm = null;
          View.meldung("Rezepte.xlsx wurde zwischenzeitlich extern geändert — Bestand wird neu geladen. "
            + "Bitte erneut befördern.", "warn", "Konflikt erkannt");
          const konto = msalApp.getActiveAccount();
          await App.datenLaden(konto);
          App.rezeptOeffnen(rz.id);
          return;
        }
      }
      await Data.backup(CONFIG.rezeptePfad);
      const header = rz._raw.spalten, zeileExcel = rz._raw.zeile + 1;
      const iPhasen = header.indexOf("Phasen (JSON)"), iEntw = header.indexOf("Entwicklung (JSON)");
      if(iPhasen === -1) throw new Error('Spalte "Phasen (JSON)" fehlt in Rezepte.xlsx');
      if(iEntw === -1) throw new Error('Spalte "Entwicklung (JSON)" fehlt in Rezepte.xlsx');
      await Data.updateCell(CONFIG.rezeptePfad, Store.rezepteSheetName,
        Model.zelladresse(header, "Phasen (JSON)", zeileExcel), JSON.stringify(rz.phasen));
      await Data.updateCell(CONFIG.rezeptePfad, Store.rezepteSheetName,
        Model.zelladresse(header, "Entwicklung (JSON)", zeileExcel), JSON.stringify(rz.entwicklung));
      try{ Store.rezepteETag = (await Data.getItemMeta(CONFIG.rezeptePfad)).eTag; }
      catch(e){ Store.rezepteETag = null; }
      Store.devForm = null;
      View.meldung("Version v" + version.v + " ist jetzt die produktive Rezeptur, Backup angelegt. "
        + "Bisherige Rezeptur bleibt als Version erhalten.", "ok", "Befördert");
      View.rezept();
    }catch(e){
      rz.phasen = altePhasen; rz.entwicklung = alteEntwicklung; Model.aufloesen([rz], Store.rohstoffe);
      View.meldung("Befördern fehlgeschlagen: " + e.message + " — Rezept in OneDrive nicht verändert.", "err", "Fehler beim Speichern");
      View.rezept();
    }
  },

  entwVersuchOeffnen(){
    const rz = Store.aktuellesRezept, e = rz && rz.entwicklung;
    if(!e || !e.versionen.length) return;
    const aktiv = Calc.entwAktiveVersion(e);
    Store.devForm = { art:"versuch", datum: new Date().toISOString().slice(0, 10),
      version: aktiv.v, soll:"", ist:"", bewertung:3, erkenntnis:"" };
    View.rezept();
  },

  async entwVersuchSpeichern(){
    const rz = Store.aktuellesRezept, df = Store.devForm;
    if(!rz || !rz.entwicklung || !df || df.art !== "versuch") return;
    const datum = (df.datum || "").trim();
    const soll = Number(df.soll), ist = Number(df.ist), bewertung = Number(df.bewertung), version = Number(df.version);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(datum)){ View.meldung("Datum fehlt oder ungültig.", "err", "Versuch unvollständig"); return; }
    if(!(soll > 0)){ View.meldung("Soll (g) muss grösser als 0 sein.", "err", "Versuch unvollständig"); return; }
    if(!(ist > 0)){ View.meldung("Ist (g) muss grösser als 0 sein.", "err", "Versuch unvollständig"); return; }
    if(!(bewertung >= 1 && bewertung <= 5)){ View.meldung("Bewertung muss zwischen 1 und 5 liegen.", "err", "Versuch unvollständig"); return; }
    if(!rz.entwicklung.versionen.some(v => v.v === version)){ View.meldung("Version existiert nicht.", "err", "Versuch unvollständig"); return; }
    // Feldnamen soll_g/ist_g bewusst wie Spezifikation AP-0203/§1.1 (abweichend von der
    // camelCase-Konvention des produktiven Backprotokolls — Versuchsdaten speisen dessen
    // Schwund-Logik ausdrücklich NICHT, siehe §3, sind also kein Alias desselben Felds).
    const eintrag = { datum, version, soll_g: soll, ist_g: ist, bewertung, erkenntnis: (df.erkenntnis || "").trim() || null };
    const neueEntwicklung = JSON.parse(JSON.stringify(rz.entwicklung));
    neueEntwicklung.versuche = [...(neueEntwicklung.versuche || []), eintrag];
    await App.entwSpeichern(rz, neueEntwicklung, "Versuch erfasst.");
  },

  /* ---------- Zielwerte-Rechner (AP-0312/§4) --------------------------------
     Formulare tragen Prozentwerte als Text im Editor-freundlichen "68" statt "0.68" —
     App.zielwerteAusForm() ist die einzige Stelle, die dieses ×100 wieder aufloest. */
  entwZielwerteOeffnen(){
    const rz = Store.aktuellesRezept, e = rz && rz.entwicklung;
    if(!e) return;
    const zw = e.zielwerte || {};
    const pctStr = v => v == null ? "" : String(Math.round(v * 10000) / 100);
    Store.devForm = { art:"zielwerte",
      hydration: pctStr(zw.hydration_pct), suesse: pctStr(zw.suesse_pct), fett: pctStr(zw.fett_pct),
      salz: pctStr(zw.salz_pct), kosten: zw.kosten_portion_chf != null ? String(zw.kosten_portion_chf) : "",
      zuckerartId: "" };
    View.rezept();
  },

  zielwerteAusForm(df){
    const pct = s => (s === "" || s == null) ? null : Number(s) / 100;
    const num = s => (s === "" || s == null) ? null : Number(s);
    return {
      hydration_pct: pct(df.hydration), suesse_pct: pct(df.suesse), fett_pct: pct(df.fett),
      salz_pct: pct(df.salz), kosten_portion_chf: num(df.kosten)
    };
  },

  async entwZielwerteSpeichern(){
    const rz = Store.aktuellesRezept, df = Store.devForm;
    if(!rz || !rz.entwicklung || !df || df.art !== "zielwerte") return;
    const neueEntwicklung = { ...rz.entwicklung, zielwerte: App.zielwerteAusForm(df) };
    await App.entwSpeichern(rz, neueEntwicklung, "Zielwerte gespeichert.");
  },

  // §4 "Rahmen herleiten": Basis-Wasser/-Salz/-Zucker aus den (gerade eingegebenen, ggf. noch
  // nicht gespeicherten) Zielwerten — legt IMMER eine neue Version an, speichert dabei auch
  // gleich die Zielwerte selbst (ein Schreibvorgang statt zwei).
  async entwRahmenHerleiten(){
    const rz = Store.aktuellesRezept, df = Store.devForm;
    if(!rz || !rz.entwicklung || !df || df.art !== "zielwerte") return;
    const zielwerte = App.zielwerteAusForm(df);
    if(zielwerte.hydration_pct == null && zielwerte.salz_pct == null && zielwerte.suesse_pct == null){
      View.meldung("Mindestens ein Zielwert (Hydration, Salz oder Süsse) nötig, um einen Rahmen herzuleiten.",
        "err", "Rahmen nicht erzeugt");
      return;
    }
    let zuckerart = null;
    if(zielwerte.suesse_pct != null){
      zuckerart = Store.rohstoffe.find(r => r.id === df.zuckerartId) || null;
      if(!zuckerart || !zuckerart.suesskraft)
        View.meldung("Süsse-Ziel gesetzt, aber keine Zuckerart mit Süsskraft gewählt — Zucker-Posten bleibt leer.",
          "warn", "Rahmen unvollständig");
    }
    const phasen = Calc.rahmenHerleiten(zielwerte, zuckerart);
    const heute = new Date().toISOString().slice(0, 10);
    const naechsteV = rz.entwicklung.versionen.reduce((m,v) => Math.max(m, v.v || 0), 0) + 1;
    const neueEntwicklung = { ...rz.entwicklung, zielwerte,
      versionen: [...rz.entwicklung.versionen, { v: naechsteV, datum: heute,
        notiz: "Rahmen aus Zielwerten hergeleitet", phasen }],
      aktivV: naechsteV };
    await App.entwSpeichern(rz, neueEntwicklung, "Rahmen v" + naechsteV + " aus Zielwerten hergeleitet.");
  },

  /* ---------- Referenz-Vergleich (AP-0313/§5) -------------------------------
     Reine Ansichtsfunktion: die Auswahl liegt in Store.referenzIds (sitzungslokal), es wird
     nichts gespeichert und nichts am Rezept veraendert. Maximal 3 Referenzen (Spez. §5). */
  entwReferenzOeffnen(){
    const rz = Store.aktuellesRezept;
    if(!rz || !rz.entwicklung) return;
    Store.devForm = { art:"referenz", suchtext:"", kategorie:"", fokus:false };
    View.rezept();
  },

  entwReferenzSuche(text){
    if(!Store.devForm || Store.devForm.art !== "referenz") return;
    Store.devForm.suchtext = text;
    Store.devForm.fokus = true;
    View.rezept();
  },

  entwReferenzKategorie(kat){
    if(!Store.devForm || Store.devForm.art !== "referenz") return;
    Store.devForm.kategorie = kat;
    Store.devForm.fokus = false;
    View.rezept();
  },

  entwReferenzHinzufuegen(id){
    const rz = Store.aktuellesRezept;
    if(!rz || id === rz.id || Store.referenzIds.includes(id)) return;
    if(Store.referenzIds.length >= 3){

        "err", "Referenz nicht hinzugefügt");

    }

    if(Store.devForm && Store.devForm.art === "referenz") Store.devForm.fokus = false;
