<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
<script>
/* ============================================================================
   libarius — Modulschnitt gemäss Feinkonzept AP-0206 §2
   CONFIG · Model · Calc · Data · Store · View · App
   Calc ruft nichts auf. View schreibt nie direkt nach OneDrive.
   ========================================================================== */

/* ---------- CONFIG --------------------------------------------------------
   Startwerte; ladeConfig() überschreibt mit config.json, danach mit
   nutzerbezogenen Overrides aus localStorage (Settings, Feinkonzept §5.4). */
const CONFIG = {
  clientId: null, tenantId: "common", redirectUri: null,
  rezeptePfad: null, rohstoffePfad: null, backupOrdner: "/Backups",
  schwundFenster: 3,
  zellenWarnung: 25000,
  // AP-0318: Aussengrenze der App (Feinkonzept §6b.5). Zeigt auf eine selbst gehostete
  // Funktion, die den eigentlichen LLM-Schlüssel haelt (nie im Repo) und die vier Pfade
  // /rezept-aus-text, /rezept-aus-bild, /rohstoff-recherche bedient. null/leer = kein Dienst
  // konfiguriert, Service.verfuegbar() liefert dann false und alle zugehoerigen Knoepfe
  // bleiben ausgeblendet — die App funktioniert vollstaendig ohne dieses Feld.
  serviceUrl: null,
  // Aliase: reine Schreib-/Sprach-/Zubereitungsvarianten desselben Rohstoffs, ohne
  // Konkurrenz-SKU im Bestand (AP-0307/-0402/-0403). Generisch->spezifisch-Fälle
  // (z. B. «Zucker», «Milch», «Farina») bewusst NICHT hier — Entscheidungsliste
  // dazu in AP-0403_alias_konsolidierung.md.
  aliase: {
    "mehl 00": "weissmehl 00",
    "acqua": "wasser",
    "acqua a 30°": "wasser",
    "albume": "eiweiss",
    "bacche di vaniglia": "vanilleschote",
    "bacche die vaniglia": "vanilleschote",
    "bienenhonig": "honig",
    "burro": "butter",
    "butter eiskalt": "butter",
    "butter raumtemp": "butter",
    "butter weich": "butter",
    "egg whites, at room temp": "eiweiss",
    "egg yolks": "eigelb",
    "ei": "vollei",
    "eier": "vollei",
    "eiswasser": "wasser",
    "erithrit": "erythritol",
    "farina 00": "weissmehl 00",
    "frische hefe": "frischhefe",
    "gemahlene mandeln": "mandeln gemahlen",
    "hefe frisch": "frischhefe",
    "lievito di birra": "frischhefe",
    "mehl 00 (caputo)": "farina caputo blu",
    "miele (acacia)": "honig",
    "milch frisch 3.5%": "milch 3.5%",
    "milch raumtemp": "milch 3.5%",
    "muskat": "muskatnuss",
    "olio evo": "olivenöl",
    "panna": "rahm 35%",
    "parmigiano reggiano": "parmesan",
    "pfeffer": "pfeffer schwarz",
    "pfefferkörner": "pfeffer schwarz",
    "rahm": "rahm 35%",
    "ruchmehl (typ 1050)": "ruchmehl",
    "sale": "salz",
    "schwarzer pfeffer": "pfeffer schwarz",
    "speck rückenspeck": "rückenspeck",
    "trehallose": "trehalose",
    "tuorli": "eigelb",
    "tuorli d'uovo": "eigelb",
    "tuorlo": "eigelb",
    "uova": "vollei",
    "vanille schote": "vanilleschote",
    "vanillestange": "vanilleschote",
    "wachholder": "wacholder",
    "wasser (kalt)": "wasser",
    "wasser (warm)": "wasser",
    "wasser @30°c": "wasser",
    "water": "wasser",
    "weissmehl": "weissmehl 00",
    "yoghurt": "joghurt nature",
    "zimt gemahlen": "zimt",
    "zimtpulver": "zimt",
    "zucker (tagatose)": "tagatose"
  }
};
const zahlOderNull = v => (v == null || v === "") ? null : Number(v);

/* ---------- Settings: nutzerbezogene Werte in localStorage --------------- */
const Settings = {
  schluessel(feld){ return "libarius." + feld; },
  get(feld, fallback){
    try{
      const raw = localStorage.getItem(Settings.schluessel(feld));
      return raw == null ? fallback : JSON.parse(raw);
    }catch(e){ return fallback; }
  },
  set(feld, wert){
    try{ localStorage.setItem(Settings.schluessel(feld), JSON.stringify(wert)); }catch(e){}
  }
};

async function ladeConfig(){
  try{
    const res = await fetch("config.json", { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    Object.assign(CONFIG, await res.json());
  }catch(e){
    View.meldung("config.json konnte nicht geladen werden (" + e.message + "). "
      + "Anmeldung ist ohne clientId nicht möglich — Beispieldaten bleiben nutzbar.",
      "warn", "Konfiguration fehlt");
  }
  CONFIG.rezeptePfad    = Settings.get("rezeptePfad",    CONFIG.rezeptePfad);
  CONFIG.rohstoffePfad  = Settings.get("rohstoffePfad",  CONFIG.rohstoffePfad);
  CONFIG.backupOrdner   = Settings.get("backupOrdner",   CONFIG.backupOrdner);
  CONFIG.schwundFenster = Settings.get("schwundFenster", CONFIG.schwundFenster);
  CONFIG.zellenWarnung  = Settings.get("zellenWarnung",  CONFIG.zellenWarnung);
  CONFIG.aliase         = Object.assign({}, CONFIG.aliase, Settings.get("aliase", {}));
}

/* ---------- Model: Normierung + Auflösung ------------------------------- */
const Model = {
  // reine Normierung ohne Alias-Aufloesung — Grundlage sowohl fuer nameKey() als auch fuer
  // das Lesen/Schreiben des Alias-Blatts selbst (AP-0315), das ja die Alias-Zuordnung ERST herstellt.
  normKey(s){
    return String(s||"").normalize("NFC").trim().toLowerCase().replace(/\s+/g," ");
  },
  nameKey(s){
    const k = Model.normKey(s);
    return CONFIG.aliase[k] || k;
  },
  rohstoffIndex(rohstoffe){
    const m = new Map();
    rohstoffe.forEach(r => m.set(Model.nameKey(r.name), r));
    return m;
  },
  // verknüpft jede Zutat einmalig mit ihrem Rohstoff (FR-306/FR-307).
  // idxOverride: optional vorgebauter Index (AP-0315 Import-Vorschau ueberlagert den reellen
  // Bestand mit den im Dialog gewaehlten, noch nicht gespeicherten Zuordnungen).
  aufloesen(rezepte, rohstoffe, idxOverride){
    const idx = idxOverride || Model.rohstoffIndex(rohstoffe);
    rezepte.forEach(rz => rz.phasen.forEach(ph => ph.zutaten.forEach(z => {
      z.nameKey  = Model.nameKey(z.name);
      z.rohstoff = idx.get(z.nameKey) || null;
    })));
    return rezepte;
  },

  // Excel ⇄ intern (Feinkonzept §3, §3.2). aoa = Array-of-Arrays inkl. Kopfzeile.
  parseRohstoffe(aoa){
    const header = aoa[0] || [];
    const i = h => header.indexOf(h);
    const iId=i("Rohstoff-ID"), iName=i("Name"), iKat=i("Kategorie"),
          iEinh=i("Standardeinheit"), iEinhG=i("Einheitsgrösse"),
          iKosten=i("Kosten/kg (CHF)"), iKcal=i("kcal/100g"), iEiweiss=i("Eiweiss g/100g"),
          iFett=i("Fett g/100g"), iKh=i("KH g/100g"), iSuess=i("Süsskraft"),
          iFodmap=i("FODMAP"), iFodmapPortion=i("FODMAP sichere Portion (g)"), iGesperrt=i("Gesperrt"),
          // AP-0317 hat diese vier Spalten bereits angelegt («ohne Beleg kein Wert») — AP-0318
          // liest sie erstmals aus, fuer die Preisalter-Markierung (FR-1305) und als Basis fuer
          // die Vorbelegung im Recherche-Dialog. Fehlt eine Spalte (aeltere Dateien), bleibt der
          // Wert schlicht null statt eines Ladefehlers.
          iPreisQuelle=i("Preis Quelle"), iPreisStand=i("Preis Stand"),
          iNaehrwertQuelle=i("Nährwert Quelle"), iNaehrwertStand=i("Nährwert Stand");
    const rohstoffe = [];
    for(let r = 1; r < aoa.length; r++){
      const row = aoa[r];
      if(!row || row.every(v => v == null || v === "")) continue;
      const fodmapRoh = row[iFodmap] ? String(row[iFodmap]).trim().toLowerCase() : null;
      rohstoffe.push({
        id: row[iId], name: row[iName], kategorie: row[iKat] || null,
        standardeinheit: row[iEinh] || null,
        einheitsgroesse: zahlOderNull(row[iEinhG]),
        kostenProKg: zahlOderNull(row[iKosten]),
        naehrwerte: { kcal: zahlOderNull(row[iKcal]), eiweiss: zahlOderNull(row[iEiweiss]),
                      fett: zahlOderNull(row[iFett]), kh: zahlOderNull(row[iKh]) },
        suesskraft: zahlOderNull(row[iSuess]),
        fodmap: ["gruen","gelb","rot"].includes(fodmapRoh) ? fodmapRoh : null,
        fodmapPortionG: zahlOderNull(row[iFodmapPortion]),
        gesperrt: !!row[iGesperrt],
        preisQuelle: iPreisQuelle > -1 ? (row[iPreisQuelle] || null) : null,
        preisStand: iPreisStand > -1 ? (row[iPreisStand] || null) : null,
        naehrwertQuelle: iNaehrwertQuelle > -1 ? (row[iNaehrwertQuelle] || null) : null,
        naehrwertStand: iNaehrwertStand > -1 ? (row[iNaehrwertStand] || null) : null,
        _raw: { zeile: r, spalten: header, werte: row }
      });
    }
    return rohstoffe;
  },

  // Fehlerpfad (AP-0302 Schritt 2): ungültiges JSON in einer Zeile stoppt nicht
  // den ganzen Import — die Zeile landet in fehlerhaft[] statt in rezepte[].
  parseRezepte(aoa){
    const header = aoa[0] || [];
    const i = h => header.indexOf(h);
    const iId=i("Rezept-ID"), iName=i("Name"), iKat=i("Kategorie"), iUnterkat=i("Unterkategorie"),
          iBasisName=i("Basis-Rohstoff"), iBasisMenge=i("Basis-Menge (g)"), iSoll=i("Sollgewicht (g)"),
          iPortionen=i("Portionen"), iEinheit=i("Einheit"), iQuelle=i("Quelle"),
          iPhasen=i("Phasen (JSON)"), iBackprot=i("Backprotokoll (JSON)"),
          // AP-0311/§1.1: eigene Spalte, separat von Phasen (JSON) (Audit-Empfehlung AP-0101,
          // Zellenlimit). Fehlt die Spalte (aeltere Rezepte.xlsx-Stände) bleibt entwicklung
          // schlicht null — Abwärtskompatibilität ist Abnahmekriterium 3 dieses AP.
          iEntwicklung = i("Entwicklung (JSON)"),
          // AP-0304: Spalte "Verfahren" (in AP-0306 dieses Sprints angelegt, Q2:Q81) wird
          // fuer den Metadatenblock "Verfahren & Protokoll" gelesen. Fehlt die Spalte oder
          // ist die Zelle leer (RZP-048/079/080), bleibt verfahren null — kein Ladefehler.
          // Die Spalte "Protokoll (JSON)" bleibt hier bewusst unberuehrt: sie befuellt und
          // liest AP-0307, dieses AP baut nur den Platz dafuer.
          iVerfahren = i("Verfahren");
    const rezepte = [], fehlerhaft = [];
    for(let r = 1; r < aoa.length; r++){
      const row = aoa[r];
      if(!row || row.every(v => v == null || v === "")) continue;
      const name = row[iName] || ("Zeile " + (r + 1));
      try{
        const phasen = row[iPhasen] ? JSON.parse(row[iPhasen]) : [];
        const backprotokollRoh = row[iBackprot] ? JSON.parse(row[iBackprot]) : [];
        const entwicklung = (iEntwicklung > -1 && row[iEntwicklung]) ? JSON.parse(row[iEntwicklung]) : null;
        if(!Array.isArray(phasen)) throw new Error("Phasen (JSON) ist kein Array");
        if(!Array.isArray(backprotokollRoh)) throw new Error("Backprotokoll (JSON) ist kein Array");
        if(entwicklung != null && typeof entwicklung !== "object") throw new Error("Entwicklung (JSON) ist kein Objekt");
        // AP-0305: Zeile intern immer als {datum,sollG,istG,notizen} — toleriert das
        // Alt-/Platzhalterschema (soll_g/ist_g) und verwirft nicht ausgefuellte Platzhalter-
        // zeilen (Datum "YYYY-MM-DD", wie aktuell in allen 77 produktiven Zeilen vorhanden).
        // Ohne diesen Filter zeigte das Backprotokoll fuer jedes echte Rezept sofort eine
        // "undefined g"-Zeile (View.rezept() erwartet sollG/istG, die Platzhalter lieferten
        // sie nicht) — echter, bereits bestehender Fehler, hier mitbehoben.
        const backprotokoll = backprotokollRoh
          .map(e => ({
            datum: e && e.datum,
            sollG: zahlOderNull(e && (e.sollG != null ? e.sollG : e.soll_g)),
            istG: zahlOderNull(e && (e.istG != null ? e.istG : e.ist_g)),
            notizen: (e && e.notizen) || null
          }))
          .filter(e => e.datum && /^\d{4}-\d{2}-\d{2}$/.test(e.datum) && e.sollG != null && e.istG != null);
        rezepte.push({
          id: row[iId], name, kategorie: row[iKat] || null, unterkategorie: row[iUnterkat] || null,
          basisName: row[iBasisName] || null,
          basisMengeG: zahlOderNull(row[iBasisMenge]), sollgewichtG: zahlOderNull(row[iSoll]),
          portionen: zahlOderNull(row[iPortionen]), einheit: row[iEinheit] || null,
          quelle: row[iQuelle] || null,
          verfahren: (iVerfahren > -1 && row[iVerfahren]) ? String(row[iVerfahren]).trim() || null : null,
          phasen, backprotokoll, entwicklung,
          _raw: { zeile: r, spalten: header, werte: row }
        });
      }catch(e){
        fehlerhaft.push({ id: row[iId] || ("Zeile " + (r + 1)), name, fehler: e.message, zeile: r + 1 });
      }
    }
    return { rezepte, fehlerhaft };
  },

  // AP-0305: Zelladresse fuer gezielte Workbook-API-Updates (Data.updateCell) — pure Funktion,
  // kein Netz. header = volle Kopfzeile aus rz._raw.spalten, zeileExcel = 1-indexierte Excel-Zeile
  // (rz._raw.zeile + 1, da _raw.zeile der 0-indexierte AOA-Index inkl. Kopfzeile ist).
  zelladresse(header, spaltenname, zeileExcel){
    const i = header.indexOf(spaltenname);
    return i === -1 ? null : XLSX.utils.encode_col(i) + zeileExcel;
  },

  // Blatt «Aliase» in Rohstoffe.xlsx (AP-0315 Schritt 4): geraeteuebergreifend gelernte
  // Zuordnungen, zusaetzlich zu den eingebauten CONFIG.aliase. Header: Variante | Zielname.
  parseAliase(aoa){
    const header = aoa[0] || [];
    const iVon = header.indexOf("Variante"), iZu = header.indexOf("Zielname");
    if(iVon === -1 || iZu === -1) return {};
    const out = {};
    for(let r = 1; r < aoa.length; r++){
      const row = aoa[r];
      if(!row || row[iVon] == null || row[iZu] == null) continue;
      const von = Model.normKey(row[iVon]), zu = Model.normKey(row[iZu]);
      if(von && zu) out[von] = zu;
    }
    return out;
  }
};

/* ---------- Calc: reiner Rechenkern (kein DOM, kein Netz) --------------- */
const Calc = {
  mengeG(zutat, basisMengeG, faktor){ return basisMengeG * faktor * zutat.prozent; },

  // AP-0303/§3.3: eine Kochkorrektur wird proportional zur aktuellen Skalierung
  // nachgefuehrt — faktorBeiEingabe bleibt dabei als fester Bezugspunkt stehen, "ist"
  // wird nie mutiert (der Ursprung bleibt rekonstruierbar, AP-0201 §3.3).
  korrekturAktuell(korrektur, faktor){ return korrektur.ist * faktor / korrektur.faktorBeiEingabe; },

  faktorAusBasis(zielBasisG, rezept){ return zielBasisG / rezept.basisMengeG; },
  faktorAusPortionen(zielPortionen, rezept){ return zielPortionen / rezept.portionen; },

  alsStueck(g, rohstoff){
    if(!rohstoff || !rohstoff.einheitsgroesse || rohstoff.standardeinheit !== "stk") return null;
    return { stueck: g / rohstoff.einheitsgroesse, g };
  },

  // Rundung ausschliesslich fuer die Anzeige (Feinkonzept §4: "nie in der Rechenkette").
  // Stueckzahlen runden auf 0.5 (AP-0303) — eigene Funktion, damit alsStueck() roh bleibt.
  rundenStueck(stueck){ return Math.round(stueck*2)/2; },

  // g/kg-Pfad unveraendert nach Feinkonzept FR-305 (<10g auf 0.1 · ≥10g auf 1 · ≥1000g als kg).
  // ml-Pfad neu in AP-0303: auf 5 ml gerundet, ab 1000 ml als Liter angezeigt.
  runden(g, einheit){
    if(einheit === "ml"){
      const ml = Math.round(g/5)*5;
      if(ml >= 1000) return (ml/1000).toFixed(2).replace(/0+$/,"").replace(/\.$/,"") + " l";
      return ml + " ml";
    }
    if(g >= 1000) return (g/1000).toFixed(2).replace(/0+$/,"").replace(/\.$/,"") + " kg";
    if(g >= 10)   return Math.round(g) + " g";
    return (Math.round(g*10)/10) + " g";
  },

  zutatenFlach(rezept){
    return rezept.phasen.flatMap(p => p.zutaten);
  },

  // AP-0302/B2: Einkaufsliste = Zutaten ueber alle Phasen ZUSAMMENGEFASST (AP-0201 §1) —
  // wer einkauft, fragt nicht nach der Phase, nur nach der Gesamtmenge je Zutat.
  // Gruppiert nach nameKey (dieselbe Alias-Aufloesung wie ueberall sonst), Einheit
  // stammt von der ersten Fundstelle — in den 80 produktiven Rezepten kommt keine
  // Zutat mit wechselnder Einheit ueber Phasen hinweg vor.
  // AP-0303 Abnahmekriterium 1: korrekturen (optional, { "<phasenIdx>/<zutatIdx>": {...} })
  // fliesst in die Summe ein — die effektive Menge "g" nutzt die Korrektur, die
  // urspruengliche Summe bleibt daneben als "gSoll" erhalten (Grundlage der
  // durchgestrichenen Anzeige in View.einkaufsliste).
  einkaufsliste(rezept, faktor, korrekturen){
    const posten = new Map();
    rezept.phasen.forEach((p, i) => {
      p.zutaten.forEach((z, j) => {
        const gSoll = Calc.mengeG(z, rezept.basisMengeG, faktor);
        const k = korrekturen && korrekturen[i + "/" + j];
        const g = k ? Calc.korrekturAktuell(k, faktor) : gSoll;
        if(!posten.has(z.nameKey)){
          posten.set(z.nameKey, { key: z.nameKey, name: z.name, einheit: z.einheit, rohstoff: z.rohstoff, g: 0, gSoll: 0, korrigiert: false });
        }
        const eintrag = posten.get(z.nameKey);
        eintrag.g += g;
        eintrag.gSoll += gSoll;
        if(k) eintrag.korrigiert = true;
      });
    });
    return [...posten.values()].sort((a,b) => a.name.localeCompare(b.name, "de"));
  },

  kosten(rezept, faktor, schwund){
    let roh = 0; const fehlend = [];
    for(const z of Calc.zutatenFlach(rezept)){
      const g = Calc.mengeG(z, rezept.basisMengeG, faktor);
      const kk = z.rohstoff && z.rohstoff.kostenProKg;
      if(kk == null){ if(g > 0) fehlend.push(z.name); continue; }
      roh += g * kk / 1000;
    }
    // FR-402: Materialeinsatz = Kosten / (1 - Schwund). Siehe offener Punkt O-5.
    const s = (schwund == null ? 0 : schwund);
    const effektiv = s > 0 ? roh / (1 - s) : roh;
    const portionen = rezept.portionen * faktor;
    return { roh, effektiv, proPortion: portionen ? effektiv/portionen : null, fehlend };
  },

  naehrwerte(rezept, faktor){
    const g0 = {kcal:0, eiweiss:0, fett:0, kh:0}; const fehlend = [];
    let masseG = 0;
    for(const z of Calc.zutatenFlach(rezept)){
      const g = Calc.mengeG(z, rezept.basisMengeG, faktor);
      masseG += g;
      const n = z.rohstoff && z.rohstoff.naehrwerte;
      if(!n || n.kcal == null){ if(g > 0) fehlend.push(z.name); continue; }
      for(const k of Object.keys(g0)) g0[k] += g * (n[k]||0) / 100;
    }
    const portionen = rezept.portionen * faktor;
    const teile = (obj, div) => {
      const o = {}; for(const k of Object.keys(obj)) o[k] = div ? obj[k]/div : null; return o;
    };
    return { gesamt:g0, proPortion:teile(g0, portionen), pro100g:teile(g0, masseG/100), fehlend, masseG };
  },

  schwundEintrag(sollG, istG){
    if(!sollG) return null;
    return 1 - (istG / sollG);
  },

  schwundAktuell(backprotokoll, n){
    n = n || CONFIG.schwundFenster;
    const werte = (backprotokoll||[]).slice(-n)
      .map(e => Calc.schwundEintrag(e.sollG, e.istG))
      .filter(v => v != null && isFinite(v));
    if(!werte.length) return null;
    return werte.reduce((a,b)=>a+b,0) / werte.length;
  },

  kennzahlen(rezept, faktor){
    const basis = rezept.basisMengeG * faktor;
    let fl = 0, salz = 0, suesse = 0, fett = 0, zucker = 0;
    for(const z of Calc.zutatenFlach(rezept)){
      const g = Calc.mengeG(z, rezept.basisMengeG, faktor);
      const r = z.rohstoff;
      if(r && r.standardeinheit === "ml") fl += g;
      if(z.nameKey === "salz") salz += g;
      if(r && r.suesskraft) suesse += g * r.suesskraft;
      if(r && r.naehrwerte && r.naehrwerte.fett != null) fett += g * r.naehrwerte.fett / 100;
      if(r && r.kategorie === "Zucker") zucker += g;
    }
    const d = v => basis ? v/basis : null;
    return { hydration:d(fl), salz:d(salz), suesse:d(suesse), fett:d(fett), zuckerRoh:d(zucker) };
  },

  ampel(ist, ziel){
    if(ist == null || ziel == null || !ziel) return null;
    const abw = Math.abs(ist - ziel) / ziel;
    return abw <= 0.05 ? "gruen" : abw <= 0.15 ? "gelb" : "rot";
  },

  // AP-0312/§4: "Rahmen herleiten" — aus gesetzten Zielwerten ein Startgerüst als einzelne
  // Phase (Wasser = Hydration-Ziel, Salz = Salz-Ziel, Zucker = Süsse-Ziel ÷ Süsskraft der
  // gewählten Zuckerart, sonst leer). Reine Funktion, mutiert nichts — zuckerart ist optional
  // (Rohstoff-Objekt mit .name/.suesskraft); ohne sie oder ohne Süsse-Ziel bleibt der
  // Zucker-Posten schlicht aus, auch wenn suesse_pct gesetzt ist.
  rahmenHerleiten(zielwerte, zuckerart){
    const zw = zielwerte || {};
    const zutaten = [];
    if(zw.hydration_pct != null) zutaten.push({ name:"Wasser", prozent:zw.hydration_pct, einheit:"ml" });
    if(zw.salz_pct != null) zutaten.push({ name:"Salz", prozent:zw.salz_pct, einheit:"g" });
    if(zw.suesse_pct != null && zuckerart && zuckerart.suesskraft)
      zutaten.push({ name:zuckerart.name, prozent: zw.suesse_pct / zuckerart.suesskraft, einheit:"g" });
    return [{ name:"Rahmen", zutaten, schritte:[] }];
  },

  substitutionsMenge(mengeG, suesskraftAlt, suesskraftNeu){
    if(!suesskraftAlt || !suesskraftNeu)
      return { menge: mengeG, hinweis: "Äquivalenz nicht hinterlegt — Menge prüfen" };
    return { menge: mengeG * (suesskraftAlt / suesskraftNeu), hinweis: null };
  },

  fodmapGesamt(zutaten){
    const rang = { gruen:0, gelb:1, rot:2 };
    let max = null, unbewertet = 0;
    for(const z of zutaten){
      const a = z.rohstoff && z.rohstoff.fodmap;
      if(!a){ unbewertet++; continue; }
      if(max == null || rang[a] > rang[max]) max = a;
    }
    if(unbewertet && (max == null || rang[max] < rang.gelb)) max = "gelb";
    return { ampel: max, unbewertet };
  },

  // AP-0318/FR-1305: Alter eines Preis-/Nährwert-Stands. AP-0317 schreibt das Datum als
  // Schweizer Kurzformat "TT.MM.JJJJ" oder den Text "unbekannt" in die Spalte "… Stand".
  // Weder ein fehlender Wert noch "unbekannt" lassen sich in Tage umrechnen — beides liefert
  // null (heisst in der Anzeige "kein Datum", nicht "0 Tage alt").
  parseDatumCH(s){
    const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(s || "").trim());
    if(!m) return null;
    return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  },
  preisAlterTage(standStr, heute){
    const d = Calc.parseDatumCH(standStr);
    if(!d) return null;
    return Math.floor((heute - d) / 86400000);
  },

  // AP-0311/§3: die "aktive" Version eines Entwicklungsrezepts — entwicklung.aktivV, mit
  // der zuletzt angelegten Version als Rueckfalllinie (z.B. bei einer von Hand in Excel
  // veraenderten Datei ohne aktivV). Reine Lesefunktion, keine Mutation.
  entwAktiveVersion(entwicklung){
    if(!entwicklung || !Array.isArray(entwicklung.versionen) || !entwicklung.versionen.length) return null;
    const treffer = entwicklung.versionen.find(v => v.v === entwicklung.aktivV);
    return treffer || entwicklung.versionen[entwicklung.versionen.length - 1];
  },

  // AP-0311/§3 Versions-Diff: Zeilen = Zutat | vA-% | vB-% | Δ (Union aller Zutatennamen aus
  // beiden Versionen, ueber alle Phasen geflacht — die Tabelle im Mockup unterscheidet nicht
  // nach Phase), plus je Phase, ob sich die Schritte-Texte geaendert haben (Union der
  // Phasennamen, damit eine in vB neue oder in vA entfernte Phase ebenfalls auftaucht).
  entwDiff(vA, vB){
    const flach = v => (v ? v.phasen || [] : []).flatMap(ph => ph.zutaten || []);
    const proName = zutaten => {
      const m = new Map();
      zutaten.forEach(z => m.set(z.name, (m.get(z.name) || 0) + (z.prozent || 0)));
      return m;
    };
    const mA = proName(flach(vA)), mB = proName(flach(vB));
    const namen = [...new Set([...mA.keys(), ...mB.keys()])].sort((a,b) => a.localeCompare(b, "de"));
    const zutaten = namen.map(name => {
      const aPct = mA.has(name) ? mA.get(name) : null, bPct = mB.has(name) ? mB.get(name) : null;
      return { name, aPct, bPct, delta: (aPct != null && bPct != null) ? bPct - aPct : null };
    });

    const schritteText = ph => (ph.schritte || []).map(s => s.text).join("\n");
    const phasenA = new Map((vA ? vA.phasen || [] : []).map(ph => [ph.name, schritteText(ph)]));
    const phasenB = new Map((vB ? vB.phasen || [] : []).map(ph => [ph.name, schritteText(ph)]));
    const phasenNamen = [...new Set([...phasenA.keys(), ...phasenB.keys()])];
    const schritte = phasenNamen.map(name => ({
      phase: name, geaendert: (phasenA.get(name) || "") !== (phasenB.get(name) || "")
    }));

    return { zutaten, schritte };
  },

  // AP-0313/§5 Referenz-Vergleich: eine Tabelle, Spalte 0 = Entwicklungsversion, danach bis zu
  // drei Bestandsrezepte. Zeilen sind die Kennzahlen aus §2 plus die Union aller Zutaten in %
  // der Basis. Reine Funktion — alle Spalten muessen bereits aufgeloest sein (z.B. via
  // View.entwVersionAufgeloest bzw. direkt aus Store.rezepte), damit hier dieselben
  // Calc-Funktionen laufen wie in der Einzelansicht und die Werte zwingend uebereinstimmen.
  relAbweichung(wert, referenz){
    if(wert == null || referenz == null || !referenz) return null;
    return Math.abs(wert - referenz) / Math.abs(referenz);
  },

  referenzVergleich(entwRezept, referenzen){
    const spalten = [entwRezept, ...(referenzen || [])].filter(Boolean);
    // Schwelle aus der Spez: > 20 % relativ. Genau 20.0 % bleibt unmarkiert.
    const SCHWELLE = 0.20;
    const zeile = (label, art, werte) => {
      const wert = werte[0] == null ? null : werte[0];
      return { label, art, wert, refs: werte.slice(1).map(w => {
        const abw = Calc.relAbweichung(wert, w);
        return { wert: w, abw, markiert: abw != null && abw > SCHWELLE };
      }) };
    };

    const kz = spalten.map(rz => {
      const k = Calc.kennzahlen(rz, 1);
      const kosten = Calc.kosten(rz, 1, Calc.schwundAktuell(rz.backprotokoll));
      return { ...k, kosten: kosten.proPortion };
    });
    const kennzahlen = [
      zeile("Hydration",      "pct", kz.map(k => k.hydration)),
      zeile("Salz",           "pct", kz.map(k => k.salz)),
      zeile("Süsse",          "pct", kz.map(k => k.suesse)),
      zeile("Fett",           "pct", kz.map(k => k.fett)),
      zeile("Zucker roh",     "pct", kz.map(k => k.zuckerRoh)),
      zeile("Kosten/Portion", "chf", kz.map(k => k.kosten))
    ];

    // Zutaten-Union: Reihenfolge folgt den Spalten (Entwicklungsversion zuerst), damit die
    // eigenen Zutaten oben stehen; nur in einer Referenz vorhandene Zutaten haengen hinten an.
    const proRezept = spalten.map(rz => {
      const m = new Map();
      Calc.zutatenFlach(rz).forEach(z => {
        const key = Model.nameKey(z.name);
        const e = m.get(key);
        if(e) e.prozent += (z.prozent || 0);
        else m.set(key, { name: z.name, prozent: z.prozent || 0 });
      });
      return m;
    });
    const namen = [];
    proRezept.forEach(m => m.forEach((v, key) => {
      if(!namen.some(n => n.key === key)) namen.push({ key, name: v.name });
    }));
    const zutaten = namen.map(n =>
      zeile(n.name, "pct", proRezept.map(m => m.has(n.key) ? m.get(n.key).prozent : null)));

    return { kennzahlen, zutaten, spalten: spalten.length };
  }
};

/* ---------- Data: MSAL-Login + Microsoft Graph (Feinkonzept §5) --------- */
let msalApp = null;

const Data = {
  verfuegbar(){ return !!msalApp; },

  // iPadOS-Safari meldet sich als "MacIntel", hat aber echte Touch-Punkte —
  // Popup-Login wird von Safari dort notorisch blockiert, darum Redirect (AP-0302 Kontext).
  istIPad(){
    return /iPad/.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  },

  istAuthAntwortInUrl(){
    const hatState = s => s.length > 1 && new URLSearchParams(s.replace(/^[#?]/, "")).has("state");
    return hatState(location.hash) || hatState(location.search);
  },

  // MSAL 5.x erkennt einen verschachtelten Popup NICHT an window.opener oder window.name,
  // sondern daran, dass in Hash oder Query DIESER Seite noch eine Auth-Antwort mit
  // interactionType "popup" steht (msal-browser 5.20.0: isInPopup() -> parseAuthResponseFromUrl()).
  // Weil redirectUri = diese Seite selbst ist (ADR AP-0201), landet so eine Antwort hier. Raeumt
  // handleRedirectPromise() sie nicht ab — etwa weil es geworfen hat —, bleibt sie in der
  // Adresszeile stehen. Hash und Query ueberleben jeden Reload: der Tab ist dann dauerhaft
  // blockiert, jeder Klick auf «Anmelden» endet sofort mit block_nested_popups.
  // Darum nach dem Auswerten und vor jedem interaktiven Login selbst aufraeumen.
  bereinigeAuthAntwort(){
    const AUTH_PARAM = /^(code|state|session_state|client_info|error|error_description|error_uri|suberror|id_token|access_token|token_type|expires_in|scope)$/;
    if(!Data.istAuthAntwortInUrl()) return false;
    const query = new URLSearchParams(location.search);
    for(const name of [...query.keys()]) if(AUTH_PARAM.test(name)) query.delete(name);
    const rest = query.toString();
    history.replaceState(null, "", location.pathname + (rest ? "?" + rest : ""));
    return true;
  },

  async init(){
    if(!CONFIG.clientId) throw new Error("clientId fehlt (config.json nicht geladen)");
    msalApp = new msal.PublicClientApplication({
      auth: {
        clientId: CONFIG.clientId,
        authority: "https://login.microsoftonline.com/" + (CONFIG.tenantId || "common"),
        redirectUri: CONFIG.redirectUri
      },
      cache: { cacheLocation: "localStorage" }
    });
    await msalApp.initialize();
    let antwort = null;
    try{
      antwort = await msalApp.handleRedirectPromise();   // Rückkehr vom iPad-Redirect
    }catch(e){
      // Ein hängengebliebener/fremder Redirect-Zustand (z.B. no_token_request_cache_error nach
      // einem unterbrochenen Login) darf den Start nicht blockieren — der Anmelden-Button
      // funktioniert trotzdem, siehe Feinkonzept §7 (kein Netzfehler stoppt die App).
      antwort = null;
    }
    // Eine erfolgreich ausgewertete Antwort raeumt MSAL selbst aus der URL; eine
    // fehlgeschlagene bleibt liegen und blockiert danach jeden Popup-Login. Hier nachfassen.
    Data.bereinigeAuthAntwort();
    if(antwort && antwort.account) msalApp.setActiveAccount(antwort.account);
    else {
      const konten = msalApp.getAllAccounts();
      if(konten.length) msalApp.setActiveAccount(konten[0]);
    }
    return msalApp.getActiveAccount();
  },

  async login(){
    const req = { scopes: ["Files.ReadWrite", "User.Read"] };
    // Selbstheilung: ein schon vergifteter Tab wuerde sonst sofort block_nested_popups werfen.
    Data.bereinigeAuthAntwort();
    if(Data.istIPad()){
      await msalApp.loginRedirect(req);
      return null;   // Seite navigiert weg; Rückkehr läuft über init()/handleRedirectPromise
    }
    const antwort = await msalApp.loginPopup(req);
    msalApp.setActiveAccount(antwort.account);
    return antwort.account;
  },

  logout(){
    const konto = msalApp && msalApp.getActiveAccount();
    if(!konto) return;
    const req = { account: konto };
    Data.istIPad() ? msalApp.logoutRedirect(req) : msalApp.logoutPopup(req);
  },

  async token(){
    const konto = msalApp.getActiveAccount();
    if(!konto) throw new Error("nicht angemeldet");
    const req = { scopes: ["Files.ReadWrite", "User.Read"], account: konto };
    try{
      return (await msalApp.acquireTokenSilent(req)).accessToken;
    }catch(e){
      const antwort = Data.istIPad()
        ? await msalApp.acquireTokenRedirect(req)
        : await msalApp.acquireTokenPopup(req);
      return antwort && antwort.accessToken;
    }
  },

  async readWorkbook(pfad){
    const token = await Data.token();
    const url = "https://graph.microsoft.com/v1.0/me/drive/root:" + encodeURI(pfad) + ":/content";
    const res = await fetch(url, { headers: { Authorization: "Bearer " + token } });
    if(res.status === 404) throw new Error("Datei nicht gefunden: " + pfad);
    if(!res.ok) throw new Error("Graph-Fehler " + res.status + " beim Lesen von " + pfad);
    return await res.arrayBuffer();
  },

  // Metadaten statt Inhalt — fuer die Konflikterkennung (AP-0305/Entscheid O-9): die
  // Workbook-Range-API kennt kein If-Match, darum wird der eTag des Elements selbst als
  // Vergleichsbasis genommen (App.backprotokollSpeichern prueft ihn vor jedem Schreiben neu).
  async getItemMeta(pfad){
    const token = await Data.token();
    const url = "https://graph.microsoft.com/v1.0/me/drive/root:" + encodeURI(pfad) + "?$select=eTag,name";
    const res = await fetch(url, { headers: { Authorization: "Bearer " + token } });
    if(!res.ok) throw new Error("Graph-Fehler " + res.status + " beim Prüfen von " + pfad);
    return await res.json();
  },

  // Legt den Backup-Ordner an, falls er fehlt (AP-0305 Schritt 2). Nimmt an, dass der
  // Elternordner existiert (backupOrdner liegt als Geschwister von Rezepte.xlsx/Rohstoffe.xlsx).
  async ensureOrdner(pfad){
    const token = await Data.token();
    const pruefUrl = "https://graph.microsoft.com/v1.0/me/drive/root:" + encodeURI(pfad);
    const res = await fetch(pruefUrl, { headers: { Authorization: "Bearer " + token } });
    if(res.ok) return true;
    if(res.status !== 404) throw new Error("Graph-Fehler " + res.status + " beim Prüfen von " + pfad);
    const teile = pfad.split("/").filter(Boolean);
    const name = teile.pop();
    const elternPfad = "/" + teile.join("/");
    const anlegenUrl = "https://graph.microsoft.com/v1.0/me/drive/root:" + encodeURI(elternPfad) + ":/children";
    const anlegenRes = await fetch(anlegenUrl, { method: "POST",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ name, folder: {}, "@microsoft.graph.conflictBehavior": "fail" }) });
    // 409 = zwischenzeitlich von anderswo angelegt — auch ok, Ordner existiert jetzt.
    if(!anlegenRes.ok && anlegenRes.status !== 409) throw new Error("Backup-Ordner anlegen fehlgeschlagen (" + anlegenRes.status + ")");
    return true;
  },

  // Kopie vor jedem Schreibzugriff (Feinkonzept §5.3 / CLAUDE.md «nie überschreiben»).
  // Eine Datei pro Tag (AP-0305 Schritt 6) — mehrfaches Speichern am selben Tag ersetzt
  // nur diese eine Tagesdatei, PUT auf den Pfad ist von sich aus ein Upsert.
  async backup(pfad){
    const ordner = CONFIG.backupOrdner || "/Backups";
    await Data.ensureOrdner(ordner);
    const buf = await Data.readWorkbook(pfad);
    const token = await Data.token();
    const name = pfad.split("/").pop();
    const heute = new Date().toISOString().slice(0, 10);
    const zielName = name.replace(/\.xlsx$/i, "") + "_backup_" + heute + ".xlsx";
    const url = "https://graph.microsoft.com/v1.0/me/drive/root:" + encodeURI(ordner + "/" + zielName) + ":/content";
    const res = await fetch(url, { method: "PUT",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/octet-stream" }, body: buf });
    if(!res.ok) throw new Error("Backup fehlgeschlagen (" + res.status + ")");
    return zielName;
  },

  // Schnittstelle für AP-0305 (Speichern). Pilotbefund zum Formatverlust: siehe
  // AP-0302 Dokumentation / Entscheid O-9 — SheetJS-Ganzdatei-PUT verwerfen.
  // Bleibt fuer den AP-0315-Importpfad (ganze neue Zeilen/Blaetter) bestehen; das
  // Backprotokoll selbst schreibt AP-0305 gezielt ueber Data.updateCell().
  async writeWorkbook(pfad, arrayBuffer){
    await Data.backup(pfad);
    const token = await Data.token();
    const url = "https://graph.microsoft.com/v1.0/me/drive/root:" + encodeURI(pfad) + ":/content";
    const res = await fetch(url, { method: "PUT",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/octet-stream" }, body: arrayBuffer });
    if(!res.ok) throw new Error("Schreiben fehlgeschlagen (" + res.status + ")");
    return true;
  },

  // Gezieltes Zell-Update via Microsoft Graph Excel Workbook API (Entscheid O-9, empfohlener
  // Zweig aus dem AP-0302-Pilotbefund): schreibt eine einzelne Zelle im Blatt, ohne die Datei
  // neu zu serialisieren — Dropdowns, fixierte Kopfzeile und alle anderen Spalten bleiben
  // unangetastet, anders als beim SheetJS-Ganzdatei-PUT.
  async updateCell(pfad, sheetName, addr, wert){
    const token = await Data.token();
    const url = "https://graph.microsoft.com/v1.0/me/drive/root:" + encodeURI(pfad)
      + ":/workbook/worksheets('" + encodeURIComponent(sheetName) + "')/range(address='" + addr + "')";
    const res = await fetch(url, { method: "PATCH",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ values: [[wert]] }) });
    if(!res.ok) throw new Error("Zelle " + addr + " schreiben fehlgeschlagen (" + res.status + ")");
    return true;
  }
};

/* ---------- Service: Aussengrenze für LLM-Import + Rohstoff-Recherche (AP-0318) -----------
   Feinkonzept §6b.5 — genau diese vier Funktionen, dahinter beliebiger Dienst (eigene
   Funktion / fertiger Anbieter / lokales Modell). Ohne CONFIG.serviceUrl ist verfuegbar()
   false; jede aufrufende Stelle in View blendet ihre Knoepfe dann komplett aus statt einen
   toten Button zu zeigen (Abnahmekriterium 1). Der Dienst selbst (Server, Schluessel) liegt
   ausserhalb dieses Repos — Entscheid O-7: fertiger Anbieter hinter einer selbst gehosteten
   Azure Function, die den Schluessel haelt. Siehe README.md fuer die Einrichtung. */
const Service = {
  verfuegbar(){ return !!(CONFIG.serviceUrl && String(CONFIG.serviceUrl).trim()); },

  async _aufruf(pfad, body){
    if(!Service.verfuegbar()) throw new Error("Kein Dienst konfiguriert (CONFIG.serviceUrl fehlt)");
    const url = String(CONFIG.serviceUrl).replace(/\/$/, "") + pfad;
    const res = await fetch(url, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error("Dienst antwortete mit " + res.status + " auf " + pfad);
    return res.json();
  },

  // -> { format:"rezept/1", rezepte:[…] } — laeuft wie jede andere Quelle durch Import.pruefen()
  // und den Vorschau-Dialog, bevor irgendetwas uebernommen wird (FR-1210: nie ungeprueft).
  rezeptAusText(text){ return Service._aufruf("/rezept-aus-text", { text }); },
  rezeptAusBild(dataUrl){ return Service._aufruf("/rezept-aus-bild", { bild: dataUrl }); },

  // -> [{ name, kostenProKg, quelle, stand, naehrwerte:{kcal,eiweiss,fett,kh}, gefunden }, …]
  // Roher Vorschlag, kein Schreibzugriff — App.rechercheUebernehmen() schreibt erst nach
  // Freigabe je Zeile, gleiches Prinzip wie AP-0317 ("ohne Beleg kein Wert").
  rohstoffRecherche(namen){ return Service._aufruf("/rohstoff-recherche", { namen }); }
};

// Lädt beide Arbeitsmappen parallel und parst sie ins interne Modell (Model.parse…).
// Haelt die Workbook-Objekte selbst im Rueckgabewert (Store.*Workbook, AP-0315): Import.anhaengen()
// und Import.aliasAnhaengen() mutieren gezielt Zellen/Zeilen desselben Objekts weiter, statt es aus
// den geparsten Daten neu zusammenzubauen — damit bleiben unbekannte Spalten/Blätter erhalten (§3.2).
async function loadWorkbooks(){
  const [rezBuf, rohBuf] = await Promise.all([
    Data.readWorkbook(CONFIG.rezeptePfad),
    Data.readWorkbook(CONFIG.rohstoffePfad)
  ]);
  const rezWb = XLSX.read(rezBuf, { type: "array", cellDates: true });
  const rohWb = XLSX.read(rohBuf, { type: "array", cellDates: true });
  const rezSheetName = rezWb.SheetNames[0];
  const rohSheetName = rohWb.SheetNames[0];
  const rezAoa = XLSX.utils.sheet_to_json(rezWb.Sheets[rezSheetName], { header: 1, raw: true, defval: null });
  const rohAoa = XLSX.utils.sheet_to_json(rohWb.Sheets[rohSheetName], { header: 1, raw: true, defval: null });
  const rohstoffe = Model.parseRohstoffe(rohAoa);
  const { rezepte, fehlerhaft } = Model.parseRezepte(rezAoa);
  const aliasBlatt = rohWb.Sheets["Aliase"];
  const geladeneAliase = aliasBlatt
    ? Model.parseAliase(XLSX.utils.sheet_to_json(aliasBlatt, { header: 1, raw: true, defval: null }))
    : {};
  return { rohstoffe, rezepte, fehlerhaft, geladeneAliase, rezWb, rezSheetName, rohWb, rohSheetName };
}

/* ---------- Import: Austauschformat rezept/1, Pruefung, Vorschau, Uebernahme -----------
   AP-0315. Ablauf identisch fuer jeden Zulieferer (Feinkonzept §6b.2):
   parsen -> pruefen (Schema) -> Rohstoffe aufloesen -> Vorschau -> uebernehmen.
   Import ruft Data nie direkt auf — das Schreiben nach OneDrive bleibt Sache von App. */
const Import = {
  EINHEITEN: ["g","kg","ml","l","stk"],

  parseJSON(text){
    try{ return { ok:true, daten: JSON.parse(text) }; }
    catch(e){ return { ok:false, fehler:[{ pfad:"(Datei)", meldung:"ungültiges JSON — " + e.message }] }; }
  },

  // Phasen-Validierung als eigene Funktion, geteilt zwischen der vollen rezept/1-Pruefung
  // (Import.pruefen, unten) und der Versions-Bearbeitung im Entwicklungsmodus
  // (App.versionSpeichern, AP-0311/§3) — dort wird nur eine einzelne phasen-Liste eingegeben,
  // kein ganzes Rezept. praefix ist der Pfad-Anfang in den gemeldeten Fehlern, z.B.
  // "rezepte[0].phasen" bzw. schlicht "phasen" fuer die Versions-Bearbeitung.
  phasenFehler(phasen, praefix){
    praefix = praefix || "phasen";
    const fehler = [];
    const err = (pfad, meldung) => fehler.push({ pfad, meldung });
    const text = (pfad, wert) => { if(typeof wert !== "string" || !wert.trim()) err(pfad, "fehlt oder leer"); };
    const zahlPos = (pfad, wert) => { if(typeof wert !== "number" || !isFinite(wert) || wert <= 0) err(pfad, "fehlt oder keine Zahl > 0"); };
    const zahl = (pfad, wert) => { if(typeof wert !== "number" || !isFinite(wert)) err(pfad, "fehlt oder keine Zahl"); };
    if(!Array.isArray(phasen) || !phasen.length){
      err(praefix, "fehlt, leer oder kein Array — mindestens 1 Phase nötig");
      return fehler;
    }
    phasen.forEach((ph, pi) => {
      const pp = `${praefix}[${pi}]`;
      if(ph == null || typeof ph !== "object"){ err(pp, "kein Objekt"); return; }
      text(`${pp}.name`, ph.name);
      if(!Array.isArray(ph.zutaten)) err(`${pp}.zutaten`, "kein Array");
      else ph.zutaten.forEach((z, zi) => {
        const zp = `${pp}.zutaten[${zi}]`;
        if(z == null || typeof z !== "object"){ err(zp, "kein Objekt"); return; }
        text(`${zp}.name`, z.name);
        zahlPos(`${zp}.prozent`, z.prozent);
        if(!Import.EINHEITEN.includes(z.einheit)) err(`${zp}.einheit`, `nicht in [${Import.EINHEITEN.join(", ")}]`);
      });
      if(!Array.isArray(ph.schritte)) err(`${pp}.schritte`, "kein Array");
      else ph.schritte.forEach((s, si) => {
        const sp = `${pp}.schritte[${si}]`;
        if(s == null || typeof s !== "object"){ err(sp, "kein Objekt"); return; }
        zahl(`${sp}.nr`, s.nr);
        text(`${sp}.text`, s.text);
      });
    });
    return fehler;
  },

  // Schema-Pruefung gegen rezept/1 (FORMAT.md). Sammelt ALLE Fehler in einem Durchgang statt
  // beim ersten abzubrechen, damit eine fehlerhafte Datei auf einmal korrigierbar ist. Jeder
  // Fehler nennt Feld UND Position (Array-Index im pfad, z.B. rezepte[0].phasen[1].zutaten[2]).
  pruefen(daten){
    if(daten == null || typeof daten !== "object")
      return { ok:false, fehler:[{ pfad:"(Wurzel)", meldung:"keine gültige JSON-Struktur" }] };

    const fehler = [];
    const err = (pfad, meldung) => fehler.push({ pfad, meldung });
    const text = (pfad, wert) => { if(typeof wert !== "string" || !wert.trim()) err(pfad, "fehlt oder leer"); };
    const zahlPos = (pfad, wert) => { if(typeof wert !== "number" || !isFinite(wert) || wert <= 0) err(pfad, "fehlt oder keine Zahl > 0"); };

    if(daten.format !== "rezept/1") err("format", `erwartet "rezept/1", gefunden ${JSON.stringify(daten.format)}`);
    if(!Array.isArray(daten.rezepte) || !daten.rezepte.length) err("rezepte", "fehlt, leer oder kein Array — mindestens 1 Rezept nötig");

    (daten.rezepte || []).forEach((rz, ri) => {
      const p = `rezepte[${ri}]`;
      if(rz == null || typeof rz !== "object"){ err(p, "kein Objekt"); return; }
      text(`${p}.name`, rz.name);
      text(`${p}.kategorie`, rz.kategorie);
      text(`${p}.basisName`, rz.basisName);
      zahlPos(`${p}.basisMengeG`, rz.basisMengeG);
      zahlPos(`${p}.sollgewichtG`, rz.sollgewichtG);
      zahlPos(`${p}.portionen`, rz.portionen);
      text(`${p}.einheit`, rz.einheit);

      fehler.push(...Import.phasenFehler(rz.phasen, `${p}.phasen`));

      if(rz.backprotokoll != null){
        if(!Array.isArray(rz.backprotokoll)) err(`${p}.backprotokoll`, "kein Array");
        else rz.backprotokoll.forEach((e, ei) => {
          const ep = `${p}.backprotokoll[${ei}]`;
          if(e == null || typeof e !== "object"){ err(ep, "kein Objekt"); return; }
          if(typeof e.datum !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(e.datum)) err(`${ep}.datum`, "fehlt oder kein Format JJJJ-MM-TT");
          zahlPos(`${ep}.sollG`, e.sollG);
          zahlPos(`${ep}.istG`, e.istG);
        });
      }
    });

    return { ok: fehler.length === 0, fehler };
  },

  // Entfernt Laufzeitfelder aus einer phasen-Liste (nameKey/rohstoff je Zutat gibt es hier
  // gar nicht erst, aber ueberzaehlige Felder aus einer Entwicklungsversion schon) — geteilt
  // zwischen rezeptZeile()/alsExport() (Feinkonzept §3.2) und der Versions-Speicherung im
  // Entwicklungsmodus (App.versionSpeichern, AP-0311/§3), die dieselbe Form braucht.
  phasenExport(phasen){
    return phasen.map(ph => ({
      name: ph.name,
      zutaten: (ph.zutaten || []).map(z => ({ name: z.name, prozent: z.prozent, einheit: z.einheit })),
      schritte: (ph.schritte || []).map(s => ({ nr: s.nr, text: s.text }))
    }));
  },

  // Wandelt ein rezept/1-Rezept ins interne Modell (Feinkonzept §3) mit Defaults fuer optionale
  // Felder. _raw bleibt null — es gibt noch keine Excel-Zeile (§3.2 gilt erst nach dem Schreiben).
  zuIntern(rz){
    return {
      id: null, name: rz.name, kategorie: rz.kategorie, unterkategorie: rz.unterkategorie || null,
      quelle: rz.quelle || null, basisName: rz.basisName, basisMengeG: rz.basisMengeG,
      sollgewichtG: rz.sollgewichtG, portionen: rz.portionen, einheit: rz.einheit,
      phasen: rz.phasen.map(ph => ({
        name: ph.name,
        zutaten: (ph.zutaten || []).map(z => ({ name: z.name, prozent: z.prozent, einheit: z.einheit })),
        schritte: (ph.schritte || []).map(s => ({ nr: s.nr, text: s.text }))
      })),
      backprotokoll: (rz.backprotokoll || []).map(e => ({ datum: e.datum, sollG: e.sollG, istG: e.istG, notizen: e.notizen || null })),
      entwicklung: rz.entwicklung || null,
      _raw: null
    };
  },

  // Sammelt Zutatennamen, die sich gegen keinen bekannten Rohstoff aufloesen lassen (§6b.3).
  unbekannteNamen(rezepteIntern, rohstoffe){
    const idx = Model.rohstoffIndex(rohstoffe);
    const namen = new Set();
    rezepteIntern.forEach(rz => rz.phasen.forEach(ph => ph.zutaten.forEach(z => {
      if(!idx.has(Model.nameKey(z.name))) namen.add(z.name);
    })));
    return [...namen].sort((a,b) => a.localeCompare(b, "de"));
  },

  // Gleichnamige Rezepte im Bestand (FR-1205) — nie stillschweigend ueberschreiben, sondern
  // der Rueckfrage im Dialog vorlegen. index = Position in rezepteIntern (fuer die UI-Zuordnung).
  konflikte(rezepteIntern, bestehende){
    const treffer = [];
    rezepteIntern.forEach((rz, index) => {
      const bestehend = bestehende.find(b => Model.normKey(b.name) === Model.normKey(rz.name));
      if(bestehend) treffer.push({ index, neu: rz, bestehend });
    });
    return treffer;
  },

  naechsteId(bestehende, praefix){
    praefix = praefix || "RZP-";
    let max = 0;
    bestehende.forEach(r => {
      const m = /^([A-Za-z]+)-(\d+)$/.exec(r.id || "");
      if(m && (praefix === m[1] + "-")) max = Math.max(max, parseInt(m[2], 10));
    });
    return praefix + String(max + 1).padStart(3, "0");
  },

  // Export: Kehrfunktion zu zuIntern — entfernt Laufzeitfelder (_raw, nameKey, rohstoff je
  // Zutat). Export -> Import derselben Datei muss denselben Bestand ergeben (Rundlauf, Abnahme).
  alsExport(rz){
    return {
      name: rz.name, kategorie: rz.kategorie, unterkategorie: rz.unterkategorie,
      quelle: rz.quelle, basisName: rz.basisName, basisMengeG: rz.basisMengeG,
      sollgewichtG: rz.sollgewichtG, portionen: rz.portionen, einheit: rz.einheit,
      phasen: Import.phasenExport(rz.phasen),
      backprotokoll: (rz.backprotokoll || []).map(e => ({ datum: e.datum, sollG: e.sollG, istG: e.istG, notizen: e.notizen != null ? e.notizen : null })),
      entwicklung: rz.entwicklung || null
    };
  },
  alsExportAlle(rezepte){
    return { format: "rezept/1", rezepte: rezepte.map(Import.alsExport) };
  },

  // Regelbasierte Vorstufe (Umsetzungsschritt 7, FR-1209/Ausbau) — kein Anspruch auf
  // Vollstaendigkeit. Erkennt "<Menge> <Einheit> <Name>" als Zutat, kurze Zeilen ohne Menge als
  // Phasenueberschrift, "1." / "1)" am Zeilenanfang als nummerierten Schritt. Freitext liefert
  // ABSOLUTE Mengen, keine Baeckerprozente — prozent bleibt bewusst null ("Unklares bleibt leer")
  // und die anschliessende Pruefung() zeigt exakt, was von Hand ergaenzt werden muss (Feld+Position).
  freitextZerlegen(text){
    const MENGE_RE = /^(\d+(?:[.,]\d+)?)\s*(g|kg|ml|l|stk)\b\s+(.+)$/i;
    const SCHRITT_RE = /^(\d+)[.)]\s+(.+)$/;
    const UEBERSCHRIFT_RE = /^[^\d]{1,40}:?$/;
    const zeilen = String(text || "").split(/\r?\n/).map(z => z.trim()).filter(Boolean);
    const phasen = [];
    let aktuell = null;
    const neuePhase = (name) => { aktuell = { name: name.replace(/:$/,""), zutaten:[], schritte:[] }; phasen.push(aktuell); };
    for(const zeile of zeilen){
      const mMenge = MENGE_RE.exec(zeile);
      const mSchritt = !mMenge && SCHRITT_RE.exec(zeile);
      if(mMenge){
        if(!aktuell) neuePhase("Zutaten");
        aktuell.zutaten.push({ name: mMenge[3].trim(), prozent: null, einheit: mMenge[2].toLowerCase() });
      }else if(mSchritt){
        if(!aktuell) neuePhase("Zubereitung");
        aktuell.schritte.push({ nr: parseInt(mSchritt[1], 10), text: mSchritt[2].trim() });
      }else if(UEBERSCHRIFT_RE.test(zeile)){
        neuePhase(zeile);
      }
      // alles andere ist nicht sicher zuordenbar und bleibt unberuecksichtigt (Prinzip §6b.4)
    }
    return {
      format: "rezept/1",
      rezepte: [{
        name: "", kategorie: "", unterkategorie: null, quelle: null,
        basisName: "", basisMengeG: null, sollgewichtG: null, portionen: null, einheit: "Stk",
        phasen, backprotokoll: [], entwicklung: null
      }]
    };
  },

  // ---- Uebernahme: Zeilen im geladenen Workbook anlegen/ersetzen (§3.2, §5.3 Schritt 1) ----
  // Baut eine Zeile passend zur tatsaechlichen Spaltenreihenfolge der Datei (header), nicht zu
  // einer fest angenommenen — unbekannte Spalten bleiben dadurch unberuehrt/leer statt verschoben.
  rezeptZeile(header, rz){
    const row = new Array(header.length).fill(null);
    const setz = (name, wert) => { const i = header.indexOf(name); if(i > -1) row[i] = wert; };
    setz("Rezept-ID", rz.id);
    setz("Name", rz.name);
    setz("Kategorie", rz.kategorie);
    setz("Unterkategorie", rz.unterkategorie);
    setz("Basis-Rohstoff", rz.basisName);
    setz("Basis-Menge (g)", rz.basisMengeG);
    setz("Sollgewicht (g)", rz.sollgewichtG);
    setz("Portionen", rz.portionen);
    setz("Einheit", rz.einheit);
    setz("Quelle", rz.quelle);
    setz("Phasen (JSON)", JSON.stringify(Import.phasenExport(rz.phasen)));
    setz("Backprotokoll (JSON)", JSON.stringify(rz.backprotokoll || []));
    // AP-0311: nur schreiben, wenn tatsaechlich etwas da ist — setz() selbst ist bereits ein
    // No-op, falls die Spalte in dieser Datei (noch) fehlt.
    setz("Entwicklung (JSON)", rz.entwicklung ? JSON.stringify(rz.entwicklung) : null);
    return row;
  },

  // Neues Rezept: Zeile ans Ende des Blatts anhaengen (kein neu geschriebenes Blatt — bestehende
  // Zeilen/Formatierung bleiben unangetastet ausser der einen neuen Zeile).
  anhaengen(workbook, sheetName, rz){
    const sheet = workbook.Sheets[sheetName];
    const header = (XLSX.utils.sheet_to_json(sheet, { header:1, raw:true, defval:null })[0]) || [];
    XLSX.utils.sheet_add_aoa(sheet, [Import.rezeptZeile(header, rz)], { origin: -1 });
    return workbook;
  },

  // Alias-Blatt (Schritt 4): eigenes Blatt "Aliase" in Rohstoffe.xlsx, nicht localStorage — muss
  // geraeteuebergreifend wirken. Legt das Blatt beim allerersten gelernten Alias an.
  aliasAnhaengen(workbook, variante, ziel, datum){
    let sheet = workbook.Sheets["Aliase"];
    if(!sheet){
      sheet = XLSX.utils.aoa_to_sheet([["Variante","Zielname","Gelernt am"]]);
      XLSX.utils.book_append_sheet(workbook, sheet, "Aliase");
    }
    XLSX.utils.sheet_add_aoa(sheet, [[variante, ziel, datum]], { origin: -1 });
    return workbook;
  },

  // Namenskonflikt, Weg B: als Version an ein bestehendes Rezept anhaengen statt ein neues
  // anzulegen (FR-1205). Rueckgabe ist die aktualisierte `entwicklung`-Struktur des bestehenden
  // Rezepts. Hinweis auf den offenen Punkt (kein Excel-Feld dafuer) steht in der Dokumentation.
  alsVersionAnhaengen(bestehendesRezept, neueVersion, datum){
    const entwicklung = bestehendesRezept.entwicklung || { status:"entwicklung", zielwerte:{}, versionen:[], versuche:[] };
    const naechsteV = (entwicklung.versionen || []).reduce((m,v) => Math.max(m, v.v || 0), 0) + 1;
    entwicklung.versionen = [...(entwicklung.versionen || []), {
      v: naechsteV, datum, notiz: "Import: " + (neueVersion.quelle || "ohne Quelle"), phasen: neueVersion.phasen
    }];
    return entwicklung;
  },

  alsArrayBuffer(workbook){
    return XLSX.write(workbook, { type: "array", bookType: "xlsx" });
  },

  /* ---------- Excel-Altdatei-Erkenner (AP-0316) --------------------------------------
     Erkenner, kein Rater (Feinkonzept §6b.4): liest ein Blatt einer Bestandsdatei nach dem
     in AP-0101 erhobenen Muster (Kopfzeile "Sollgewicht", %-Spalte, Teigphasen-Spalten) und
     liefert ein rezept/1-Rezept ODER — wenn das Muster nicht passt — nichts. Nichts wird
     geschaetzt: was nicht sicher zuordenbar ist, bleibt im Protokoll (nicht_zugeordnet) und
     fehlt im Rezept, sodass Import.pruefen() es beim Uebernehmen sichtbar einfordert statt
     es stillschweigend mit einem falschen Wert zu fuellen (Abnahmekriterium AP-0316).
     Reine Datenfunktion (aoa = Array-of-Arrays wie XLSX.utils.sheet_to_json({header:1})) —
     ohne DOM/XLSX-Abhaengigkeit, damit sie ausserhalb des Browsers testbar bleibt. */
  excelBlattErkennen(blattname, aoa, kontext){
    kontext = kontext || {};
    const protokoll = { blatt: blattname, status: null, uebernommen: [], geraten: [], nicht_zugeordnet: [] };
    const zeile = (i) => aoa[i] || [];
    const istLeer = (v) => v === null || v === undefined || v === "";
    const istZahl = (v) => typeof v === "number" && isFinite(v);
    const merkeUebernommen = (z, feld, wert) => protokoll.uebernommen.push({ zeile: z, feld, wert: String(wert) });
    const merkeOffen = (z, grund) => protokoll.nicht_zugeordnet.push({ zeile: z, grund });

    // 1. Kopfzeile (Excel-Zeile 1): "Sollgewicht" in A1 ist der verlaessliche Anker dieses Musters.
    const kopf = zeile(0);
    if(!(typeof kopf[0] === "string" && kopf[0].trim().toLowerCase() === "sollgewicht")){
      protokoll.status = "kopf_nicht_erkannt";
      merkeOffen(1, "kein Label \"Sollgewicht\" in Zelle A1 — Blatt entspricht nicht dem erkannten Grundmuster, keine automatische Uebernahme");
      return { rezept: null, protokoll };
    }
    const portionen = istZahl(kopf[1]) ? kopf[1] : null;
    let sollgewichtG = null;
    for(let c = kopf.length - 1; c >= 2; c--){ if(istZahl(kopf[c])){ sollgewichtG = kopf[c]; break; } }
    portionen != null ? merkeUebernommen(1, "portionen", portionen) : merkeOffen(1, "Portionenzahl (Zelle B1) fehlt oder keine Zahl");
    sollgewichtG != null ? merkeUebernommen(1, "sollgewichtG", sollgewichtG) : merkeOffen(1, "Sollgewicht gesamt in der Kopfzeile nicht gefunden");

    // 2. Spaltenkoepfe: die %-Kopfzeile folgt meist direkt auf Zeile 1, manchmal liegt eine
    //    Leerzeile dazwischen (reale Datei St. Galler Bürli) — deshalb gesucht statt angenommen,
    //    begrenzt auf ein kleines Fenster, damit eine ganz andere Struktur nicht "gefunden" wird.
    let headerZeile = -1;
    for(let r = 1; r < Math.min(aoa.length, 6); r++){
      if(zeile(r).some(v => typeof v === "string" && v.trim() === "%")){ headerZeile = r; break; }
    }
    if(headerZeile === -1){
      protokoll.status = "prozentkopf_nicht_gefunden";
      merkeOffen(2, "keine Kopfzeile mit \"%\"-Spalte in den ersten Zeilen nach der Sollgewicht-Zeile gefunden");
      return { rezept: null, protokoll };
    }
    const header = zeile(headerZeile);
    const phasenSpalten = [];
    { let c = 4;
      while(c < header.length && istLeer(header[c])) c++;
      while(c < header.length && typeof header[c] === "string" && header[c].trim() && header[c].trim() !== "%"){
        phasenSpalten.push({ index: c, name: header[c].trim() });
        c++;
      }
    }

    // 3. Zutatenzeilen direkt nach der Kopfzeile: Name in Spalte A + Prozentwert 0–300% in
    //    Spalte B. Leerzeilen dazwischen werden uebersprungen, nicht als Tabellenende gewertet;
    //    die erste NICHT leere Zeile, die trotzdem nicht passt (Summenzeile, Text), beendet die Tabelle.
    const zutatenRoh = [];
    let naechsteZeile = headerZeile + 1;
    for(; naechsteZeile < aoa.length; naechsteZeile++){
      const r = zeile(naechsteZeile);
      if(r.every(istLeer)) continue;
      const name = typeof r[0] === "string" ? r[0].trim() : "";
      const prozent = r[1];
      if(name && istZahl(prozent) && prozent > 0 && prozent < 3){
        zutatenRoh.push({
          zeileNr: naechsteZeile + 1, name, absMengeG: istZahl(r[2]) ? r[2] : null,
          einheit: typeof r[3] === "string" && r[3].trim() ? r[3].trim().toLowerCase() : "g",
          zellen: r
        });
      } else break;
    }
    if(!zutatenRoh.length){
      protokoll.status = "keine_zutaten_erkannt";
      merkeOffen(3, "keine Zutatenzeile erkannt (Spalte A Name + Spalte B Prozent zwischen 0 und 300%)");
      return { rezept: null, protokoll };
    }

    // 4. Phasenspalten verifizieren: Werte darunter muessen ueberwiegend Gramm-Groessenordnung
    //    (>= 1) haben — sonst ist es keine Mengenspalte, sondern z.B. eine zweite %-Spalte
    //    (siehe Gelato-Beispiel, Spalte "Grundrezept": enthaelt Prozentwerte, keine Gramm).
    const phasenGueltig = phasenSpalten.filter(ps => {
      const werte = zutatenRoh.map(z => z.zellen[ps.index]).filter(istZahl);
      if(!werte.length) return false;
      return werte.filter(w => w >= 1).length >= werte.length / 2;
    });

    // 5. Basis-Rohstoff = schwerste Zutat (groesste absolute Menge). Strukturelle Regel, keine
    //    Ernaehrungs-/Rezept-Annahme: liefert bei Backwaren meist das Mehl, bei Eis die Basisfluessigkeit.
    const basis = zutatenRoh.reduce((max, z) => (z.absMengeG != null && (max == null || z.absMengeG > max.absMengeG)) ? z : max, null);
    const basisMengeG = basis && basis.absMengeG != null ? basis.absMengeG : null;
    if(basisMengeG == null){
      protokoll.status = "basis_nicht_bestimmbar";
      merkeOffen(basis ? basis.zeileNr : 3, "keine Zutat mit erkennbarer Menge in Gramm — Basis-Rohstoff und Baeckerprozent nicht berechenbar");
      return { rezept: null, protokoll };
    }
    merkeUebernommen(basis.zeileNr, "basisName/basisMengeG", basis.name + " / " + basisMengeG + " g (schwerste Zutat)");

    // 6. Phasen aus den Zutatenzeilen aufbauen.
    const phasen = [];
    if(phasenGueltig.length){
      phasenGueltig.forEach(ps => {
        const zutaten = [];
        zutatenRoh.forEach(z => {
          const wert = z.zellen[ps.index];
          if(istZahl(wert) && wert > 0){
            zutaten.push({ name: z.name, prozent: wert / basisMengeG, einheit: z.einheit });
            merkeUebernommen(z.zeileNr, `Phase "${ps.name}"`, z.name + ": " + wert + " g");
          }
        });
        if(zutaten.length) phasen.push({ name: ps.name, zutaten, schritte: [] });
      });
      zutatenRoh.forEach(z => {
        const inPhase = phasenGueltig.some(ps => istZahl(z.zellen[ps.index]) && z.zellen[ps.index] > 0);
        if(!inPhase) merkeOffen(z.zeileNr, `Zutat "${z.name}" keiner erkannten Phase zuordenbar`);
      });
    } else {
      const zutaten = zutatenRoh.filter(z => z.absMengeG != null)
        .map(z => ({ name: z.name, prozent: z.absMengeG / basisMengeG, einheit: z.einheit }));
      zutatenRoh.forEach(z => { if(z.absMengeG == null) merkeOffen(z.zeileNr, `Zutat "${z.name}" hat keine erkennbare Menge in Gramm (Spalte C)`); });
      if(zutaten.length) phasen.push({ name: "Zutaten", zutaten, schritte: [] });
      merkeUebernommen(2, "Phasen", "keine Phasenspalten erkannt — eine generische Phase \"Zutaten\" angelegt");
    }

    // 7. Schritte/Ueberschriften unterhalb der Zutatentabelle: Zeilen mit genau einer gefuellten
    //    Zelle in Spalte A. Eine kurze, ziffern- und punktfreie Zeile (<=40 Zeichen) ist eine
    //    Ueberschrift; alles andere sind Schritte der zuletzt eroeffneten Phase (§6b.4 — bleibt
    //    unsicher Zuordenbares stehen, wird nichts in eine Phase gezwungen, landet es im Protokoll).
    const UEBERSCHRIFT_RE = /^[^\n\d.]{1,40}$/;
    // Eine Textzeile "Hauptteig\n…" nach einer bereits aus den Phasenspalten erkannten Phase
    // gleichen Namens (haeufig, siehe Bürli-Beispiel) erweitert dieselbe Phase um ihre Schritte,
    // statt eine zweite gleichnamige Phase anzulegen.
    const phaseHolen = (name) => {
      let ph = phasen.find(p => p.name === name);
      if(!ph){ ph = { name, zutaten: [], schritte: [] }; phasen.push(ph); }
      return ph;
    };
    let aktuellePhase = null;
    for(let r = naechsteZeile; r < aoa.length; r++){
      const row = zeile(r);
      const nichtleer = row.filter(v => !istLeer(v));
      if(nichtleer.length !== 1 || typeof row[0] !== "string" || !row[0].trim()){
        if(nichtleer.length) merkeOffen(r + 1, "Zeile unterhalb der Zutatentabelle nicht eindeutig als Ueberschrift oder Textblock erkannt");
        continue;
      }
      const zeilen = row[0].trim().split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if(zeilen.length > 1 && UEBERSCHRIFT_RE.test(zeilen[0])){
        aktuellePhase = phaseHolen(zeilen[0]);
        zeilen.slice(1).forEach(s => aktuellePhase.schritte.push({ nr: aktuellePhase.schritte.length + 1, text: s }));
        merkeUebernommen(r + 1, "Phase + Schritte aus Text", zeilen[0] + " (" + (zeilen.length - 1) + " Schritt(e))");
      }else if(zeilen.length === 1 && UEBERSCHRIFT_RE.test(zeilen[0])){
        aktuellePhase = phaseHolen(zeilen[0]);
        merkeUebernommen(r + 1, "Phasenueberschrift", zeilen[0]);
      }else{
        if(!aktuellePhase) aktuellePhase = phaseHolen("Zubereitung");
        zeilen.forEach(s => aktuellePhase.schritte.push({ nr: aktuellePhase.schritte.length + 1, text: s }));
        merkeUebernommen(r + 1, "Schritte", zeilen.length + " Zeile(n) zu Phase \"" + aktuellePhase.name + "\"");
      }
    }

    // Ueberschriften-Phasen ohne Inhalt (z.B. "ANLEITUNG" als reiner Abschnittstitel) verwerfen.
    const phasenBereinigt = phasen.filter(ph => ph.zutaten.length || ph.schritte.length);
    if(!phasenBereinigt.length){
      protokoll.status = "keine_verwertbaren_phasen";
      return { rezept: null, protokoll };
    }

    const kategorie = kontext.kategorieHinweis || "";
    if(kategorie) merkeUebernommen(0, "kategorie", kategorie + " (aus Ordnername)");
    else merkeOffen(0, "Kategorie nicht bestimmbar (Datei liegt nicht in einem Kategorie-Ordner oder Ordner unbekannt)");

    const rezept = {
      name: blattname, kategorie, unterkategorie: null,
      quelle: "Excel-Import: " + (kontext.dateipfad || "") + " / " + blattname,
      basisName: basis.name, basisMengeG, sollgewichtG, portionen,
      // Einheit ist keine Zutatsannahme, sondern eine System-Konvention (wie in allen Beispieldaten):
      // ohne eigene %-Spalte fuer Stueckzahl-Einheiten gibt es dafuer kein sichereres Signal in der Datei.
      einheit: "Stk",
      phasen: phasenBereinigt, backprotokoll: [], entwicklung: null
    };
    protokoll.status = "erkannt";
    return { rezept, protokoll };
  },

  // Wrapper fuer den Browser: liest alle Blaetter einer geladenen Arbeitsmappe und erkennt
  // jedes einzeln. Blaetter ausserhalb des Musters (Rechner, Umrechnungsfaktoren, Protokoll, …)
  // liefern schlicht kein Rezept und stehen mit Grund im Protokoll — keine Sonderbehandlung noetig.
  excelDateiErkennen(workbook, dateipfad, kategorieHinweis){
    const rezepte = [];
    const protokolle = [];
    workbook.SheetNames.forEach(blattname => {
      const aoa = XLSX.utils.sheet_to_json(workbook.Sheets[blattname], { header: 1, raw: true, defval: null });
      const { rezept, protokoll } = Import.excelBlattErkennen(blattname, aoa, { dateipfad, kategorieHinweis });
      protokolle.push(protokoll);
      if(rezept) rezepte.push(rezept);
    });
    return { format: "rezept/1", rezepte, protokolle, dateipfad };
  }
};

/* ---------- Editor: reine Regeln des Zutaten-Editors (AP-0305) --------------------
   Kein DOM, kein Netz, kein Store-Schreibzugriff — nur Store.rohstoffe wird lesend
   herangezogen (V-3, dieselbe Quelle wie Model.aufloesen). Feldumfang nach
   Umsetzungsschritt 1 des AP: Zutat, Menge, Einheit, Bäckerprozent, Zubereitungsschritte.
   Kopfdaten und Phasen selbst (anlegen/umbenennen/entfernen) bleiben ausserhalb dieses
   AP — sie tragen keine der vier Feldarten und sind in AP-0203 §1.2/§1.3 als eigene,
   spätere Erweiterung vermerkt (§9 dort nennt nur "Rezept als Kopie", nicht Phasenverwaltung;
   die App liest die Konzept-Feldtabelle wörtlich: nur Zutaten- und Schrittfelder gelten
   hier als "in der App bearbeitbar"). */
const Editor = {
  // Vergibt Schritt-Nummern fortlaufend neu (§1.5) und liefert eine laufzeitfeldfreie
  // Kopie der Phasen — Grundlage sowohl fuer die Pruefung als auch fuer den Schreibvorgang.
  // Trimmt, filtert aber NICHTS heraus (auch keine leeren Namen/Texte): eine leere Zeile
  // soll die Pruefung sehen und abweisen (V-1/V-7), nicht stillschweigend verschwinden.
  normalisiert(phasen){
    return (phasen || []).map(ph => ({
      name: ph.name,
      zutaten: (ph.zutaten || []).map(z => ({
        name: typeof z.name === "string" ? z.name.trim() : z.name,
        prozent: z.prozent === "" || z.prozent == null ? null : Number(z.prozent),
        einheit: z.einheit
      })),
      schritte: (ph.schritte || []).map((s, i) => ({
        nr: i + 1,
        text: typeof s.text === "string" ? s.text.trim() : s.text
      }))
    }));
  },

  // AP-0203 §2, beschränkt auf die in diesem AP editierbaren Felder (siehe Kopfkommentar).
  // V-5/V-6/V-9 betreffen Kopf-/Phasenfelder ausserhalb dieses Umfangs — hier nichts zu
  // pruefen. V-4b (versch. Phasen) ist "durchlassen", braucht keine aktive Pruefung.
  pruefen(phasen, rz){
    const abweisen = [], warnen = [];
    const add = (arr, feld, grund, extra) => arr.push(Object.assign({ feld, grund }, extra || {}));

    // V-1 (Menge), V-7 (Schritt-Text), V-8 (Einheit): Feldform je Zeile, dieselbe Pruefung
    // wie beim Import (Import.phasenFehler), hier auf Klartext uebersetzt (Feld + Grund).
    Import.phasenFehler(phasen, "phasen").forEach(f => {
      if(/\.prozent$/.test(f.pfad)) add(abweisen, "Menge", "Menge muss grösser als 0 sein.");
      else if(/zutaten\[\d+\]\.name$/.test(f.pfad)) add(abweisen, "Zutat", "Name darf nicht leer sein.");
      else if(/\.einheit$/.test(f.pfad)) add(abweisen, "Einheit", `Einheit muss eine von ${Import.EINHEITEN.join(", ")} sein.`);
      else if(/schritte\[\d+\]\.text$/.test(f.pfad)) add(abweisen, "Zubereitungsschritt", "Text darf nicht leer sein — leere Zeile stattdessen entfernen.");
      else add(abweisen, f.pfad, f.meldung);
    });

    // V-2: ohne den aktuellen Basis-Rohstoff unter den Zutaten ist kein Bäckerprozent rechenbar.
    // basisName selbst ist in diesem AP nicht editierbar — die Regel schuetzt ihn davor, durch
    // Entfernen/Umbenennen der Zutat zu verwaisen.
    const alleNamen = new Set();
    phasen.forEach(ph => (ph.zutaten || []).forEach(z => { if(z.name) alleNamen.add(Model.nameKey(z.name)); }));
    if(!rz.basisName || !alleNamen.has(Model.nameKey(rz.basisName))){
      add(abweisen, "Basis-Rohstoff",
        `Ohne Basis-Rohstoff „${rz.basisName || "—"}“ unter den Zutaten lässt sich kein Bäckerprozent rechnen. `
        + `Zutat nicht entfernen oder umbenennen.`);
    }

    // V-3: unaufgeloeste Rohstoffe — warnen, nicht abweisen (O-11: viele Rohstoff-Konzepte fehlen noch).
    const idx = Model.rohstoffIndex(Store.rohstoffe);
    const unbekannt = new Set();
    phasen.forEach(ph => (ph.zutaten || []).forEach(z => {
      if(z.name && !idx.get(Model.nameKey(z.name))) unbekannt.add(z.name);
    }));
    if(unbekannt.size) add(warnen, "Zutat",
      `${unbekannt.size} Zutat(en) sind keinem Rohstoff zugeordnet — Kosten und Nährwerte bleiben für diese Zeilen leer: ${[...unbekannt].join(", ")}`);

    // V-4: dieselbe Zutat mehrfach in derselben Phase — warnen, mit Aktion "zusammenfassen"
    // (App.zutatenEditorZusammenfassen). V-4b (verschiedene Phasen) bleibt unerwaehnt (durchlassen).
    phasen.forEach((ph, pi) => {
      const gesehen = new Map();
      (ph.zutaten || []).forEach(z => {
        const k = z.name && Model.nameKey(z.name);
        if(!k) return;
        gesehen.set(k, (gesehen.get(k) || 0) + 1);
      });
      gesehen.forEach((n, k) => { if(n > 1) add(warnen, "Zutat",
        `„${k}“ kommt in Phase „${ph.name}“ ${n}× vor — zusammenfassen?`, { phaseIndex: pi, nameKey: k }); });
    });

    // V-10: Summe der Zutatenmengen weicht > 20% vom Sollgewicht ab — Schwund/Flüssigkeitsverlust
    // sind haeufig richtig, deshalb nur Hinweis.
    if(rz.basisMengeG > 0 && rz.sollgewichtG > 0){
      const summeG = phasen.reduce((s, ph) => s + (ph.zutaten || [])
        .reduce((s2, z) => s2 + (Number(z.prozent) || 0) * rz.basisMengeG, 0), 0);
      const abwPct = Math.abs(summeG - rz.sollgewichtG) / rz.sollgewichtG;
      if(abwPct > 0.20) add(warnen, "Zutaten",
        `Zutaten ergeben ${Math.round(summeG)} g, Sollgewicht ist ${Math.round(rz.sollgewichtG)} g.`);
    }

    // V-11: Zellengroesse "Phasen (JSON)" — ab 25'000 Zeichen warnen, ab 32'000 abweisen
    // (Excel-Limit 32'767, FORMAT.md).
    const laenge = JSON.stringify(Editor.normalisiert(phasen)).length;
    if(laenge > 32000) add(abweisen, "Phasen (JSON)",
      `Zelle würde ${laenge} Zeichen umfassen — über dem Excel-Limit (32'767).`);
    else if(laenge > (CONFIG.zellenWarnung || 25000)) add(warnen, "Phasen (JSON)",
      `Zelle umfasst ${laenge} Zeichen — nähert sich dem Excel-Limit.`);

    return { ok: abweisen.length === 0, abweisen, warnen };
  },

  // Zaehlt Aenderungen fuer die Vorschau (§3 Schritt 2) — Phasenstruktur/-reihenfolge ist in
  // diesem AP nicht editierbar, darum reicht ein positionaler Vergleich je Phase.
  diff(originalPhasen, entwurfPhasen){
    let anzahl = 0;
    const details = [];
    const len = Math.max(originalPhasen.length, entwurfPhasen.length);
    for(let pi = 0; pi < len; pi++){
      const po = originalPhasen[pi], pn = entwurfPhasen[pi];
      if(!po || !pn) continue;
      const zo = po.zutaten || [], zn = pn.zutaten || [];
      for(let zi = 0; zi < Math.max(zo.length, zn.length); zi++){
        const a = zo[zi], b = zn[zi];
        if(!a && b){ anzahl++; details.push(`+ ${b.name || "(neu)"} (${po.name})`); }
        else if(a && !b){ anzahl++; details.push(`− ${a.name} (${po.name})`); }
        else if(a && b && (a.name !== b.name || a.prozent !== b.prozent || a.einheit !== b.einheit)){
          anzahl++; details.push(`${a.name} → ${b.name || "?"} (${po.name})`);
        }
      }
      const so = po.schritte || [], sn = pn.schritte || [];
      for(let si = 0; si < Math.max(so.length, sn.length); si++){
        const a = so[si], b = sn[si];
        if(!a && b){ anzahl++; details.push(`+ Schritt in „${po.name}“`); }
        else if(a && !b){ anzahl++; details.push(`− Schritt in „${po.name}“`); }
        else if(a && b && a.text !== b.text){ anzahl++; details.push(`Schritt geändert in „${po.name}“`); }
      }
    }
    return { anzahl, details };
  },

  // Fasst mehrfach vorkommende Zutaten derselben Phase zusammen (Aktion zu V-4): Mengen
  // werden addiert, die erste Zeile bleibt (Name/Einheit), die weiteren entfallen.
  zusammenfassen(phasen, phaseIndex, nameKey){
    const neu = phasen.map(ph => ({ ...ph, zutaten: ph.zutaten.map(z => ({ ...z })) }));
    const ph = neu[phaseIndex];
    if(!ph) return neu;
    let erste = null;
    ph.zutaten = ph.zutaten.filter(z => {
      if(Model.nameKey(z.name) !== nameKey) return true;
      if(!erste){ erste = z; return true; }
      erste.prozent = (Number(erste.prozent) || 0) + (Number(z.prozent) || 0);
      return false;
    });
    return neu;
  }
};

      {name:"Formen & Backen",
       zutaten:[{name:"Ei",prozent:0.060,einheit:"g"}],
       schritte:[{nr:1,text:"Zopf flechten, 60 Min. gehen lassen."},
                 {nr:2,text:"Mit Ei bestreichen, 180 °C, 30–35 Min. backen."}]}
    ],
    backprotokoll:[
      {datum:"2026-06-08", sollG:900, istG:842, notizen:"Etwas trocken, 5 Min. kürzer backen."}
    ],

  }
];

/* ---------- Store ------------------------------------------------------- */
const Store = {
  rohstoffe:[], rezepte:[], rezepteFehlerhaft:[],
  aktuellesRezept:null, faktor:1,
  suchtext:"", kategorie:"", offenePhasen:new Set(),
  // AP-0302: Workbook-Objekte des zuletzt geladenen Bestands, fuer AP-0315-Uebernahme
  // (null bei Beispieldaten — Import bleibt dann im Speicher dieser Sitzung).
  rezepteWorkbook:null, rezepteSheetName:null, rohstoffeWorkbook:null, rohstoffeSheetName:null,
  // AP-0305: eTag von Rezepte.xlsx im Moment des letzten Ladens/Schreibens — Basis fuer die
  // Konflikterkennung vor jedem Schreiben (kein If-Match auf der Workbook-API, siehe Data.updateCell).
  rezepteETag:null,
  // AP-0318: gleiches Prinzip fuer Rohstoffe.xlsx — Basis fuer die Konflikterkennung vor
  // jedem Schreiben aus dem Recherche-Dialog (App.rechercheUebernehmen()).
  rohstoffeETag:null,
  // AP-0305: Zustand des Backprotokoll-Eingabeformulars, null = geschlossen (App.backEintragOeffnen()).
  backEintrag:null,
  // AP-0315: Zustand des Import-Dialogs, ein Objekt pro Durchlauf (App.importOeffnen()).
  import:null,
  // AP-0318: Zustand des Recherche-Dialogs ("Preise aktualisieren"), ein Objekt pro Durchlauf
  // (App.rechercheOeffnen()); null = Dialog geschlossen.
  recherche:null,
  // AP-0311: Zustand des jeweils einen offenen Formulars im Entwicklungsmodus-Block — nur eins
  // gleichzeitig, gleiches Prinzip wie Store.backEintrag/Store.import. art unterscheidet
  // "version" (neu/bearbeiten), "versuch", "diff" und "befoerdern"; null = kein Formular offen.
  devForm:null,
  // AP-0313: IDs der bis zu 3 gewaehlten Referenzrezepte. Bewusst nur sitzungslokal — der
  // Vergleich ist eine Ansicht, kein Rezeptinhalt; nichts davon wird nach Rezepte.xlsx
  // geschrieben (Spez. AP-0203 §5 verlangt keine Persistenz).
  referenzIds:[],
  // AP-0302/B2: Haken der Einkaufsliste, { [rezeptId]: Set<nameKey> } — rein sitzungslokal
  // (AP-0201 §3.5: "kein neuer Datenbestand, nichts wird nach Rezepte.xlsx geschrieben"),
  // kein localStorage. Je rezeptId gehalten statt global, damit ein Zwischenwechsel auf ein
  // anderes Rezept (z. B. beim Kochen eines Menüs) die Haken nicht verwirft — gleiches Prinzip
  // wie korrekturen[rezeptId] in §3.4, nur ohne dessen Persistenz.
  einkaufslisteAbgehakt:{},
  // AP-0303: Zustand des Bestaetigungsdialogs "Ins Rezept übernehmen" (B4) — analog zu
  // Store.backEintrag/Store.devForm, aber ohne eigene Formularfelder (reine Vorschau +
  // Bestaetigen/Abbrechen); false = geschlossen.
  korrekturUebernehmenOffen:false,
  // AP-0305: Zustand des Zutaten-Editors, null = geschlossen (App.zutatenEditorOeffnen()).
  // { rezeptId, phasen (Entwurf, tiefe Kopie von rz.phasen), vorschauBestaetigt, pruefung,
  //   konflikt } — konflikt != null waehrend des Dialogs aus AP-0203 §4.
  zutatenEditor:null
};

/* ---------- Korrekturen: Kochkorrekturen je Rezept (B4, AP-0201 §3) --------------
   Eine Korrektur ist NIE ein Schreibpfad nach Rezepte.xlsx — nur die ausdrueckliche
   Aktion "Ins Rezept übernehmen" (App.korrekturenUebernehmenBestaetigt) schreibt
   (AP-0203 §6.3). Ablage in localStorage unter "libarius.korrekturen.v1"
   (Settings-Schluessel "korrekturen"), unbegrenzt bis Gianluca sie ausdruecklich
   verwirft (§3.5) — anders als Store.einkaufslisteAbgehakt oben, das bewusst
   sitzungslokal bleibt. Schluessel je Zutat ist "<phasenIndex>/<zutatIndex>": das
   Datenmodell kennt keine eigenen Phasen-/Zutaten-IDs (auch Store.offenePhasen und
   details.phase[data-i] arbeiten schon mit dem Index), ein zusaetzliches ID-Feld
   waere hier eine eigene Abweichung vom bestehenden Modell. */
const Korrekturen = {
  alle: Settings.get("korrekturen", {}),
  // Liefert IMMER ein Objekt mit zutaten/notiz/uebernommen, legt es bei Bedarf an —
  // Aufrufer muss nie auf undefined pruefen (gleiches Prinzip wie Store.einkaufslisteAbgehakt).
  get(rezeptId){
    if(!Korrekturen.alle[rezeptId]) Korrekturen.alle[rezeptId] = { zutaten:{}, notiz:"", uebernommen:[] };
    return Korrekturen.alle[rezeptId];
  },
  speichern(){ Settings.set("korrekturen", Korrekturen.alle); },
  // AP-0201 §3.4: die Rezeptliste in B1 markiert Rezepte mit offenen Korrekturen mit einem Punkt.
  hatOffene(rezeptId){
    const k = Korrekturen.alle[rezeptId];
    return !!(k && (Object.keys(k.zutaten).length || (k.notiz && k.notiz.trim())));
  }
};

/* ---------- Entwurf: nicht gespeicherter Editor-Entwurf je Rezept (AP-0305/AP-0203 §4) ---
   Eigener localStorage-Schluessel ("libarius.entwurf.v1", ausserhalb von Settings, weil er
   NICHT unter "libarius." + Feldname laufen soll — die Spezifikation nennt den Schluessel
   woertlich). Greift bei einem eTag-Konflikt (§4.1 Schritt 2) und bleibt ueber Reload und
   Sitzungsende hinweg stehen, bis er ausdruecklich gespeichert oder verworfen wird (§4.4). */
const Entwurf = {
  SCHLUESSEL: "libarius.entwurf.v1",
  alle(){
    try{ return JSON.parse(localStorage.getItem(Entwurf.SCHLUESSEL) || "{}"); }
    catch(e){ return {}; }
  },
  speichern(rezeptId, phasen){
    const alle = Entwurf.alle();
    alle[rezeptId] = { ts: new Date().toISOString(), phasen };
    try{ localStorage.setItem(Entwurf.SCHLUESSEL, JSON.stringify(alle)); }catch(e){}
  },
  lesen(rezeptId){ return Entwurf.alle()[rezeptId] || null; },
  verwerfen(rezeptId){
    const alle = Entwurf.alle();
    delete alle[rezeptId];
    try{ localStorage.setItem(Entwurf.SCHLUESSEL, JSON.stringify(alle)); }catch(e){}
  }
};

/* ---------- NavGruppen: Aufklappzustand der Kategorien in B1 (AP-0302) -----------
   AP-0201 §1 verlangt fuer B1 "Zustand gemerkt: ja, je Gerät (localStorage)" — analog zu
   Layout weiter unten, aber je Kategorie statt je Bereich. Gespeichert wird nur die Menge
   der GESCHLOSSENEN Kategorien: eine neue Kategorie (z. B. nach einem Import) ist so ohne
   Migrationsschritt automatisch offen. */
const NavGruppen = {
  zu: new Set(Settings.get("navZu", [])),
  offen(kat){ return !NavGruppen.zu.has(kat); },
  toggle(kat, offen){
    offen ? NavGruppen.zu.delete(kat) : NavGruppen.zu.add(kat);
    Settings.set("navZu", [...NavGruppen.zu]);
  }
};

/* ---------- View -------------------------------------------------------- */
const el = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const nf = (v,d=1) => v==null ? "—" : Number(v).toFixed(d);
const chf = (v) => v==null ? "—" : "CHF " + Number(v).toFixed(2);
const pct = (v,d=1) => v==null ? "—" : (v*100).toFixed(d) + " %";

const View = {
  meldung(text, art, titel){
    const box = el("#meldungen");
    const d = document.createElement("div");
    d.className = "msg " + (art||"");
    d.innerHTML = (titel ? "<b>"+esc(titel)+"</b>" : "") + esc(text);
    box.appendChild(d);
  },

  kategorienFuellen(){
    const sel = el("#kategorie");
    sel.innerHTML = '<option value="">Alle Kategorien</option>';
    const kats = [...new Set(Store.rezepte.map(r => r.kategorie).filter(Boolean))].sort();
