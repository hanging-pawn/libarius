[project]
name = "kochassistent"
version = "0.0.0"
description = "Kochassistent-LLM — kleines, auf Kochbuchwissen feinabgestimmtes Sprachmodell (isoliertes Unterprojekt von Libarius)"
requires-python = ">=3.11"
# Training läuft in Unsloth Studio (Entscheid KA-O-03). Abhängigkeiten der Pipeline folgen mit dem
# Lehrer-Modell-Benchmark (REQ-050) — siehe REQUIREMENTS.md.
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
